name: nuwa 8796 merged source kernel

on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: Exact reviewed UniXNU-nuwa commit
        required: true
        type: string
      ramblock_archive_check:
        description: Compile the late RamBlock archive with this build's private headers (no runtime activation)
        required: false
        default: false
        type: boolean
      ramblock_kernel_link_check:
        description: Link late RamBlock and its initialization into the source kernel (no donor prelink or device boot)
        required: false
        default: false
        type: boolean
      verified_ufs_check:
        description: Build authenticated NativeUfs and crypto with current iOS16 private headers; no root policy or device activation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nuwa-8796-merged-source
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  DEVICE_REF: ${{ inputs.device_ref }}

jobs:
  kernel:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout reviewed base
        uses: actions/checkout@v4
        with:
          repository: wh1stl3/UniXNU
          ref: e553e467ebfe7642e9f483d3977a57066c6d1aef
          path: base
          persist-credentials: false
      - name: Checkout nuwa input
        uses: actions/checkout@v4
        with:
          repository: wh1stl3/UniXNU-nuwa
          ref: ${{ inputs.device_ref }}
          path: device
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check fixed host and record actual tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nuwa-host"
          {
            test -d "$DEVELOPER_DIR"
            echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
            sw_vers
            uname -m
            xcodebuild -version
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos --show-sdk-path
            xcrun --sdk iphoneos clang --version
            xcrun --sdk iphoneos --find iig
            xcrun --sdk iphoneos --find mig
          } 2>&1 | tee "$RUNNER_TEMP/nuwa-host/toolchain.log"
      - name: Install base host dependencies
        run: brew install cmake ninja unifdef
      - name: Fetch all pinned upstream source modules
        shell: bash
        run: |
          set -euo pipefail
          git -C base submodule update --init --depth 1 --jobs 4
      - name: Validate fixed source inputs
        shell: bash
        run: |
          [[ "$DEVICE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$DEVICE_REF" = "$(git -C device rev-parse HEAD)"
          test "$(git -C base rev-parse HEAD)" = e553e467ebfe7642e9f483d3977a57066c6d1aef
          python3 -B device/scripts/ci/build-8796-source.py --base base --profile merged --check
      - name: Compile and link 8796 source kernel
        shell: bash
        run: |
          set -o pipefail
          GITHUB_TOKEN=${{ github.token }} python3 -u -B device/scripts/ci/build-8796-source.py --base base --profile merged \
            2>&1 | tee "$RUNNER_TEMP/nuwa-host/kernel-console.log"
      - name: Build RamBlock with current private compiler inputs
        if: ${{ inputs.ramblock_archive_check || inputs.ramblock_kernel_link_check || inputs.verified_ufs_check }}
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm
          provider_args=()
          if [ "${{ inputs.ramblock_kernel_link_check }}" = "true" ] || [ "${{ inputs.verified_ufs_check }}" = "true" ]; then provider_args+=(--ufs-provider); fi
          python3 -B device/scripts/ci/build-ramblock-archive.py \
            --work "$RUNNER_TEMP/nuwa-8796-source" --base base \
            --llvm-bin "$(brew --prefix llvm)/bin" "${provider_args[@]}"
      - name: Link RamBlock and initialize before IOBSD publication
        if: ${{ inputs.ramblock_kernel_link_check }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B device/scripts/ci/build-ramblock-kernel.py \
            --work "$RUNNER_TEMP/nuwa-8796-source"
      - name: Compile authenticated NativeUfs separately
        if: ${{ inputs.verified_ufs_check }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B device/scripts/ci/build-verified-ufs.py \
            --work "$RUNNER_TEMP/nuwa-8796-source" --llvm-bin "$(brew --prefix llvm)/bin"
      - name: Collect build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuwa-8796-merged-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nuwa-host/**
            ${{ runner.temp }}/nuwa-8796-source/reports/**
            ${{ runner.temp }}/nuwa-8796-source/build/xnu/ios-obj/**/mach.development.bcm2837*
            ${{ runner.temp }}/nuwa-8796-source/build/driver-archives/**
            ${{ runner.temp }}/nuwa-8796-source/build/ramblock-archive/*.a
            ${{ runner.temp }}/nuwa-8796-source/build/ramblock-archive/*.o
            ${{ runner.temp }}/nuwa-8796-source/build/ramblock-link/**
            ${{ runner.temp }}/nuwa-8796-source/build/verified-ufs/*.a
            ${{ runner.temp }}/nuwa-8796-source/build/verified-ufs/*.o
          if-no-files-found: error
          retention-days: 7
