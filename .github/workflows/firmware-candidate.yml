name: nuwa EFI FD BootShim candidate

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Approved firmware build profile
        type: choice
        default: dedicated
        options:
          - dedicated
          - sec-trace
          - pil-no-auto
          - dxe-allocation
          - factory-heap
          - sec-handoff
          - constructor-trace
          - mmu-branches
          - hob-query
          - volume-envelope
          - hob-integrity
          - volume-status
          - embedded-probe
          - boot-input-audit
          - hob-stage-audit
          - hob-cache-handoff

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
      FW_PROFILE: ${{ inputs.profile || 'dedicated' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Previous runner stalled while fetching cross-GCC from the Azure mirror.
          # Keep Ubuntu's signed repositories and change only that mirror hostname.
          mapfile -d '' task_apt_sources < <(find /etc/apt -maxdepth 2 -type f \( -name sources.list -o -name '*.list' -o -name '*.sources' \) -print0)
          test "${#task_apt_sources[@]}" -gt 0
          sudo sed -i -E -e 's@https?://azure.archive.ubuntu.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' \
            -e 's@mirror\+file:/etc/apt/apt-mirrors.txt@https://archive.ubuntu.com/ubuntu@g' "${task_apt_sources[@]}"
          grep -H -E '^(URIs:|[[:space:]]*deb )' "${task_apt_sources[@]}"
          if grep -H -E 'azure[.]archive[.]ubuntu[.]com|mirror\+file:' "${task_apt_sources[@]}"; then
            echo 'Unreplaced Azure mirror or mirror indirection remains in an APT source' >&2
            exit 1
          fi
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            timeout --signal=TERM --kill-after=30s 180s \
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            timeout --signal=TERM --kill-after=30s 360s \
            apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends build-essential uuid-dev nasm clang lld llvm gcc-aarch64-linux-gnu mono-devel gettext python3-venv
          python3 -m venv "$RUNNER_TEMP/firmware-venv"
          echo "$RUNNER_TEMP/firmware-venv/bin" >> "$GITHUB_PATH"
      - name: Build approved candidate only
        run: python3 scripts/ci/build-firmware-candidate.py --profile "$FW_PROFILE"
      - name: Inspect MMU branch diagnostic firmware
        if: env.FW_PROFILE == 'mmu-branches' || env.FW_PROFILE == 'hob-query' || env.FW_PROFILE == 'volume-envelope' || env.FW_PROFILE == 'hob-integrity' || env.FW_PROFILE == 'volume-status' || env.FW_PROFILE == 'embedded-probe' || env.FW_PROFILE == 'boot-input-audit' || env.FW_PROFILE == 'hob-stage-audit' || env.FW_PROFILE == 'hob-cache-handoff'
        run: >-
          python3 scripts/ci/inspect-firmware-candidate.py out/firmware-ci
          --output out/firmware-ci/artifact-inspection.json
          --publisher-name NuwaBootMemoryDxe --require-sec-trace
          --require-no-auto-abl --require-allocation-trace --allocation-profile "$FW_PROFILE"
      - name: Preserve evidence and approved artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuwa-firmware-${{ github.run_id }}
          path: out/firmware-ci
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
