# 官方 format 2（schema_version = 2）。结构参考 UniXNU-sheng/board.toml，不含任何 sheng 板级值。
# 解析器按 arch → soc → os → device 顺序合并；表按键合并，数组整体替换。
schema_version = 2

[board]
name = "nuwa"
soc = "SM8550"
soc_source = "sm8550"
# 官方树不自带 iOS 16 profile；本工作区在 UniXNU/profiles/os/ios-16.7.16-20H392 自建（见 docs/nuwa-ios16-profile-plan-2026-11-06.md）。
os_profile = "ios-16.7.16-20H392"
description = "Xiaomi 13 Pro (nuwa), SM8550, iOS 16.7.16 target"
kit = "nuwa"

[components]
# 仅列输入已满足的组件；存储/显示/输入/GPU/AES 待板级输入与 ABI 审查后按规范 ID（ShengUfs、GopFramebuffer…）追加。
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "nuwa_defconfig"
config_fragments = ["arch:configs/common.config"]
# 8796 线：arch/soc series 仍面向 10063 且 13 条 arch 补丁对 8796 失效；device series 承载最小 8796 集（arch 经前缀引用，失败者改 8796- 移植版）。
patch_series = ["device:patches/xnu/series"]
# The arch profile archive list includes SoftwareAES, its AES bindings, the mockfs fixture and the source libpthread. Stage 5 needs none of them (no root volume, no AES, mockfs is off),
# and the series leaves their patches out (libpthread: the pinned source is libpthread-519, written for the 10063 pthread_callbacks_s layout, which 8796 does not have), so the list is replaced (plain arrays are replaced as a whole) with what stage 5 uses; re-add them with the storage/AES step.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
]

# The OS profile ships os_volume_uuid = "REQUIRED_ROOT_VOLUME_UUID" (a placeholder) which stops the kernel bootstrap pass.
# Stages 1-5 do not use the owner boot manifest, so it is emptied for this profile (same reasoning as the omitted
# [payload.adt] root_match_volume_uuid). The real OS APFS volume UUID is read from the built userdata image before stage 6.
# 8796's makedefs have no CTF stage, so the linked kernel is mach.development.bcm2837.unstripped (the profile names the 10063 file .unstripped.noctf).
[os_overrides."ios-16.7.16-20H392".kernel.prelink]
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped"

[os_overrides."ios-16.7.16-20H392".root]
os_volume_uuid = ""

[device_tree]
source = "device:dts/nuwa.dts"
include_dirs = ["soc:dts"]

[ipsw]
product = "iPhone10,3"
version = "16.7.16"
build = "20H392"
device_class = "d22ap"
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache"]
# url / chip_id / board_id and the fetch set above come from the selected OS profile
# (UniXNU/profiles/os/ios-16.7.16-20H392, UniXNU commit 693f5d9cae8a408dd18b39f3f9fdc4228c934241):
# the iPhone10,3,iPhone10,6 16.7.16_20H392 restore URL, chip_id 0x8015, board_id 6 (d22ap Erase identity),
# with [ipsw.sha256] pinning DeviceTree.d22ap.im4p and 087-86698-044.dmg.trustcache. Nothing is duplicated here.
# Still missing: the [ipsw.sha256] pin of the KernelCache member (kernelcache.release.iphone10b); the OS and
# Cryptex1,SystemOS member hashes are taken at the userdata stage.

[payload]
volume = "NUWAESP"
size_mib = 192
loader = "firmware"
title = "UniXNU"
# R-012 批准 A（2026-10-24）：实机 FDT /memory 9 条 reg 合并后最大连续段跨度 0x240000000（base 0x8c0000000，9216 MiB）。
dram_size = "0x240000000"
kernel_args = ["-v", "serial=3"]
# Boot-menu Tools entry (id = "tools", action = "tools") for reading the firmware's exported log.
tools = true

[userdata]
# Read-only GPT dump of the userdata entry (sda32, LUN 0) taken from the running device in recovery on 2026-11-07;
# the primary GPT header and entry array were read with dd and parsed on the host, no partition was written.
first_lba = 3110976
last_lba = 61850618
lba_bytes = 4096

[payload.adt]
# format 2：ADT 由共享生成器从 dts/nuwa.dts + OS profile 身份产出，不再声明 tool。
# chip_id is the u32 ADT /chosen/chip-id, a software identity value that seeds IOPlatformUUID together with the
# unique-chip-id; it is not an Apple silicon ID. The donor DeviceTree carries chip-id = 0 (a template placeholder
# that iBoot fills at run time), so there is no donor value to copy. This value was drawn at random on 2026-11-07,
# is nonzero, and differs from sheng's value and from the donor ApChipID 0x8015. Keep it stable once images exist.
chip_id = "4acab8db"
# R-012 批准 A：窗口上界 1 GiB；固件能否返回该连续 conventional memory 未验证。
owned_memory_size = "0x40000000"
# 实机 FDT /cpus/cpu@0..cpu@700：Affinity1 编号 0x000..0x700，共 8 核。
cpu_regs = "0,256,512,768,1024,1280,1536,1792"
# 实机 FDT /soc/psci method = "smc"。
psci_method = "smc"
# nuwa 目标为 iOS（iPhone donor），不做 iPad 身份化。
ipad_identity = false
# root_match_volume_uuid is intentionally omitted for bring-up stages 1-5 (fastboot boot with the in-memory Data seed):
# the generator then writes no /chosen/root-matching. A non-empty placeholder would fail uuid parsing, so it must not
# be left in place. Bring-up stage 6 needs the OS APFS volume UUID read from the built userdata image, and the same
# value belongs in the OS profile [root] os_volume_uuid.
# root_match_volume_uuid = "<OS APFS volume UUID, after build userdata>"

[firmware]
config = "nuwa"
dsc = "Platforms/Xiaomi/nuwaPkg/nuwa.dsc"
fd = "Build/nuwaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# Runs from the assembled tree (cwd = tree) with UNIXNU_UEFI; it stages the firmware FDT blob as
# [bootimg] dtb. Copy only: no node or value is edited, and the FDF-embedded blob is not an appended DTB.
preflight = ["scripts/prepare-nuwa-firmware.py"]
# Mu-Silicium 子模块：Common/Mu 与 Mu_OEM_Sample 提供 MdePkg/MdeModulePkg，openssl 供 Silicium 的 TLS 库；
# Mu_Basecore 通过 --edk2/UNIXNU_EDK2 指定，Binaries 是厂商二进制（不入库）。
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
# Mu-Silicium 的 GIC 伪中断修复：两个仓的 Resources/MuPatches 都有该补丁，sheng 同基座也在用；
# 首次固件构建时须确认它仍能干净应用到共享 edk2 树。
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}",
  "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "nuwa"
# SiliciumPkg.dsc.inc passes -D ENABLE_SECUREBOOT=$(ENABLE_SECUREBOOT) unconditionally; unixnu runs the EDK II build
# directly and skips Mu-Silicium's build_uefi.py, whose default is 0 (--enable-secureboot is opt-in), so set it here.
ENABLE_SECUREBOOT = "0"

[bootimg]
# Relative to the build tree only (the base resolves ctx.tree / dtb; {uefi} and other templates are
# not supported). scripts/prepare-nuwa-firmware.py copies the firmware FDT blob here during preflight.
dtb = "build/nuwa/sm8550-xiaomi-nuwa.dtb"

[package]
unixnu = "../../UniXNU"

[package.defconfig]
"ios-16.7.16-20H392" = "nuwa_defconfig"
