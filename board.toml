[board]
name = "nuwa"
soc = "SM8550"
description = "Xiaomi 13 Pro / iOS 16 bring-up"
example = true
# TODO: kit，尚无经审查的nuwa平台kit，不能照抄sheng实现。

[ipsw]
product = "iPhone10,3"
version = "16.7.16"
build = "20H392"
device_class = "d22ap"
# TODO: url/chip_id/board_id/sha256；缺donor BuildManifest及组件哈希核对。

[payload]
# R-012 批准 A（2026-10-24）：实机 FDT /memory 的 9 条 reg 合并后最大连续段跨度
# 0x240000000（base 0x8c0000000，精确 9216 MiB，2 MiB 对齐），与 D-001 独立吻合。
# 这是广告给内核的物理 DRAM 大小，不是分配承诺。
dram_size = "0x240000000"
# TODO: volume/size_mib/kernel_args、[userdata] LBA，缺本轮GPT证据核对。

[payload.adt]
# 2026-10-24: 设备仓自己的 ADT 生成器落地，契约见 UniXNU docs/zh/concepts/payload.md。
# 设备仓 scripts/ 会被拷进构建树 scripts/，因此这里是相对路径。
tool = "scripts/make-nuwa-adt.py"
ipad_identity = true
# 实机 FDT /cpus/cpu@0..cpu@700：Affinity1 编号 0x000..0x700，共 8 核。
cpu_regs = "0,256,512,768,1024,1280,1536,1792"
# 实机 FDT /soc/psci method = "smc"。
psci_method = "smc"
# R-012 批准 A（2026-10-24）：D-002 首版窗口 512 MiB–1 GiB，取上界 1 GiB。
# 固件能否返回这样一段连续 conventional memory 仍未验证，属启动资格问题。
owned_memory_size = "0x40000000"
# TODO: chip_id/unique_chip_id —— 平台种子不入库，构建时用 --unique-chip-id 或
#   UNIXNU_UNIQUE_CHIP_ID 传入；board 侧置 unique_chip_id = "required" 须先定 chip_id。
# TODO: [kernel] defconfig/archives，缺8796配置及Darwin22接口审查。
# TODO: [kernel.prelink] 全部数值，缺donor kernelcache分析；不借sheng/fuxi值。
# TODO: [firmware] 配置/路径与 [bootimg.image] 地址/offset，缺nuwa装载证据。
