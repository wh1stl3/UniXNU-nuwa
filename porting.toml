schema_version = 1

[device]
name = "nuwa"
soc = "SM8550"
os_profile = "ios-16.7.16-20H392"
summary = "Xiaomi 13 Pro (SM8550), official step 7. 2026-11-15 milestone: the native UFS root volume mounts (native-ufs-root=1, no ramdisk, boot-uuid DADD93F8-...-0F11E64172F7) and launchd reaches user space; userdata's first 8446279680 B were written and read back as da429da6...68d7, and boot_a/vendor_boot_a now carry the payload. The launchd path runs on three opt-in bypasses (root auth skipped, runtime trust cache empty, initproc exec policy ignored); authentication is NOT REACHED. Host artifacts are self-checked and the device observation is parent/user-reported. The interaction target is not met: launchd completion, the display service and reboot-to-same-system are unverified."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/xnu/series", ".github/**", ".gitignore", "local.toml.example", "scripts/__pycache__/**", "scripts/**/__pycache__/**", "scripts/macos/dyld-extract.sh", "scripts/macos/seed-add-dir.sh"]
inputs = ["SM8550 common repository commit (pinned in feeds.toml).", "The iOS 16.7.16-20H392 OS profile at UniXNU/profiles/os/ios-16.7.16-20H392, authored locally in UniXNU commit 693f5d9cae8a408dd18b39f3f9fdc4228c934241; the official profiles/os tree ships iPadOS 17.7.11, iPadOS 26.5.2 and iOS/iPadOS 27.0.1 only.", "The donor KernelCache member hash for [ipsw.sha256]; the profile already carries the IPSW url, chip_id, board_id and the DeviceTree plus StaticTrustCache member hashes read from the donor BuildManifest."]
configuration = ["board.toml schema_version = 2 with [board], [components], [kernel], [device_tree], [firmware], [payload], [payload.adt], [package].", "feeds.toml pins UniXNU-sm8550-common at a9f45dc60c035084b95463781538380f4c3606c9.", "dts/nuwa.dts includes soc:dts sm8550.dtsi and carries the measured DRAM span only.", "board.toml [ipsw] declares product, version, build, device_class and fetch only; url, chip_id, board_id and the member hashes are inherited from the selected profile instead of being duplicated.", "[payload] tools = true adds the Tools entry to the generated payload boot menu."]
procedure = ["./unixnu defconfig nuwa_defconfig -D ../UniXNU-nuwa", "./unixnu fetch -D ../UniXNU-nuwa", "./unixnu status --json -D ../UniXNU-nuwa", "./unixnu tree -D ../UniXNU-nuwa"]
findings = ["2026-11-25 metadata: configuration owns scripts/macos/dyld-extract.sh and scripts/macos/seed-add-dir.sh; macOS VM helper scripts documented in docs/nuwa-macos-vm-pipeline-20261124.md; no script logic changed.", "2026-11-25 complete directory seed: 30 new, zero skipped; two SystemGroup cache ownership deviations use 501:501; host/VM self-checked only, pending final package and runtime, see docs/nuwa-seed-full-20261125.md.", "2026-11-24 disk cleanup: D: free space increased by 82.5 GiB; retained evidence and explicit rule exception recorded in docs/cleanup-20261124.md; self-checked record, no independent verifier.", "2026-11-22 Apple logo and display handoff observed after display-scale restoration; mobileactivationd repeatedly crashes, persistent interaction not reached; device observations parent-reported, see docs/nuwa-logo-milestone-20261122.md.", "2026-11-22 resume-only packaging restores experimental chosen display-scale u32 3; outer ADT compared to rotation baseline with only that addition; host self-checked, reviewer and deep review pending; see docs/nuwa-resume-display-scale-20261122.md.", "2026-11-21 r35i host diagnostic adds experimental /chosen/display-scale u32 3 matching existing artwork metadata, without replacing properties; panel measurement and reviewer/deep review pending; see docs/nuwa-r35i-display-scale-20261121.md.", "2026-11-20 board.toml [components] include gains GopFramebuffer. The component is build_stage = embedded with build = [], so selecting it produces no archive; the board.toml [kernel] archives list is unchanged and no build was run. The display area now declares GopFramebuffer as its component, and the unbuilt board half plus the derived 20H392 ABI are recorded there.", "2026-11-15 device configuration state that reached launchd: patches/xnu/series mounts 8796-vfs-getvfs-with-vfsops.patch (the APFS root needs _vfs_getvfs_with_vfsops), while the three launchd-path bypass patches stay opt-in outside the series; board.toml [os_overrides] root list now also pulls com.apple.kec.pthread so the donor pthread prelink is bound. No pin, feed or OS profile value changed.", "2026-11-13 VFS bridge registered; isolated native object symbol, header and export list plus six actual-source contract cases self-checked. This does not discover a root device; concurrent lifetime and final kernel export remain unverified.", "Doc-path hygiene: board.toml and porting.toml now reference the live docs (docs/context-brief.md, docs/decisions.md, docs/routing.md); no configuration value changed.", "The local iOS 16 OS profile lives at UniXNU/profiles/os/ios-16.7.16-20H392 (UniXNU commit 693f5d9cae8a408dd18b39f3f9fdc4228c934241): xnu 8796.141.3 (1b191cb58250d0705d8a51287127505aa4bc0789), the donor IPSW url/product/build/device_class (d22ap, chip 0x8015, board_id 6), the DeviceTree and StaticTrustCache sha256 pins, ADT identity D22AP, kernelcache sha256 and the 31 prelink roots verified against the donor __PRELINK_INFO; board.os_profile and [device].os_profile select it.", "board.toml sets [firmware] preflight and [bootimg] dtb = 'build/nuwa/sm8550-xiaomi-nuwa.dtb'; the dtb path is relative to the build tree, the base ctx.tree/dtb does not expand a {uefi} template, and an FDF-embedded DTB does not automatically become the appended DTB.", "Official step 4 is complete: defconfig, fetch, status --json and tree resolve the board against that profile, and the fetch is recorded on 279c990a0c7a238aa0a5818493c6cd6a46528749 (unixnu.lock: xnu 1b191cb5, sm8550 a9f45dc6, edk2 cfb93724, libplatform a00a4cc3, libdispatch 30fe6a7d, libpthread c0e60fb5, AvailabilityVersions 933f9360, corecrypto-2023 11fba65b, IOStorageFamily e45fbe30). Step 5 (hardware description and firmware) is in progress.", "The official profiles/os tree ships iPadOS 17.7.11, iPadOS 26.5.2 and iOS/iPadOS 27.0.1 only, which is why this profile is authored locally; profile selection is no longer blocked.", "Kernel patch set (2026-11-08, host-only, self-checked): on xnu-8796.141.3 (1b191cb58250d0705d8a51287127505aa4bc0789) 13 of the 56 arch patches fail plain git apply, so board.toml [kernel] patch_series now mounts only device:patches/xnu/series, a 17-entry minimal set for stage 5: 13 arch patches by arch: reference plus four local 8796 ports (apple-only-cpu-tunables, non-apple-iommu-bootstrap, source-machine-layer, zzx-pmap-sync-64bit-pa). The optional storage, GPU, AES, exec, systemos, cryptex, trust, userland and mockfs patches are not mounted; pgz-aligned-validation and published-freezer-condition do not apply because their target code is absent in 8796. The set applies cumulatively to a clean 8796 clone and unixnu status --json resolves the same order; nothing has been compiled and the four ports plus four high-risk arch patches (native-4k-bootstrap-capacity, native-4k-user-abi, non-apple-cache-monitor, non-apple-pmap-field) have not been reviewed. Later (2026-11-08): nuwa_defconfig adds CONFIG_XNU_NATIVE_AES=n and CONFIG_XNU_SOURCE_PTHREAD=n, board.toml replaces the kernel archive list and points [kernel.prelink] at the 8796 kernel file; the kernel now builds and links, and prelink stops on an ABI gap against the donor kernelcache (see packaging). Update (2026-11-08): [kernel.prelink] roots now exclude apfs and Libm through board.toml and prelink stops at an external PC-relative encoding at 0xfffffff005b8c1cc.", "board.toml [payload] tools = true adds the Tools entry (id = tools, action = tools) to the generated EFI/UniXNU/unixnu.toml, so the exported firmware log can be read from the boot menu; the entry has not been exercised on hardware.", "board.toml [firmware.defines] now sets ENABLE_SECUREBOOT = 0 (2026-11-07): SiliciumPkg.dsc.inc:13 passes -D ENABLE_SECUREBOOT=$(ENABLE_SECUREBOOT) unconditionally, and unixnu runs the EDK II build directly instead of Mu-Silicium's build_uefi.py (default 0, --enable-secureboot is opt-in), so an empty macro failed the preprocessing of SecureBootHandler.c:216 (#if ENABLE_SECUREBOOT == 1). Self-checked with the define in place: the firmware build recorded in the firmware area exited 0, and the Verifier subagent later re-ran it independently; nothing has run on hardware.", "dts/nuwa.dts comment corrected (comment-only): scripts/unixnu/devicetree.py takes exactly one /memory node with one contiguous reg range, so the previous nine-segment TODO was wrong; the 0x8c0000000/0x240000000 geometry and the owned-window contract are unchanged (docs/step5-firmware.md).", "Repo hygiene: removed the committed __pycache__ copies of the format-1 legacy tooling; no source behaviour changes.", "Repo hygiene: the committed __pycache__ blobs were untracked and are ignored; scripts/ keep format-1 legacy tooling that still points at deleted absolute paths and is not part of the official flow.", "The SM8550 shared series targets XNU 10063/12377, so soc:patches/xnu/series is deliberately not selected for the 8796 line.", "[userdata] is populated in board.toml from the 2026-11-07 read-only GPT capture (docs/device-evidence-2026-11-07.md): first_lba = 3110976, last_lba = 61850618, lba_bytes = 4096, copied from the GPT dump parsed on the host; no GUID, serial, kernel command line content or chip seed is recorded.", "ADT identity values decided 2026-11-07 (docs/step5-firmware.md, 'ADT identity values'): ADT /chosen/chip-id (u32) and unique-chip-id (u64) are software identity seeds for IOPlatformUUID, not Apple silicon IDs; the generator checks only nonzero and width and never compares them against the SoC. The donor iPhone10,3 DeviceTree (base out/ipsw/20H392/DeviceTree.d22ap.dtb, an LZFSE-compressed ADT) carries chip-id = 0 and unique-chip-id = 0, template placeholders that iBoot fills at run time, so the donor offers no value to copy.", "chip_id = 4acab8db was drawn at random on the host on 2026-11-07: nonzero, and different from sheng's 0x8142 and from the donor ApChipID 0x8015. It is written in board.toml [payload.adt] and stays fixed once images exist.", "The unique-chip-id u64 seed is drawn at random on the host as eight hex digits and kept only in the git-ignored unixnu.local.toml of the base UniXNU checkout; no seed value is committed. Every build must reuse the same value, and if it is lost the same device gets a different IOPlatformUUID, so the user must back it up.", "root_match_volume_uuid is commented out in board.toml for bring-up stages 1-5: fastboot boot uses the in-memory Data seed, the generator omits /chosen/root-matching when the value is empty, and a non-empty placeholder fails UUID parsing. Before stage 6, read the OS APFS volume UUID (not the container UUID and not the Data volume UUID) from the built userdata image and write it to board.toml and to the OS profile [root] os_volume_uuid.", "Self-checked (2026-11-07, in memory, no device): generating the ADT from the real board.toml, the iOS 16 profile and the local seed returned 12984 bytes; /chosen carries chip-id = 0x4acab8db, an 8-byte nonzero unique-chip-id matching the local seed, dram-base = 0x8c0000000, dram-size = 0x240000000 and darwinboot-memory-size = 0x40000000, has no root-matching (expected at this stage), lists 8 cpu reg entries 0..1792, timebase-frequency = 0x124f800 and psci = smc, and arm-io holds only the intc child because nuwa.dts still describes CPU, memory and intc only (step 6 work). ephemeral-storage is absent because no Data seed was passed, which is a property of this run, not a stage 1-5 conclusion.", "board.toml [os_overrides.\"ios-16.7.16-20H392\".kernel.prelink].roots drops 4 of the profile's 31 roots for stage 5 (apfs, Libm, IOAVFamily, IOMobileGraphicsFamily); dropping IOAVFamily/IOMobileGraphicsFamily removes the transitive Libm dependency, and prelink then completes (host build, exit 0, 55,357,440-byte kernel.macho); host build only, self-checked.", "ADT identity TODO filled from the 20H392 (16.7.16) donor DeviceTree (Firmware/all_flash/DeviceTree.d22ap.im4p -> decoded 'bvx2' ADT at out/ipsw/20H392/dt.dtb): board.toml [os_overrides.\"ios-16.7.16-20H392\".adt.product] now carries product-id = fd079b298144a7deb4d7c87fef3eb474d8f0e7eb (20-byte MGProductType, dt.dtb offset 0x29544), artwork-device-subtype = 2436 (u32, dt.dtb offset 0x29e48) and corrects compatible-device-fallback from the profile's 'iPhone10,1' to 'iPhone9,2' (dt.dtb offset 0x29698); device-class (d22ap) identity, host-only, self-checked.", "early_security_init and text_fixups stay unset for stages 1-5 (recorded as skipped, not required): the 8796 early security initializer is a reversing task on the stripped AMFI kext (not a field lookup) and on a non-Apple SoC without an Apple PMGR running it risks the 'AMFI: No PMGR?' panic (same SoC family as nx769j/caihong, UniXNU docs/devices/nx769j.md); text_fixups are dyld-cache byte fixes only derivable when a boot reaches one (nx769j: 'there is nothing to derive before that'). AMFI still starts through its ordinary start routine without them.", "board.toml [payload] size_mib changed 192 -> 64: the prelinked kernel (~53 MiB) plus trust cache and ADT needs a FAT volume that fits the 96 MiB vendor_boot partition (192 MiB would not fit); 64 MiB keeps the volume-check headroom.", "board.toml [payload] now pins trust_cache_sha256 = [\"367e051548f9f0407fa9fe9d40007fa4e7c5ff27c45f5a7a30cedf344e24d98e\"] (a device-level array replacing the 20H392 profile's raw-hash pin 63e01c03… as a whole): the profile pins the raw StaticTrustCache IM4P hash, but DarwinBoot's ValidTrustCaches (DarwinBoot.c:371-397) only accepts the bundle format, which is why the on-device xnu entry returned EFI_COMPROMISED_DATA; the same donor module re-bundled with scripts/bundle-ipsw-trust.py is pinned instead. Host-only (self-checked).", "Entry probe for stage-4 diagnosis: board.toml [payload] panic_screen = true makes payload.build patch a copy of kernel.macho (scripts/patch-xnu-entry-probe.py --panic-screen --no-reset) - stage 1 blue bar at the MMU-off kernel entry, stage 2 magenta bar just before SCTLR_EL1, plus the _panic/_panic_trap_to_debugger redirect; no reset, so the panel stays lit and the device is recovered by holding power (PSCI SYSTEM_RESET would cold-boot Android). Host build only (self-checked).", "[payload] entry probe variant for stage 3 (2026-11-09, host build, self-checked): board.toml now sets entry_probe_reset_delay = 6 and panic_screen = false. Enabling panic_screen together with the reset delay makes the panic screen code (0xa2f bytes for nuwa's kernel) overflow the zero padding after _start by 0x5f (95) bytes past PANIC_CAVE_END, which scripts/patch-xnu-entry-probe.py refuses (same limitation as the alioth device record). This variant keeps the stage 1 blue bar, stage 2 magenta bar and the 6 s stage 3 PSCI SYSTEM_RESET; the panic path is not redirected.", "Entry probe stage 3 verified on device and switched to stage 4 bisect (2026-11-09): the stage-3 payload (entry_probe_reset_delay = 6, panic_screen = false) auto-rebooted ~6 s after the bars on hardware, proving the CPU passed the MMU enable (msr sctlr_el1) and kept executing. The project adaptation has not flashed userdata; before that, userdata had already been overwritten with Apple data by other operations, so Android cannot boot (user-reported, not independently verified). After reset, the device gets stuck at the Android boot animation and consumes retries for the active slot; slot A TWRP is unaffected. board.toml [payload] now adds entry_probe_reset_after = \"_ml_parse_cpu_topology\" (entry_probe_reset_in defaults to _arm_init, occurrence 1): stage 4 replaces stage 3 (payload.py:169-177 passes --reset-after; patch-xnu-entry-probe.py:389-396 emits exactly one site via elif, so the two never coexist and there is no masking). The 6 s timed PSCI SYSTEM_RESET now fires after the single _arm_init call to _ml_parse_cpu_topology (bl at 0xfffffff007998914, occurrence 1) instead of right after the MMU enable; a reset then means the call returned, no reset means it did not return (or was never reached).", "Stage-4 next probe (2026-11-09, host-only candidate, self-checked): user-reported hardware reset after about 6 s with revision 07e176761020d3d7f01fb086d9a89af3e3531eb9 proves _ml_parse_cpu_topology returned. board.toml now selects _arm_vm_init in _arm_init, occurrence 1, delay 6, panic_screen=false; reset means arm_vm_init returned, no reset is inconclusive (not reached, did not return, or probe/reset failure). Cave 4 at 0xfffffff0073ee620 is inside kernel __TEXT_EXEC; patch-xnu-entry-probe.py:97-118 uses PC-relative BL/literal load, a 115200000-tick constant, register-only CNTPCT_EL0/PSCI SMC. xnu-8796.141.3 osfmk/arm64/arm_vm_init.c:1998 obtains the KVA segment, :1413 maps the full __TEXT_EXEC ROX, :2097 calls arm_vm_prot_init, and :2144-2156 switches tables and invalidates the bootstrap identity map. Identity-map removal alone therefore does not invalidate the cave; actual post-return execution remains untested. Existing payload/vendor_boot image and JSON .v5 backups were retained without overwrite. Both build commands in the packaging procedure exited 0; the payload is 64 MiB <96 MiB, while stock-padded vendor_boot is exactly 96 MiB, NOT strictly smaller. No device action or push.", "2026-11-09, user-reported hardware evidence relayed by the parent session: the six-second _arm_vm_init post-return probe at device revision 2d55e2a8d223f558f01c948db45db3c71f747c96 reset on hardware. This establishes that callee returned; it does not establish that subsequent code must hang. The implementer ran no device command this round. Next diagnostic candidate (2026-11-09, host-only, self-checked; Reviewer PASS WITH CONDITIONS supplied by parent): board.toml [payload] panic_screen=false, entry_probe_reset_delay=6, entry_probe_reset_after=_PE_create_console, entry_probe_reset_in=_arm_init, entry_probe_reset_occurrence=1, entry_probe_reset_before=false. The actual BL site is 0xfffffff007998b84; cave 0xfffffff0073ee620 lies in __TEXT_EXEC RX. _PE_create_console tail-calls initialize_screen, which can return. The six-second delay starts after the callee returns, not at boot or at the magenta bar. A probe reset proves only this callee returned, not that the following PE_init_printf ran; no reset is inconclusive (not reached, did not return, or probe/reset failure). The BCM2837 fixed panic-buffer access at 0x3c0fc000 in pexpert/arm/pe_init.c remains a risk and is not changed. No VM, memory-window, console implementation or base-source change, no device operation and no push; all area statuses remain planned. This finding supersedes historical claims that no reset necessarily means no return. New candidate not hardware-tested; independent verification pending."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The donor KernelCache member hash (kernelcache.release.iphone10b) is not pinned in [ipsw.sha256] yet; the OS and Cryptex1,SystemOS member hashes are taken at the userdata stage.", "No board DTS register set for storage, display, input, GPU, network, audio and power yet, so those components stay unselected.", "ADT identity: chip_id is decided and written (4acab8db); root_match_volume_uuid stays unset until the userdata image is built before stage 6; the unique-chip-id seed lives only in the base checkout's git-ignored unixnu.local.toml and needs a user backup."]
next_action = ["Official step 5: finish the uefi-nuwa firmware integration (UniXNU, UniXNUDxe, DarwinBoot, RamDisk, DiskIo and FAT modules plus the Advanced Logger export) and reconcile the board DTS with the firmware DTB before selecting step 6 drivers."]
evidence = [{ kind = "source", reference = "docs/nuwa-macos-vm-pipeline-20261124.md", result = "Source record for macOS dyld extraction and seed directory helper scripts; ownership metadata only." }, { kind = "source", reference = "docs/nuwa-seed-full-20261125.md", result = "Host/VM seed inventory, APFS fsck and raw/encoded hash handoff self-checked; no device run or final package." }, { kind = "source", reference = "docs/nuwa-logo-milestone-20261122.md", result = "Parent-reported device observations and comparisons; host record self-checked, no independent verifier; logo submitter, SpringBoard completion and Data persistence unverified." }, { kind = "source", reference = "docs/nuwa-resume-display-scale-20261122.md", result = "Resume-only outer readback has experimental chosen display scale; remaining ADT bytes match rotation baseline; self-checked, review pending." }, { kind = "source", reference = "docs/nuwa-r35i-display-scale-20261121.md", result = "Experimental display scale matches existing artwork metadata; host candidate only, panel and device behavior unverified; review pending." },  { kind = "source", reference = "docs/nuwa-r35-display-20261120-observation.md", result = "GopFramebuffer selection remains pinned; the new archive callback, defconfig switch and ordered 8796 hooks are self-checked on the host." }, { kind = "source", reference = "board.toml", result = "2026-11-20 [components].include adds GopFramebuffer; components.toml declares build = [] for it (build_stage = embedded), so the selection alone yields no archive and [kernel].archives stays unchanged. Host-only configuration record; nothing built." }, { kind = "host", reference = "docs/vfs-getvfs-with-vfsops-20261113.md", revision = "029a79bb58a403c0f3441ed991ad312ae1102c39", command = "WSL /home/wh1stl3/.local/bin/python3.11 scripts/build-vfs-bridge-object.py --out out/vfs-bridge-object-20261113-r3 --source-copy /root/nuwa-vfs-bridge-20261113-r3", result = "Uncommitted changes on stated revision; build and source-contract test exit 0; defined global symbol, declaration and export list checked; six source-body cases and original helper equality checked. Final kernel export and runtime not verified; self-checked only." }, { kind = "source", reference = "board.toml", result = "2026-11-09 single post-map candidate on 8a4063e51c437da62e031ea2a81d9e3d925988d9 (Reviewer PASS WITH CONDITIONS relayed by parent): entry_probe_reset_after=_ml_io_map_wcomb, entry_probe_reset_in=_PE_create_console, occurrence=1, before=false, delay=6, panic_screen=false. User reports console-before on that revision immediately reset after three bars; console-after on 0114789e3b859f66a00b483ee7679dd9722e2bcf showed three bars without reset. No root-cause assertion. Positive means the mapping call returned, before first LDR at 0xfffffff0079686a4, not that PA 0x3c0fc000 is readable/writable. Terminating probe does not preserve the return value or resume original flow. No base, kernel source, firmware, PA, VM or memory-window change; no device action or push; self-checked only." }, { kind = "source", reference = "board.toml", result = "board.os_profile = ios-16.7.16-20H392 resolves to the profile at UniXNU commit 693f5d9cae8a408dd18b39f3f9fdc4228c934241, which carries the IPSW url, chip_id 0x8015, board_id 6 and the DeviceTree/StaticTrustCache sha256 pins; [payload] enables the Tools entry and [firmware.defines] sets ENABLE_SECUREBOOT = 0 because SiliciumPkg.dsc.inc passes the macro unconditionally while unixnu bypasses build_uefi.py." }, { kind = "source", reference = "docs/nuwa-launchd-reached-20261115.md", result = "2026-11-15 configuration state of the device that reached launchd: patches/xnu/series mounts the VFS shim while the three bypass patches stay opt-in outside it, and board.toml pulls the donor com.apple.kec.pthread root; no pin, feed or profile value changed." }]

[[area]]
