inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = ["Reviewed CPU facts (2026-11-07, docs/step5-firmware.md): the live MPIDR Affinity1 values 0x000..0x700 for the eight cores and the 3x A510, 2x A715, 2x A710 and 1x X3 cluster mix agree with the board tree, and [payload.adt] cpu_regs = 0,256,512,768,1024,1280,1536,1792 already encodes that numbering.", "Reviewed GIC facts: GICD 0x17100000 + 0x10000 and GICR 0x17180000 + 0x200000 with an 0x40000 stride match the live machine; the 3-cell versus 4-cell interrupt encoding difference is legal because ArmCpu mapGic does not read interrupt-cells, so addresses and encoding stay unchanged.", "Reviewed timer facts: the live PPI set 13,14,11,12 differs from the DTB's 13,14,11,10 only in the fourth entry, which is an EL2 interrupt. The current path is EL1 only and CNTV_CTL (INTID 27, PPI 11) does not consume that entry, so the IRQ table is unchanged; the 19.2 MHz reference comes from a live property, not a CNTFRQ read-back.", "Live CPU re-check, 2026-11-07 (docs/device-evidence-2026-11-07.md): MIDR is 0x411fd461 on cpu0-2 (A510), 0x411fd4d0 on cpu3-4 (A715), 0x412fd470 on cpu5-6 (A710) and 0x411fd4e0 on cpu7 (X3); soc_id 519, machine KALAMA, family Snapdragon, revision 2.0; the live FDT has cpu@0..cpu@700 (eight nodes), psci method smc and compatible arm,psci-1.0.", "Interrupt and timer re-check: GICD 0x17100000 + 0x10000 and GICR 0x17180000 + 0x200000 with redistributor-stride 0x40000 and #interrupt-cells = 3; the timer node lists PPI 13,14,11,12 with clock-frequency 0x124f800 (19.2 MHz). At Android runtime arch_timer appears as GICv3 virq 11 (virtual timer PPI 11, matching ArmCpu INTID 27); the firmware DTB fourth entry is 10 against the live 12 and the current EL1-only path does not consume it.", "CNTFRQ was not read back: the boot-time dmesg record had already wrapped in the ring buffer when the capture ran, so cntfrq_readback stays unverified and the 19.2 MHz value remains a live DTB property, not a measured counter frequency.", "Collect the first cpu and interrupts observation, its cause when established, and the resulting implementation decision."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The reviewed differences are inert only on the EL1-only path; nothing in this area has run on hardware, so the CPU and interrupt records remain source-level.", "Hardware inputs and implementation are pending for nuwa."]
next_action = ["Keep the DTB PPI set and [payload.adt] cpu_regs as recorded, and validate the EL1-only timer path on hardware once a firmware build exists."]
evidence = [{ kind = "source", reference = "docs/step5-firmware.md", result = "CPU, GIC and timer review: MPIDR 0x000..0x700 and the cluster mix agree; GICD/GICR addresses and 0x40000 stride agree with a legal cell-count difference; the fourth live PPI is EL2-only and unused, so no IRQ change." }]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["Reviewed memory facts (2026-11-07, docs/step5-firmware.md): the board DTS geometry 0x8c0000000 + 0x240000000 (9 GiB) is supported by the live high-end pair of adjacent ranges, but the last 4 KiB (0xafffff000-0xb00000000) and the internal/dynamic reservations inside the range are still open.", "Reviewed memory facts: the current FD window 0xa7100000-0xa7400000 lies inside the historical ramoops 0xa7000000-0xa7400000, and the DXE heap 0xbae00000-0xbf300000 intersects the historical iomem reserved range 0xbe000000-0xd4c00000 whose active owner is unknown. board.toml address, size and verified values stay unchanged; neither permanent Linux reserved ownership nor a full SystemRAM release is inferred.", "The delivered conventional window comes from RAM Partition -> HOB/EFI map -> DarwinBoot conventional allocation, not from an automatic ADT subtraction of reserved ranges; the XNU handoff stays withheld until the reservation owner question closes.", "scripts/unixnu/devicetree.py accepts exactly one /memory node with one contiguous reg range, so the nine-segment TODO in dts/nuwa.dts was corrected as a comment-only change; the geometry and the owned-window contract are unchanged.", "Live FDT re-check, 2026-11-07 (docs/device-evidence-2026-11-07.md): ddr_size reads 0xc (12 GiB) and /memory carries nine reg ranges: 0x80000000+0xe00000, 0x811d0000+0x56e30000, 0xd8140000+0x20000, 0xd8800000+0x0, 0xe7cb0000+0x18350000, 0x880000000+0x39d00000, 0x8c0000000+0xc0000000, 0x980000000+0x180000000 and 0x8b9f00000+0x1e00000. The high pair 0x8c0000000+0xc0000000 and 0x980000000+0x180000000 is adjacent and spans 0x8c0000000..0xb00000000 (9 GiB), matching the board DTS geometry 0x8c0000000+0x240000000.", "reserved-memory in the live FDT (not an exhaustive list): ramoops@0xa7000000 reg 0xa7000000+0x400000 with no no-map, so it is a real node rather than a placeholder; splash_region 0xb8000000+0x2b00000 (cont_splash_region); xbl_dt_log@81a00000 0x81a00000+0x40000 with no-map; smem 0x81d00000+0x200000. The FD window 0xa7100000-0xa7400000 still falls inside the ramoops range: that is recorded as an observation only, with no conclusion about who owns the range today, no board.toml or DTS change, and neither a reservation nor a release implied.", "Still missing for the memory gate: evidence for the current firmware version's RAM Partition -> HOB -> EFI memory map -> DarwinBoot window, which needs a UEFI log taken after fastboot boot-ing our own firmware.", "Static code reading by the main agent, not verified on hardware (2026-11-07, docs/step5-firmware.md): DarwinBoot's window check (UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/WindowSize.h:6-8) requires an address in 0x10000000..0x200000000 with 2 MiB alignment and accepts owned_memory_size = 0x40000000; the WINDOW_SIZE default of 256 MiB at DarwinBoot.c:20 is only the parse upper bound; AllocateWindow (DarwinBoot.c:495-546) searches only contiguous EfiConventionalMemory and, on failure, takes the NO WINDOW branch (DarwinBoot.c:531-544) that prints the NO WINDOW/FREE lines on screen; DarwinBoot.c:745-748 sets boot_args PhysicalBase to the window address and MemorySize to WindowSize, so XNU's physical memory range comes from boot_args rather than from the ADT.", "Static code reading by the main agent, not verified on hardware: the nuwa MemoryMapLib static table (uefi-nuwa Platforms/Xiaomi/nuwaPkg/Library/MemoryMapLib/MemoryMapLib.c:9-35) has one Conventional entry that also produces a HOB, the DXE heap 0xBAE00000+0x4500000 (about 69 MiB), and no high DDR above 0x8c0000000. RamManagerDxe maps RAM-range gaps not covered by the existing EFI map as EfiConventionalMemory with no address or size filter (Silicon/Silicium/SiliciumPkg/Drivers/RamManagerDxe/RamManager.c:48-113), ManageRam cleans up directly when the RAM range lookup fails (:187-215), its depex is TRUE (RamManagerDxe.inf:26-27), and QcomPkg.dsc.inc:30 overrides RamManagerLib with QcomPkg/Library/RamManagerLib, whose RamManager.c:57 returns an error when LocateProtocol(gEfiRamPartitionProtocolGuid) fails. The protocol bytes appear in the nuwa vendor Binaries/nuwa .efi files only once each in EnvDxe.efi and QcomBds.efi, neither in a depex, and the producer is unconfirmed; if the protocol is not installed when RamManagerDxe runs, no high memory is added and DarwinBoot reaches NO WINDOW. This is a silent failure point and is unverified.", "Static code reading by the main agent, not verified on hardware: no consumer of dram-base/dram-size exists in UniXNU/drivers or the SoC repository (documentation only), and whether the XNU patch side consumes them is unconfirmed; official docs/zh/devices/luming-infinityex-rsxq.md:174 requires comparing the firmware memory map, the DTS memory node, the ADT chosen dram-base/size and the DarwinBoot owned window. Inference (unverified): with a 1 GiB window the low Conventional fragments are likely too small, so a first-fit search would land near 0x8c0000000, and whether XNU accepts a window outside the ADT dram range is unknown. Public reference, not nuwa evidence: official docs/zh/devices/alioth.md:193/200/226 records a Mu-Silicium Qualcomm port with 8 GiB DRAM using a 4 GiB owned window, measured on hardware. The failure is benign: the NO WINDOW path only prints the memory map on screen and writes no partition.", "MemoryMapLib reconciliation (static, 2026-11-07, docs/step5-firmware.md section 'MemoryMapLib reconciliation (static)'; static analysis, not verified on hardware): the uefi-nuwa table (MemoryMapLib.c:9-35) has 41 entries, 27 inside the DDR range; the live FDT has 35 fixed-reg reserved regions, 6 of them no-map regions the table does not describe (xbl_ramdump_region 0x81200000+0x280000, global_sync_region 0x82600000+0x100000, mpss_dsm_region 0xd4d00000+0x3300000, xbl_sc_region 0xd8100000+0x40000, hwfence-shmem 0xe6440000+0x2dd000, llcc_lpi_region 0xff800000+0x600000). If RamManagerDxe pads every uncovered System RAM gap as EfiConventionalMemory, 16 fragments total about 10.80 GiB (largest 0x8c0000000 + about 9216 MiB ending at 0xafffff000, then 0x880000000 + about 925 MiB, 0xe7cb0000 + about 379 MiB, 0xbf300000 + about 346 MiB, 0x82800000 + about 128 MiB). A 1 GiB window therefore cannot fit any low fragment and a first-fit lands in the 0x8c0000000 fragment inside the ADT dram-base; shrinking owned_memory_size below about 925 MiB would move it to a low address outside the ADT range, so it must not be shrunk, and any memory-number change needs user confirmation. 'No reserved/gap overlap' is not safety evidence because System RAM already excludes no-map regions; the RAM Partition content is unknown.", "Reviewer verdict on the first fastboot boot (2026-11-07, docs/step5-firmware.md section 'First fastboot boot: Reviewer verdict and conditions'; read-only static): the window-allocation risk is Medium rather than High, APPROVE WITH CONDITIONS scoped to the first fastboot boot only, and Deep Reviewer was not used because no candidate met docs/ai-orchestration-2026-11-06.md §2.3. The failure path writes no partition (EFI_OUT_OF_RESOURCES at DarwinBoot.c:531-545; the Fail path prints boot refused and the on-screen NO WINDOW/FREE lines at :534-541), and the success path prints pa/va/entry/args/owned (:785-790, :797-811). XNU's physical range comes from boot_args (DarwinBoot.c:745-748), so the earlier 'window outside the ADT DRAM' premise is withdrawn; whether dram-base/dram-size has an XNU-side consumer is unconfirmed. The gEfiRamPartitionProtocolGuid producer stays unresolved (RamManagerDxe is not in apriori, Depex = TRUE, runs in FV order at nuwa.fdf:87).", "Unresolved Medium hypothesis: MemoryMapLib was inherited from sheng and not reconciled item by item with nuwa; if the RAM Partition reports a no-map region that the table lacks as RAM, it would be padded as Conventional and used by DXE, giving a wrong access or reboot rather than flash corruption. The RAM Partition contents are unknown, so no conclusion is drawn.", "Collect the first memory and dma observation, its cause when established, and the resulting implementation decision."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["XNU handoff is withheld: the tail 4 KiB and the internal/dynamic reservations of the 9 GiB range are unclosed, and the owner of the 0xbe000000-0xd4c00000 reserved range that the DXE heap intersects is unknown.", "No board DTS register set for DMA, storage, display, input and power yet, so those components stay unselected.", "Window allocation is Medium risk, not High (static analysis, not verified on hardware): the gEfiRamPartitionProtocolGuid producer is unconfirmed and XNU's use of the ADT dram-base/dram-size is unconfirmed; the first boot will show NO WINDOW/FREE lines and write no partition if it fails. 6 live no-map regions are not in MemoryMapLib, and whether the RAM Partition reports them as RAM is unknown; adding them is a user decision. Do not shrink owned_memory_size: below about 925 MiB a first-fit window falls outside the ADT dram-base, and any memory-number change needs user confirmation."]
next_action = ["Resolve the RAM Partition protocol producer (gEfiRamPartitionProtocolGuid) by binary reference-point analysis of InstallProtocolInterface versus LocateProtocol and by the first boot's DEBUG log, because RamManagerDxe's LocateProtocol failure is silent.", "Decide with the user whether to add the 6 live no-map regions not described by MemoryMapLib to the static table; do not shrink owned_memory_size (a low first-fit window would fall outside the ADT dram-base).", "First boot must use a DEBUG build and fastboot boot only (no partition write; device action needs user authorisation in that round), then read the DarwinBoot screen text and the DXE-stage AdvancedLogger page, and confirm SEC writes the entry parameters into the HOB (UniXNURamDiskDxe.c:215-233).", "Close the High-memory gate: identify the active owner of the historical 0xbe000000-0xd4c00000 reserved range (DXE heap 0xbae00000-0xbf300000), account for the 0xafffff000-0xb00000000 tail and the internal reservations, then re-check the FD/ramoops overlap before allowing the XNU handoff."]
evidence = [{ kind = "source", reference = "docs/step5-firmware.md", result = "Memory High-gate review: the 9 GiB geometry is supported by the live high ranges, the tail 4 KiB and internal reservations are open, the FD/ramoops and DXE-heap/reserved overlaps are unresolved, and the delivered window is a DarwinBoot conventional allocation rather than an ADT subtraction." }]

