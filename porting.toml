  "2026-11-25 official display acceptance is not met: parent-reported transport smoke only, reg=2 cli=4 vo=6 vb=0 co=6 cb=0 ret=6; co may include clears. No evidence of a known frame actually displayed, closed IOSurface lifetime and swap completion notification, or requested refresh rate and measured frame timing. bk/so/PIX split diagnostics are not acceptance criteria; self-checked record.",
  "Official display acceptance requires XNU to publish the display service; CPU presentation to confirm pixel layout, row stride, allocation size and cache handling and actually display a known frame; swap completion; closed IOSurface lifetime and swap completion notification; and separate requested refresh rate and measured frame timing records. Enable GPU presentation only after all these items are complete.",
