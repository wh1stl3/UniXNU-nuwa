limits = ["The Tools entry is configured and the Advanced Logger producer is wired (uefi-nuwa e494c01b2f679439fdaeaf2084b693c7220543f5); it was built and independently re-run by the Verifier subagent on b1064eb8/e494c01b; run-time unverified, so the Tools -> Advanced Logger page is still unverified at runtime, the 4 MiB buffer placement is an assumption and the rework has no independent boot-chain review.", "The recorded platform facts are source-level only and carry no host or device verification.", "Persistent kernel logging is unavailable until the route B ShengUfs storage driver works: the log region is a reservation inside userdata, and although the [userdata] GPT geometry is now measured, no region has been reserved and no writer or reader is implemented.", "The log reader is still unselected between a minimal Linux image and recovery+adb, but the recovery option is no longer unknown: TWRP 3.7.1_12 with root, adb, dd and blockdev reads the device read-only, and only sgdisk -p is unavailable.", "Unverified hypothesis, not a conclusion: historical evidence shows an Android ramoops region at 0xa7000000-0xa7400000, so a kernel log kept across a warm reboot could be read from Android /sys/fs/pstore without the storage driver; the current FD window 0xa7100000-0xa7400000 lies inside that region and the memory ownership gate is open, and there is no evidence whether a reboot clears DRAM.", "Writing the reserved log region is a device write and needs explicit user authorisation in the round that performs it."]
next_action = ["Re-run the record and diff checks after the commit, and add host or device evidence only when an actual build or device run produces it.", "User decision (2026-11-07): after the kernel checkpoint, capture kernel logs persistently instead of repeated screen colour-band or hex recordings, following docs/zh/porting/log-capture.md sections 4-6: reserve a log region inside userdata, connect the kernel writer to the storage driver's ranged read/write/sync path, and read it back with a minimal Linux image or a recovery+adb reader, with the writer, reader and host decoder sharing one block unit and byte range.", "Until the route B ShengUfs storage driver works, keep the firmware Tools -> Advanced Logger QR export plus serial/screen checkpoints; the [userdata] first_lba/last_lba/lba_bytes geometry is already recorded in board.toml, so the remaining step is to choose and reserve the log region inside it; reference the official UniXNU-sheng package/BootLog.c, BootReset.c and package/linux-log/ for structure only, because its PMIC addresses and watchdog calls are sheng board values that nuwa must replace with its own evidence. The Advanced Logger producer is now wired (uefi-nuwa e494c01b2f679439fdaeaf2084b693c7220543f5), so the next check is the runtime Tools -> Advanced Logger page on hardware.", "Next host phase (decider CONTINUE implemented, 2026-11-11, self-checked): the explicit pmap-ret-continue-20261111-r1 profile takes the independently frozen renderer baseline 7fd3d933aae66d8e34a0d3ebfa142137978976d7521e04cef20321109750b6f4 (55386112 B), restores the normal PMAP RET and the observer self-loop from the verified diagnostic 6671eafeab4e1ad73ba73f8c85728f6f7f2fc78a7db9398721b911e1b613f269 by exactly two inverse 8-byte words, and sets the effective arguments to -v serial=3 only (the old sheng-platform-stage=5 is dropped because ArmDTPlatform.cpp:200-209 resets the stage after registerService returns). New ignored host FAT 3e98ba12f13df9a776af5de85e254ff3b95fc94a7bc38eb53edd1aca774521f1, ADT a296706d390447319c11a9db7b691f9d4ecc3276bac6424ad9e04598c16aab7a (13256 B), schema2 record fb326d3441b0d9a552463c84d0b4d240e68937c54342097acbb28f78992c97a5; 5 increment tests/CLI/new profile-aware audit exit 0. The independent verifier then passed its 5 tests/CLI/FAT/layout with package FAT 9ff5c2720a1af341b66e8417a3308fc0a3be9e561c3406e7db157d05e523d04c, ADT 885094de4597fb2d1734ba4092c805968097d021c8f482653b238436586d27a4 and record a7ca5cc8a15353a9dee8882a1f89e0633a44ff950514ebe6ad58c4567ac20b57. The continuation outer vendor_boot is now frozen host-only at out/owner-continuation-vendor-boot-20261111-final/vendor_boot.img, 100663296 B sha256 4a52ddbc2cc06401f76676f480eb1b0e4b1dfafce0a8d07b453dd53967a05618, with the actual vendor ramdisk exactly the verifier FAT and DTB/bootconfig/vbmeta/footer preserved per the reviewed allow-list; 4 increment tests and full-chain readback exit 0. Still no device authorization/executor, no runtime mapping or RET execution claim, authentication NOT REACHED. Interpretation contract: the goal is the first natural panic or a visible native milestone; MAC Framework successfully initialized only proves the mac_policy_initbsd printf before callbacks; unseen logs are not evidence; menu stop/reboot is not automatically PMAP/watchdog/stage5; no output is ambiguous, not 'not reached'; at most one bounded BootArgs.Video/PE_state.video/PE_create_console/console_write check if the real follow-up shows no output. Read-only upstream survey: the SM8550 common checkout is ahead 6 and XnuPrelink ahead 5 of the effective pins; the pins are unchanged and the impact is undetermined, so do not record them as unrelated."]
