configuration = ["Record the board.toml fields, DTS properties and defconfig values used for storage and root."]
procedure = ["Follow the storage and root stage in the porting guide and record the actual commands."]
findings = ["Launch route B decided 2026-11-06 (docs/launch-route-2026-11-06.md): bring-up runs from fastboot boot (route A, no partition writes), then the end state is the native UFS root with the userdata partition flashed as the root volume. B needs [userdata] LBA geometry from this board's GPT, root_match_volume_uuid from the built userdata image, native-ufs-root=1, CONFIG_XNU_NATIVE_UFS=y and the ShengUfs component; the flash overwrites Android data and requires explicit user authorisation.", "Repo hygiene: removed the committed __pycache__ copies of the format-1 legacy tooling; no source behaviour changes.", "Payload source decided 2026-11-07 (docs/launch-route-2026-11-06.md, subsection in section 1): route B keeps taking the boot payload (kernel, ADT, trustcache and unixnu.toml inside the RamDisk) from fastboot boot and does not flash boot.img into the boot partition. Observed: fastboot boot writes no partition, so the payload lives only for that boot. Inferred: every boot needs a host-supplied boot.img, and a device reboot returns to the Android boot partition instead of entering UniXNU, so the launch-route section 1 statement that a reboot goes straight into UniXNU and the host-free standalone boot end state do not hold today; standalone boot would need a separate decision plus explicit authorisation to flash boot. userdata remains the persistent root volume and flashing it still needs per-round authorisation; fastboot boot still needs a user confirmation before any device action.", "Read-only GPT capture, 2026-11-07 (docs/device-evidence-2026-11-07.md): six LUNs sda..sdf are present and report 4096-byte logical and physical block sizes; userdata is sda32 with first_lba 3110976 and last_lba 61850618, 58739643 LBAs = 240597577728 bytes (about 224 GiB) at 4096 bytes per LBA, and its last_lba equals that disk's last usable LBA; peer entries are super sda31 751680..3110975, metadata sda17 16384..32767, persist sda18 32768..49151, boot_a sde14 149126..198277 (49152 LBAs = 201326592 bytes = 192 MiB), vendor_boot_a sde24 217670..242245, abl_a sde11, modem_a sde7 and xbl_a sdb1. board.toml [userdata] records the geometry; no GUID, serial or kernel command line is recorded.", "Unit trap: GPT LBAs are 4096-byte units taken from the GPT header parsed on the host, while /sys/block/*/size and blockdev --getsz report 512-byte sectors, so the two must not be mixed without conversion (a factor of 8; for sda 61850624 x 4096 = 494804992 x 512). sda declares 32 GPT entries with usable LBAs 6..61850618. The recovery image does not support sgdisk -p (invalid option -p), so the GPT header and entry array were copied with dd to the host and parsed there; the device was only read.", "Collect the first storage and root observation, its cause when established, and the resulting implementation decision."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["Route B is partly unconfigured: the [userdata] LBA geometry is now measured and recorded in board.toml, but the root volume UUID (only available once the root image is built), the ShengUfs/archives inputs and the storage ABI inputs are still missing, so only route A (RAM boot) runs today.", "Hardware inputs and implementation are pending for nuwa."]
next_action = ["Inventory the required storage and root inputs before implementation.", "Keep bring-up on fastboot boot and do not flash boot.img; revisit host-free standalone boot only on a separate user decision plus explicit authorisation to flash boot.", "Flash timing confirmed 2026-11-07 (docs/launch-route-2026-11-06.md section 8): flashing userdata only validates persistence and comes after all first five bring-up stages, none of which writes a partition. Order: (1) firmware builds, memory ownership gate has evidence, and the boot-chain handoff passes independent review (after the Astra High channel recovers); (2) first fastboot boot observing UEFI, menu, payload and DarwinBoot, with the firmware log exported through the Tools QR path; (3) kernel entry through to platform expert; (4) read-only storage validation of the UFS controller, capacity, GPT and known data blocks, with the OS/SystemOS windows inside userdata; (5) build the root volume image, take the root UUID, check hashes and reach launchd on the in-memory boot path; (6) flash userdata and validate persistence. Before flashing, confirm item by item: the first five stages have real log evidence, the [userdata] geometry comes from a real read rather than an estimate, and the user has a usable stock fastboot package and confirms the Android data is no longer needed; the exact partitions, commands and impact are stated beforehand and executed only after explicit approval in that round. The boot partition is not flashed because the user decided to keep fastboot boot."]
