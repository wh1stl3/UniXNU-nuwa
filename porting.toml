os_profile = "ios-16.7.16-20H392"
summary = "Xiaomi 13 Pro (SM8550) iOS 16.7.16 bring-up. Format 2 migration started 2026-11-06: device repo + UniXNU-sm8550-common + uefi-nuwa. Every area is planned until hardware evidence is recorded."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/xnu/series", ".github/**", ".gitignore", "local.toml.example", "scripts/__pycache__/**", "scripts/**/__pycache__/**"]
inputs = ["SM8550 common repository commit (pinned in feeds.toml).", "An iOS 16.7.16-20H392 OS profile under UniXNU/profiles/os, which the official tree does not provide yet.", "Donor BuildManifest values for [ipsw] url, chip_id, board_id and member hashes."]
configuration = ["board.toml schema_version = 2 with [board], [components], [kernel], [device_tree], [firmware], [payload], [payload.adt], [package].", "feeds.toml pins UniXNU-sm8550-common at a9f45dc60c035084b95463781538380f4c3606c9.", "dts/nuwa.dts includes soc:dts sm8550.dtsi and carries the measured DRAM span only."]
procedure = ["./unixnu defconfig nuwa_defconfig -D ../UniXNU-nuwa", "./unixnu fetch -D ../UniXNU-nuwa", "./unixnu status --json -D ../UniXNU-nuwa", "./unixnu tree -D ../UniXNU-nuwa"]
findings = ["iOS 16 OS profile authored locally at UniXNU/profiles/os/ios-16.7.16-20H392: xnu 8796.141.3 (1b191cb5), IPSW url/product/build/board_id from the donor BuildManifest (d22ap, ApBoardID 0x06, ApChipID 0x8015), DeviceTree/StaticTrustCache sha256 pinned, ADT identity D22AP, kernelcache sha256 and the 31 prelink roots verified against the donor __PRELINK_INFO; board.os_profile now points at it.", "Repo hygiene: removed the committed __pycache__ copies of the format-1 legacy tooling; no source behaviour changes.", "Repo hygiene: the committed __pycache__ blobs were untracked and are ignored; scripts/ keep format-1 legacy tooling that still points at deleted absolute paths and is not part of the official flow.", "The official profiles/os tree ships iPadOS 17.7.11, iPadOS 26.5.2 and iOS/iPadOS 27.0.1 only; selection is blocked until an iOS 16 profile exists.", "The SM8550 shared series targets XNU 10063/12377, so soc:patches/xnu/series is deliberately not selected for the 8796 line."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["No iOS 16 OS profile, no donor BuildManifest hashes, no board DTS register set yet."]
next_action = ["Create the iOS 16.7.16-20H392 profile inputs (XNU source pin, patches, prelink roots) per docs/zh/xnu/source-and-patches, then set board.os_profile."]
evidence = []

