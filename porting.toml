findings = ["2026-11-22 bypass: SpringBoard/mobileactivationd SIGTRAP and bring-up resource contention -> opt-in nuwa-lite disables 30 background jobs borrowed from UniXNU/UniXNU-sheng 460179565a018c741b93e0b1efa07c55d4de497a package/BootWatchdogPolicy.c (MIT), with mode 2 also disabling iconservicesagent; cost includes identity, location, radio, photos, iCloud, updates, FairPlay, Wallet and Siri services; exit when normal services and interaction are qualified. Neither SpringBoard nor mobileactivationd is disabled. No automatic recovery when all policy arguments disappear: persistent plist remains; see package/nuwa-watchdog/SOURCE.md. Host self-checked only; pre-initproc deep review pending.", "2026-11-19 package/nuwa-watchdog/nuwa_watchdog_policy.c ports the watchdogd launch policy from Allenwdk/UniXNU-uke 55909f42b5e473628245b0eafb00d853555f4bb2 (MIT, package/BootWatchdogPolicy.c 13818 B sha256 4888975ea21e567a1098aa81e273aa5c541e7ae1bc380ead5b1a69290d129b42). After the Data mount verifies it writes /private/var/db/com.apple.xpc.launchd/disabled.plist (com.apple.watchdogd and com.apple.watchdog true, mode 0644 root:root, O_NOFOLLOW) plus a disabled.migrated marker (O_EXCL), and accepts disable-watchdogd=1 and disable-jobs=<list> (the sheng- spellings remain aliases). The uke Gunyah wdt petting, autoreset and boot-setup reset are not ported, and the file is rewritten from the current boot arguments every boot, but when no policy arguments are present the prior persistent plist remains. r34 is the first payload carrying disable-watchdogd=1. This is software policy only: it stops a daemon that would brk #1 on a board without IOWatchdog and claims no watchdog hardware behaviour.", "2026-11-15 the device source tree now carries package/NuwaPlatformPower.cpp and package/diagnostics/* unchanged from the reviewed r5/r2 sources; the r5 kernel that reached launchd boots with nuwa-pmgr=2, but no power hardware, real nub publication or AMFI consumption is claimed by landing the source.", "2026-11-13 executor profile pmgr-mode2-20261113-r1 self-checked only; Windows and WSL real host gates, 115 synthetic groups, 18 unauthorised CLI dry calls, zero actual device commands; independent executor review and verifier pending. Parent reports kernel directed deep review and verifier PASS, and package ordinary review and verifier PASS.", "Historical r2 guarded-provider archive (568885fd698489843701907e5d8216f3c9b377c678a2d6710bd8652bad93d29e) retains its ordinary review and independent verifier evidence; source now takes a borrowed root-publication parent, so that acceptance is not claimed for the new link. Original ApplePMGR storage 0x36968, 325 vslots, nub 0x740 and nub+0x88 provider binding remain; unsupported power slots refuse, real readAon/writeAon retained, no hardware/MMIO success claim.", "2026-11-13 isolated kernel delivered, self-checked: out/nuwa-pmgr-kernel-20261113-r5/kernel.macho 55451648 B SHA256 81b85228316574782f9d5390956c3ce3d8c97e4b345a9ea1631feacf3280b5d1. Parent supplied ordinary review PASS WITH CONDITIONS for explicit root-parent route, superseding the initial no-platform blocker. Device-owned opt-in patch calls nuwa_pmgr_run(this) once in IOPlatformExpertDevice::startIOServiceMatching after workloop success, before original registerService; no global synchronous matching or AMFI edit. Native relink, donor pthread prelink, original renderer sources/font and other native inputs reused with provenance. Eight donor/segment/slide bindings rederived and final-checked, all 325 slots final-checked including native inheritances, initializer manual only/no auto-init. Startup audit asserts Sandbox GOT -> AMFI policyops+0x50 -> later BSD callback -> kernel_thread_start(worker): hook precedes worker creation statically. Ten bounded real-code checks pass; mode1 cleanup/mode2 publication/full mode3 lifecycle and pthread runtime unexecuted. New kernel requires fresh CHMH and directed deep review/independent verifier; no device release."]
completion = ["Declared power controls and battery readings match observations; each claimed sleep/resume transition restores its dependent peripherals."]
limits = ["Hardware inputs and implementation are pending for nuwa.", "The guarded provider is a host build only: publication and power-refusal lifecycle are not runtime-qualified, and no power hardware is claimed. The system llvm-objcopy (LLVM 14) does not support Mach-O --remove-section/--globalize-symbol, so the build script performs the symbol move and __mod_init_func disable in place and re-verifies the partition invariants and __text equality. Independent r2 rebuilds changed both __debug_line and __debug_info and section/symbol offsets: debug paths can affect debug content/layout, with no fixed-size guarantee. Compare non-debug contents plus relocation semantics and the eight bindings, not full archive hashes."]
next_action = ["Parent reports kernel directed deep review PASS WITH CONDITIONS and independent verifier PASS, and mode2 CHMH package ordinary review and independent verifier PASS. New executor profile is self-checked only; independent review and verifier pending. The target is actual nub publication and AMFI consumption, not merely disappearance of the old panic. Software PMGR is not hardware; CHMH identity is unauthenticated and authentication NOT REACHED. No device action authorized. Details: docs/pmgr-executor-host-20261113.md."]
