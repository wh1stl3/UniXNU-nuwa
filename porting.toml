findings = ["2026-11-26 build-nuwa-display-native.py and the SB0 helper add single-core SB0 W/R/WX packaging inputs while keeping the 100663296 B outer, FAT budget and CHMH binding rules; the exact outer hashes are recorded in docs/nuwa-sb0-wr-20261126.md and docs/nuwa-sb0-wx-20261127.md. Host self-checked, no device-release claim.", "2026-11-24 one-shot SpringBoard thread snapshot candidate: nuwa-sb-stack=<s> (absent/0 off, <60 raised to 60, one attempt, no retry) calls stack_snapshot_from_kernel(pid, 1 MiB static aligned buffer, STACKSHOT_KCDATA_FORMAT|STACKSHOT_TRYLOCK, delta 0, pagetable mask 0) from touch_monitor after touch_overlay() released render_busy and before the 30 ms wait, with no render/recorder/process-list/task/thread lock held; only kcdata record headers are walked (BEGIN, bounds, container balance, BUFFER_END, exactly one ordinary 0x903 task container whose unique id, pid and p_comm match the census-confirmed pid), SS_TH_WAIT is bit-tested per THREAD_SNAPSHOT and nothing is published unless the whole buffer parses; rows are SHOT pending|done|fail <k> and SHOT n=<n> w=<w> r=<code>; the stackshot is called only after the banner's own paint path has stored that pending row (no paint record, no call; r=1003 after a 60 s wait); see docs/nuwa-sb-stack-20261123.md. w=n is one sample of one task and does not prove a deadlock; the stackshot disables interrupts for a window with no upper bound and only the boot CPU runs. Host self-checked only; reviewer and deep_reviewer pending; authentication NOT REACHED.", "2026-11-20 the r35 package reproduces byte for byte on the host: build-ufs-apfs-root-chmh-r35.py (with --audit), test-ufs-apfs-root-profile.py, test-ufs-apfs-root-chmh.py and run-pmap-ret-once.py --self-check (157 groups, real_device_commands 0) all exit 0, and out/verify-r35-20261120-03 reproduces kernel 55721984 B 787610183dc7f772e2d01aa183f72f2fcc52245fc44407e6c815ced614412464 and outer 100663296 B c6e64820cc46c1a54e65d3640994ad7acf0e7aa807dfd3765eac82f483a4a7ed with derived.adt, payload.img and record.json byte-identical to the recorded r35 directory; the new audit.json is byte-identical to out/nuwa-ufs-apfs-root-chmh-20261119-r35-audit-r1/audit.json (avb_authentication_claimed false). The first attempt failed only on run identity: build-nuwa-pmgr-kernel.py:23 reads /root/nuwa-pmap-ret-native-20261111/build-result.json, which an ordinary user cannot open (EACCES, /root is 700), and the wsl -u root rerun passed, so this is not an artefact difference. r35 is still not flashed; see docs/nuwa-r34-page-evidence-20261120.md.", "2026-11-17/19 every round wrote one bounded payload and every new kernel got a fresh CHMH. r16-r35 all package 100663296 B vendor_boot images through one chain (each build-ufs-apfs-root-chmh-rNN.py imports the previous wrapper and re-derives CHMH, ADT, FAT and outer from the new kernel and args; record.json keeps authentication NOT REACHED and device_release false). Payloads actually written to vendor_boot_a: r16 9a434132341f42c812c515a6b0e0ea7d8a249c89ab252ea44e17eac74215ac9f, r17 579d19b4714364a842d90f48343d21e23dcfece7f783bd147a5d7206fdd8a12a, r17c dfbbc3038c455fa188fae2080ebb2502a18facefc71d178514490a20789ec7a1, r18 a1996558ce34d27e33068012b22d05ddf9f8c56b995a73be49089d8ae1824bdd, r19 d5f2855ffbc9b79ba2aad3d987dbe97d4dcf82a63f47ac812ae3053edc9aabbb, r20 6d6282388232b2d64d31f10902eb5a338f7463c2444ba36f7b83c2f53aa12d5f, r22 8660cf6baf53a92939abe3638d45521db0cd9c67a4656cb8fa00e3c52353e7d0, r23 1a9f6299f90e5f9cfdd3e728e2679c59d6e381a112f5d3915454696286321e18, r24 469524541c818af9527864644b9f5a7d19e9be822072ca6e1d60ae9136ee5e8a, r25 fcfd25489425a6abe7bc262a9169d81df6b4f68b06a9017ec427f4360afafc6f, r26 fc2fba6ab650d4ad2a742e4a20ad5146b86feb87535e84d90de5edd18d42d186, r27 aa51fa0f0d0578308df939b94af1eb071f12b44a6d6015b3b9c3244c2c462401, r28 2652369b1c2eb00f5396e8c1f19719709fc224b2c396199ba97a61cc247bacf7, r29 e1f247f334e270730078e23368933d24c0c027f60c15c94d261f0624f214ffb6, r30 d5d99a03597c3d571784beb4b8893d6f00c27aa7160ab749146a725f7ff5b97e, r31 c9ed423d3f6b3ac8ebf1d9fe79ac60d31b684cd56fe4abb8e3559b1e1286ffd9, r32 dfecf0f3d9a5497e7a67875e225ae1dae56dbfb92da43653e205c0acb366e9c7, r33 2d97df5ffe06b81ed9ac16e4be8abaed9897b4bba1ebd8e3388cea5fa9e33f29 and r34 46aa4fd9f575a30824543fed7c128c5013d35af8d62a98715d0312d1752c891e. r21 was a renderer-only kernel with no package and no write; r35 is packaged as c6e64820cc46c1a54e65d3640994ad7acf0e7aa807dfd3765eac82f483a4a7ed (kernel 787610183dc7f772e2d01aa183f72f2fcc52245fc44407e6c815ced614412464, 55721984 B) but was never flashed, so the device still runs r34. Host claims self-checked; per-run hashes and readings are in docs/nuwa-userspace-20261119-observation.md.", "2026-11-17/19 the write ledger is complete for every flashed round and no round ever read the payload back. Each write was one bounded fastboot flash vendor_boot_a with Sending/Writing OKAY only (no fastboot fetch, no adb in fastboot mode); boot_a, userdata, other partitions and the slot selection were untouched. The intermittent ABL failure (Requested download size is more than max allowed with partition size 0) hit r23, r27, r28 (twice) and r33 before the download stage, so zero bytes moved, and the single permitted reboot-bootloader fallback recovered it inside the same round (proven on r33). Every round left WRITE-rNN.json, boot-observe-rNN.log (48 samples over about 8 minutes) and ROLLBACK-rNN.md in out/nuwa-boot-payload-write-20261115-01/, and the observation logs record enumeration only, never attributing a change to a panic or a self-reboot. The device side has no readback; screen content came from the user.", "2026-11-15 launchd-path packaging: 8796-nuwa-root-auth-skip, 8796-nuwa-trust-cache-init and 8796-nuwa-exec-policy-skip are landed as opt-in device patches (applied with -DXNU_NUWA_ROOT_AUTH_SKIP=1 / -DXNU_NUWA_TRUST_CACHE_INIT=1 / -DXNU_NUWA_EXEC_POLICY_SKIP=1) and deliberately stay outside patches/xnu/series, the same convention as 8796-nuwa-pmgr-root-publication; r7/r8/r9 vendor_boot packages (100663296 B each) were built from kernels 2561c0c5/b1029f3d and written to vendor_boot_a. The observation patches (8796-nuwa-observe-markers, 8796-nuwa-observe-log) remain untracked pending the observation cleanup.", "2026-11-15 trust cache bundle: scripts/build-ios16-system-trust-bundle.py re-emits the two unchanged 20H392 modules (StaticTrustCache 2760 entries and Cryptex1,SystemTrustCache 61 entries) as the loader-accepted bundle eb1475f643f45a974ebd40596f6e2b1cdf40205d2ca3c6094d774886099399c3 (67764 B, no cdhash rewritten), with ten parser negatives recorded. board.toml [payload] trust_cache_sha256 still pins the older single-module 367e051548f9f0407fa9fe9d40007fa4e7c5ff27c45f5a7a30cedf344e24d98e that r3-r7 and the r8obs control package carried; the r8/r9 payloads used the two-module bundle.", "Repo hygiene: removed the committed __pycache__ copies of the format-1 legacy tooling; no source behaviour changes.", "Format-2 migration: scripts/package.sh taken unmodified from the official template; patches/xnu/series created empty; package/ documents the empty device package.", "Kernel patch set (2026-11-08, host-only, self-checked): patches/xnu/series now lists the 17-entry minimal set for stage 5 and carries four local 8796 ports (8796-apple-only-cpu-tunables, 8796-non-apple-iommu-bootstrap, 8796-source-machine-layer, 8796-zzx-pmap-sync-64bit-pa); a static review found two build blockers in the first versions (a dropped ptep_get_iommu hunk, and a kpc source file that 8796 does not ship), fixed in r2. Update (2026-11-08, host build, self-checked): the series grew to 22 entries with six more local 8796 fixes found by real build rounds on the Linux toolchain: 8796-unifdef-headers (two headers the host unifdef 2.10 rejects), 8796-clang-var-init-flag (drops a legacy clang flag and silences new clang-24 warnings), 8796-indirection (os_get_pointee_type for the kalloc macros), 8796-kperf-kpc-off (guards kperf/kpc references because 8796 has no osfmk/arm64/kpc.c), 8796-uio-stackbuf (UIO_STACKBUF macro, 36 call sites). Update 2 (2026-11-08, host build, self-checked): the series is now 25 entries; the kernel compiles and links on the Linux toolchain, the archive steps (corecrypto-14 twice, ArmDTPlatform, ArmCpu) pass, and the final kernel is mach.development.bcm2837.unstripped (17281280 bytes, Mach-O arm64, bootstrap-pass link). Added since: 8796-iorpc-kernel-content (the host iig emits 10063-style code that uses IORPC.kernelContent, an additive member under KERNEL), 8796-kperf-kpc-link-guards (six undefined kperf/kpc symbols) and 8796-compile-records (10063's MakeInc.rule writes <obj>.o.json compile records with -MJ, 8796 does not, and the archive builders read them). The kernel archive list in board.toml is replaced with the four entries stage 5 uses (the arch list also names SoftwareAES, its AES bindings, mockfs and the source libpthread-519, whose pthread_callbacks_s layout does not match 8796), with CONFIG_XNU_NATIVE_AES=n and CONFIG_XNU_SOURCE_PTHREAD=n in nuwa_defconfig. The prelink step now runs and stops on the first ABI gap against the donor kernelcache: kernel target 0xfffffff00734c520 (_vfs_getvfs_with_vfsops) has no native address candidate; more gaps are likely. The IORPC patch and the other 8796 fixes are not reviewed beyond the first four ports. Update 3 (2026-11-08, host build, self-checked): the series is 26 entries; 8796-sparse-prelink-index.patch is the XnuPrelink kit patch xnu-10063.141.1-sparse-index.patch converted to LF (the kit patches are checked out with CRLF line endings, which is why git apply failed on them), touching only osfmk/kern/kalloc.c kalloc_type_view_parse (an early-boot allocator path; not reviewed). The full build applied all 26 patches and linked a 17315480-byte kernel. board.toml now drops com.apple.filesystems.apfs (it references _vfs_getvfs_with_vfsops, absent from open-source 8796; the 10063 definition is a short mount-list lookup) and com.apple.kec.Libm (a literal pool the planner reads as code) from [kernel.prelink] roots, 29 of 31 roots remain, and the planner then passes. Prelink now stops later, in emit_prelink.py instruction_inventory: External PC-relative encoding at 0xfffffff005b8c1cc (a kext in the remaining roots, not yet identified). The security-init kit patch (needed once early_security_init is set) also applies to 8796 after the same LF conversion. No prelinked kernel exists yet.", "Collect the first image assembly observation, its cause when established, and the resulting implementation decision.", "Payload built host-only (self-checked): ./unixnu build payload -D ../nuwa/UniXNU-nuwa --trust-cache out/ipsw/20H392/087-86698-044.dmg.trustcache (no --data-ramdisk) exited 0; payload.img 67,108,864 bytes (64 MiB), sha256 7bbffac545106c8710108737a61af3d15a0f86a5534cbc4d3bae9ee6aac958da. FAT16 volume NUWAESP carries EFI/UniXNU/unixnu.toml (402 B) and Payloads/{kernel.macho 55,357,440 B sha256 274b5033..., kernel.macho.adt 13,132 B sha256 b7ac4b9c..., kernel.macho.trustcache 66,289 B}; the ADT sidecar carries product-id/artwork-device-subtype/compatible-device-fallback, chip-id 4acab8db and the unique-chip-id seed (from the git-ignored unixnu.local.toml).", "vendor_boot repacked host-only (self-checked): ./unixnu vendor_boot --stock UniXNU-nuwa/.cache/stock/vendor_boot_b.img --ramdisk payload.img -o out/nuwa/ios-16.7.16-20H392/nuwa/vendor_boot/vendor_boot.img exited 0; 100,663,296 bytes (96 MiB = partition), sha256 a6d2cc58beac8d89b9b9fd46e8de409374073899ae72440be6df32907717164f, vendor ramdisk 67,108,864 bytes at the stock address 0x01000000. The >15 MiB --ramdisk-addr relocation (docs/zh/guide/boot.md) is left at stock: the nuwa ABL relocates the initrd to the Kernel region (~0xB7xxxxxx per docs/step5-firmware.md) and no safe relocation address is established, so it stays a pending user decision before the first device boot.", "Trust cache repack (2026-11-09, host-only, self-checked): the first payload's kernel.macho.trustcache was the raw StaticTrustCache IM4P (66,289 B, DER 0x30 0x82, sha256 63e01c03…) copied verbatim by 'build payload --trust-cache <im4p>'; ValidTrustCaches rejects it (its u32 Count reads 0x02018230 > 128), returning EFI_COMPROMISED_DATA when the xnu menu entry was selected on hardware. Re-bundling the same donor module with scripts/bundle-ipsw-trust.py yields a valid bundle (66,272 B, Count=1, offset 8, version-2 module, 2760 entries, sha256 367e0515…) that passes the loader-equivalent structural check; 'build payload --trust-cache <bundle>' then 'vendor_boot' repack succeed, and the rebuilt payload.img (sha256 b0c808c2…) / vendor_boot.img (sha256 fef65a4f…) carry the bundle.", "Entry-probe payload build (2026-11-09, host-only, self-checked): ./unixnu build payload -D ../nuwa/UniXNU-nuwa --uefi ../nuwa/uefi-nuwa --trust-cache out/ipsw/20H392/087-86698-044.dmg.trustcache.bundle exited 0; kernel.macho copy patched 274b5033... -> 63b6ff91... (entry 0xfffffff0073ee488 b start_first_cpu -> b cave1; MMU-enable 0xfffffff0073f0350 msr sctlr_el1,x0 -> b cave2; _panic 0xfffffff00798d088 -> b panic_screen; _panic_trap_to_debugger 0xfffffff00726c174 -> b panic_screen_common); payload.img 67108864 B (64 MiB < 96 MiB partition) sha256 c59bc2bc02d58b3877e38d4af4d9f3ee1c44457ced1d09252d1fee9f8982fc98; ./unixnu vendor_boot --stock .cache/stock/vendor_boot_b.img --ramdisk payload.img exited 0, vendor_boot.img 100663296 B sha256 d3dc18f359a99373fa57d80b482138cf4834a51b5f71324f8ef50b999a61eb18; ADT sha256 varies per build (devicetree.generate writes os.urandom(256) random-seed).", "Stage 4 hardware observation (2026-11-09, parent session, device): DarwinBoot validation passed and handed off to the kernel entry (entry words 0x140006f5 = b start_first_cpu); the screen then stays on the green handoff bar with no kernel output. Read-out: graphics mode (boot_args.Video[1] v_display = 1, hardcoded BootVideo.h:31) suppresses early printf, so no text does not prove a hang; -v is not parsed by iOS arm64 xnu; the boot_args CommandLine ABI size mismatch (608-byte Darwin 22 vs 1024-byte Darwin 23) is a known item. The entry-probe payload (blue/magenta bars) is the next observation step.", "Entry probe payload (2026-11-09, host build, self-checked): ./unixnu build payload -D ../nuwa/UniXNU-nuwa --uefi ../nuwa/uefi-nuwa --trust-cache out/ipsw/20H392/087-86698-044.dmg.trustcache.bundle (exit 0) patches a copy of kernel.macho with scripts/patch-xnu-entry-probe.py --reset-delay 6 (no --panic-screen): stage 1 blue bar at the MMU-off entry, stage 2 magenta bar just before msr SCTLR_EL1, stage 3 busy-waits 0x06DDD000 = 115200000 ticks (19.2 MHz x 6 s) on CNTPCT_EL0 then x0 = 0x84000009 / smc #0. Disassembly verified the three branch-to-cave sites and that _panic/_panic_trap_to_debugger are not redirected; panic_screen stays false because panic-screen + stage 3 overflow the padding past PANIC_CAVE_END by 95 B (see the configuration area). payload.img 67108864 B sha256 dd54e153aa2c5a779d4d260493c0561c4c249fc80c3374781444f3714824060d (payload_kernel_sha256 e4b2f2d2f8fe357c18b616a4bb3253318d18fa4e95afc05d1fef3238406559ee vs kernel_sha256 274b50330e8d945480eff24e759fbe3b64d2329c002d78d29b405ad156aac3f0); ./unixnu vendor_boot --stock ../nuwa/UniXNU-nuwa/.cache/stock/vendor_boot_b.img --ramdisk <payload> -o <vendor_boot> (exit 0) vendor_boot.img 100663296 B sha256 7e6e519263323356de5e237cd7681c3233ae4ddad1b3544a597f93bc0f8502d5 (ramdisk 67108864 B at 0x1000, address 0x1000000). Both under the 96 MiB vendor_boot partition.", "Entry-probe stage-4 bisect payload (2026-11-09, host build, self-checked): ./unixnu build payload -D ../nuwa/UniXNU-nuwa --uefi ../nuwa/uefi-nuwa --trust-cache out/ipsw/20H392/087-86698-044.dmg.trustcache.bundle (exit 0) patches a copy of kernel.macho with scripts/patch-xnu-entry-probe.py --reset-delay 6 --reset-after _ml_parse_cpu_topology --in _arm_init --occurrence 1; the bl at 0xfffffff007998914 is rewritten to b 0xfffffff0073ee620 (cave 4), whose code re-runs bl _ml_parse_cpu_topology, busy-waits 0x06DDD000 = 115200000 ticks (19.2 MHz x 6 s) on CNTPCT_EL0 then x0 = 0x84000009 / smc #0 followed by a wfe loop. payload.img 67108864 B (64 MiB < 96 MiB) sha256 e4cb58c429b90cf678222c37c8468820094225b805fcdfb541f12306aa9fd24b (payload_kernel_sha256 18d7668ec271babff0e3a7832523551bbac96d454101a35fa30c72955627b8c4 vs kernel_sha256 274b50330e8d945480eff24e759fbe3b64d2329c002d78d29b405ad156aac3f0); FAT16 NUWAESP Payloads/{kernel.macho 55357440 B, kernel.macho.adt 13132 B sha256 5066738a..., kernel.macho.trustcache 66272 B sha256 367e0515... bundle Count=1 version-2}; ./unixnu vendor_boot --stock ../nuwa/UniXNU-nuwa/.cache/stock/vendor_boot_b.img --ramdisk <payload> -o <vendor_boot> (exit 0) vendor_boot.img 100663296 B sha256 81580c186275bc0e87d17a97ddb3565407093344d13155a3b415d1859a99f298 (ramdisk 67108864 B at 0x1000, address 0x1000000); vendor_boot ramdisk region sha256 == payload.img sha256. ADT sha256 varies per build (devicetree.generate writes os.urandom(256) random-seed).", "Stage-4 next probe (2026-11-09, host-only candidate, self-checked): user-reported hardware reset after about 6 s with revision 07e176761020d3d7f01fb086d9a89af3e3531eb9 proves _ml_parse_cpu_topology returned. board.toml now selects _arm_vm_init in _arm_init, occurrence 1, delay 6, panic_screen=false; reset means arm_vm_init returned, no reset is inconclusive (not reached, did not return, or probe/reset failure). Cave 4 at 0xfffffff0073ee620 is inside kernel __TEXT_EXEC; patch-xnu-entry-probe.py:97-118 uses PC-relative BL/literal load, a 115200000-tick constant, register-only CNTPCT_EL0/PSCI SMC. xnu-8796.141.3 osfmk/arm64/arm_vm_init.c:1998 obtains the KVA segment, :1413 maps the full __TEXT_EXEC ROX, :2097 calls arm_vm_prot_init, and :2144-2156 switches tables and invalidates the bootstrap identity map. Identity-map removal alone therefore does not invalidate the cave; actual post-return execution remains untested. Existing payload/vendor_boot image and JSON .v5 backups were retained without overwrite. Both build commands in the packaging procedure exited 0; the payload is 64 MiB <96 MiB, while stock-padded vendor_boot is exactly 96 MiB, NOT strictly smaller. No device action or push. Final audit exited 0: call 0xfffffff007998a3c -> cave 0xfffffff0073ee620 -> BL _arm_vm_init; CNTPCT loop, literal 115200000, PSCI 0x84000009 / smc #0; blue/magenta sites retained, 0xfffffff0073f0370 and both panic entries unchanged. FAT32 (not the older record's FAT16) contains kernel 55357440 B, ADT 13132 B, trustcache bundle 66272 B (Count=1, offset=8, version=2, entries=2760). Payload SHA256 5253c193a39daf2e663fd98496299894bbfa7d6f7ba0c98c14c5b625d2a922df; stock-padded vendor_boot SHA256 4f741c558ccd80211db6bca6cd8098d9efe825a3409902b775369a01788c65b1. Vendor ramdisk region SHA256 equals payload SHA256. Commands: ./unixnu build payload -D ../nuwa/UniXNU-nuwa --uefi ../nuwa/uefi-nuwa --trust-cache out/ipsw/20H392/087-86698-044.dmg.trustcache.bundle; ./unixnu vendor_boot --stock ../nuwa/UniXNU-nuwa/.cache/stock/vendor_boot_b.img --ramdisk out/nuwa/ios-16.7.16-20H392/nuwa/payload/payload.img -o out/nuwa/ios-16.7.16-20H392/nuwa/vendor_boot/vendor_boot.img. Independent verification pending.", "Host commands (WSL Ubuntu-22.04, cwd /mnt/d/Code/PortingiOS/UniXNU, PATH=$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin; device base revision 2d55e2a8d223f558f01c948db45db3c71f747c96 plus this board.toml change): ./unixnu build payload -D ../nuwa/UniXNU-nuwa --uefi ../nuwa/uefi-nuwa --trust-cache out/ipsw/20H392/087-86698-044.dmg.trustcache.bundle; ./unixnu vendor_boot --stock ../nuwa/UniXNU-nuwa/.cache/stock/vendor_boot_b.img --ramdisk out/nuwa/ios-16.7.16-20H392/nuwa/payload/payload.img -o out/nuwa/ios-16.7.16-20H392/nuwa/vendor_boot/vendor_boot.img. Both rc=0, self-checked. Old payload/vendor_boot image and JSON .v6 backups were absent and then copied and cmp-checked without overwrite. Final FAT extraction and llvm-objdump audit (python3 -u /mnt/c/Users/Administrator/AppData/Local/Temp/opencode/nuwa-console-audit.py, rc=0): 0xfffffff007998b84 B 0xfffffff0073ee620; cave BL _PE_create_console at 0xfffffff00796865c, CNTPCT_EL0 loop with literal 115200000 at 0xfffffff0073ee660, x0=0x84000009 then SMC #0 (word 0xd4000003 at 0xfffffff0073ee654). Original _arm_vm_init BL at 0xfffffff007998a3c and topology BL at 0xfffffff007998914 restored; blue/magenta branches retained; stage-3 site 0xfffffff0073f0370 and both panic entries unchanged. Extracted kernel 55357440 B SHA256 c62bac8e32000ada42eedefdd80ff56ddef1dcea3d441728b37b149abcb3e2d6; trustcache 66272 B SHA256 367e051548f9f0407fa9fe9d40007fa4e7c5ff27c45f5a7a30cedf344e24d98e. Local out/nuwa/ios-16.7.16-20H392/nuwa/payload/payload.img is 67108864 B SHA256 982a1d3b1234c3e461c5a1109fee3de0c95cab13eefa20841b606bbe6ce13620; vendor_boot/vendor_boot.img is 100663296 B SHA256 cc8f6712cb269ded26dd7b4f45aec1e26d90683e2cbf52b8b3fac02a6f651a7d. Vendor ramdisk is byte-for-byte equal to payload; 64 MiB payload and stock-padded 96 MiB vendor image are <=96 MiB partition. Payload hashes may change on rebuild because ADT random-seed is generated afresh. Independent verifier has not rerun these commands."]
