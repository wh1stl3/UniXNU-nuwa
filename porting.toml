components = []
paths = ["proprietary-files.txt", "board.toml", "dts/**", "scripts/check-nuwa*.py", "scripts/prepare-nuwa-firmware.py", "scripts/run-pmap-ret-once.py", "scripts/resume-pmap-ret-restore.py", "package/nuwa-sb0-input/**", "scripts/build-nuwa-sb0-input.py", "tests/test-nuwa-sb0-input.c"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for firmware and boot."]
procedure = ["Follow the firmware and boot stage in the porting guide and record the actual commands."]
findings = ["2026-11-26 package/nuwa-sb0-input/Probe.c and Session.h, scripts/build-nuwa-sb0-input.py and tests/test-nuwa-sb0-input.c implement the standalone no-storage r4 input probe; host self-checked, with no device key observation, grant or UFS producer fence. See docs/nuwa-sb0-r4-input-20261126.md.", "2026-11-20 board.toml [components] adds GopFramebuffer only; no [firmware], [payload] or boot field changed and no firmware build was run.", "2026-11-17/19 scripts/run-pmap-ret-once.py gained explicit R16-R35 profiles beside the existing r4-r15 entries: each carries the payload path, kernel path/size/hash, args, FAT/ADT/record/outer pins and the source/CHMH pins, so a round's package can be named without editing the earlier profiles, and the validator refuses a profile whose pins do not match the files. --self-check runs every profile as a dry phase with real_device_commands=0. The same file still holds the pmap-ret device runner with its existing gates (exclusive run, claim, A/B restore) and none of them was loosened; this batch issued no device command and no write through it.", "2026-11-15 boot chain is device-resident: boot_a carries the r4 Mu-Silicium loader plus DarwinBoot (1495040 B, 692cfcca51af81230fecbba15425cf598182fbe53abb362b6046dec0f24dc2e5) and vendor_boot_a the launchd-path package (r9, 37b665da4629f69ad97fca1335c91f99f81780c896ebceac4dd419264de8667f), both written under this round's authorisation with the slot active, init_boot_a, vbmeta, misc and userdata untouched; stock images and per-round rollback steps are in out/nuwa-boot-payload-write-20261115-01/. The writes have bootloader write acknowledgement only (no fastboot fetch, no adb in fastboot mode).", "Doc-path hygiene: board.toml and porting.toml now reference the live docs (docs/context-brief.md, docs/decisions.md, docs/routing.md); no configuration value changed.", "board.toml [os_overrides.\"ios-16.7.16-20H392\".kernel.prelink] also replaces roots (27 of the profile's 31; apfs, Libm, IOAVFamily and IOMobileGraphicsFamily dropped for stage 5; IOAVFamily/IOMobileGraphicsFamily return with the GPU/media step, and dropping them removes the transitive Libm dependency whose literal pool still trips the prelink planner); host build only, see packaging.", "board.toml now also carries [os_overrides.\"ios-16.7.16-20H392\".kernel.prelink] kernel = the linked mach.development.bcm2837.unstripped (the profile names the 10063 .unstripped.noctf file, which the 8796 makedefs never produce), and a replaced [kernel] archives list; see the configuration and packaging areas. Host build only.", "board.toml [os_overrides.\"ios-16.7.16-20H392\".root] os_volume_uuid is empty for stages 1-5: the OS profile placeholder REQUIRED_ROOT_VOLUME_UUID stops the kernel bootstrap pass, the owner boot manifest is off for nuwa, and the real OS APFS volume UUID is read from the built userdata image before stage 6; host build only.", "board.toml [kernel] patch_series now mounts only device:patches/xnu/series (the minimal 8796 patch set, see the packaging area); this is a build-configuration change and was not run on hardware.", "Reviewed firmware facts (2026-11-07, docs/step5-firmware.md): the firmware DTB carries no splash_region node, while the live machine reports 0xb8000000 with size 0x2b00000 and MemoryMapLib already describes a Display Reserved region. Whether ABL consumes that reservation is unproven, so nothing is injected into the DTB by this review; the firmware repository carries a separate DSC/FDF integration (uefi-nuwa commit becd65b921553957899cc069d6ac6c1278dedd08).", "Vendor inputs: the nuwa DXE set comes from the public Project-Silicium/Device-Binaries repository, path nuwa/, commit 4648d229f9bedf0d17ba6fe2bebd3fc6fb01422d (git tree d8512b51f264cb4dc2114a788066a80fb77cf8b8, 333 files, 8.5 MB), checked out sparsely into uefi-nuwa/Binaries and kept out of the firmware repository history. A local per-file SHA-256 manifest hashes to 6cff995a23b458bcbee0518dbe9b9d74eeea388e410b17413c913a361e702cab. With this tree present every Binaries/nuwa reference in nuwa.dsc/nuwa.fdf resolves (static path check only); the remaining unresolved references belong to the Mu and Mu_Basecore submodules, whose contents are staged by hand for the build (see the build-input finding below). The repository declares no licence, and the upstream origin of these binaries is unverified.", "bootimg.dtb wiring stays deferred to a separate report. The ADT identity is decided: chip_id = 4acab8db is written in board.toml (see the configuration area), and root_match_volume_uuid stays commented out until the userdata image exists before stage 6.", "Step 5 firmware integration is recorded as an independently re-run build (2026-11-07): after an earlier self-checked run (the Verifier subagent's first attempts returned 'Country, region, or territory not supported'), the Verifier subagent re-ran the build against device repository b1064eb8 and uefi-nuwa e494c01b with PASS. uefi-nuwa commit becd65b921553957899cc069d6ac6c1278dedd08 holds the nuwaPkg DSC/FDF integration (UniXNU, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot and AdvancedLogDxe with DiskIo and FAT). From the base checkout (cwd /mnt/d/Code/PortingiOS/UniXNU) `./unixnu build firmware -D ../nuwa/UniXNU-nuwa --uefi ../nuwa/uefi-nuwa --edk2 /home/wh1stl3/nuwa-fw/mu_basecore` exited 0 and produced uefi-nuwa/Build/nuwaPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd, 3145728 bytes = 0x300000, matching [firmware] uefi_fd.size in nuwa.toml; FVMAIN.inf lists UniXNU, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot and AdvancedLogDxe. AdvancedLogDxe's producer is now wired in uefi-nuwa commit e494c01b2f679439fdaeaf2084b693c7220543f5: DXE_CORE uses AdvLoggerPkg's DxeCore AdvancedLoggerLib (its constructor installs gAdvancedLoggerProtocolGuid), DXE_DRIVER/UEFI_DRIVER/UEFI_APPLICATION use the Dxe instance and DXE_RUNTIME_DRIVER the Runtime instance, the real AdvancedLoggerHdwPortLib runs over SerialPortLib (DEBUG keeps FrameBufferSerialPortLib so the screen log remains and is also written to the buffer), DEBUG sets DebugLib = BaseDebugLibAdvancedLogger while RELEASE is unchanged, SEC keeps BaseDebugLibSerialPort because Sec.c calls BaseDebugLibSerialPortConstructor directly (the first link attempt failed before that correction), and PcdAdvancedLoggerBase = 0 with the DXE_CORE library allocating a 4 MiB buffer via AllocateReservedPages instead of a fixed physical address. The independent rebuild passed and produced a 3145728-byte SILICIUM_UEFI.fd; DxeMain links DxeCoreAdvancedLoggerLib, AdvancedLogDxe and UniXNUDxe link DxeAdvancedLoggerLib, Guid.xref contains gAdvancedLoggerProtocolGuid, and FVMAIN.inf still lists the five modules. Runtime dispatch and the Tools -> Advanced Logger page remain unverified (a device run is needed), the assumption that the 4 MiB reserved-page allocation lands in the DXE heap is unconfirmed, the boot-chain review concluded APPROVE WITH CONDITIONS on 2026-11-07 scoped to the first fastboot boot (deep not used; no candidate met the upgrade threshold in `../../docs/routing.md`), and the memory ownership gate is still open.", "Firmware build inputs (2026-11-07): Mu_Basecore comes from the GitHub archive cfb93724a06ff86ff5ba971413368a7809ee42a5 extracted under WSL ext4 at ~/nuwa-fw/mu_basecore; the archive carries no submodule contents, so five submodule directories were copied from the already-checked-out base out/feeds tree (MdePkg/Library/BaseFdtLib/libfdt, MdePkg/Library/MipiSysTLib/mipisyst, BaseTools/Source/C/BrotliCompress/brotli, MdeModulePkg/Library/BrotliCustomDecompressLib/brotli, SecurityPkg/DeviceSecurity/SpdmLib/libspdm). openssl (archive 67b5686b4419b4cb8caa502711c41815f5279751) sits at the uefi-nuwa gitlink path; Common/Mu b8d46c71, Common/Mu_OEM_Sample b70b4b7b and Silicium-ACPI 2d465ad7 come from the fixed pins; Binaries are listed in proprietary-files.txt. Inside WSL the link needs MTU 1400 and the proxy is passed through environment variables to the Windows host gateway port 7890 with allow-lan enabled. These staging steps are manual and not scripted yet; the command sequence is in docs/step5-firmware.md.", "[firmware] patches wire Resources/MuPatches/Gic-Spurious.patch from the Mu-Silicium checkout (sheng uses the same one); during the 2026-11-07 build (built; independently re-run by the Verifier subagent on b1064eb8/e494c01b) it applied cleanly to the shared edk2 tree and rolled back cleanly.", "Format-2 migration: [firmware] points at the device Mu-Silicium checkout and proprietary-files.txt lists the required inputs; the vendor input set is recorded and hashed in proprietary-files.txt.", "board.toml wires [firmware] preflight and [bootimg] dtb = 'build/nuwa/sm8550-xiaomi-nuwa.dtb' (the dtb path is relative to the build tree; the base ctx.tree/dtb does not support a {uefi} template, and an FDF-embedded DTB does not automatically become the appended DTB). scripts/prepare-nuwa-firmware.py only copies the generated DTB and does not edit any node.", "Self-checked (2026-11-07, not independently verified: the Verifier subagent returned 'Country, region, or territory not supported' on both attempts): in the base checkout, ./unixnu defconfig nuwa_defconfig and ./unixnu tree -D ../nuwa/UniXNU-nuwa both exited 0 with the tree at UniXNU/out/nuwa/ios-16.7.16-20H392/nuwa/tree; in that tree, UNIXNU_UEFI=.../uefi-nuwa python3 scripts/prepare-nuwa-firmware.py exited 0 and cmp showed tree/build/nuwa/sm8550-xiaomi-nuwa.dtb byte-identical to the firmware repository FdtBlob/sm8550-xiaomi-nuwa.dtb; dtc -I dts -O dtb -i UniXNU-sm8550-common/dts nuwa.dts exited 0; and unixnu.devicetree.generate returned 12552 bytes containing the dram-base, dram-size, timebase-frequency, psci, cpu0 and cpu7 substrings (substring presence only; per-value CPU reg and GIC stride were not checked, so they stay unverified). This is a hardware-side resource-encoding check, not a complete ADT: chip_id and root_match_volume_uuid were still placeholders at that run (the later chip_id decision is recorded in the configuration area). No host-class evidence entry is added because it would require a command plus a full 40-character revision, and the device repository changes are uncommitted, so no revision is supplied rather than invented.", "MemoryMapLib reconciliation (static, 2026-11-07, docs/step5-firmware.md section 'MemoryMapLib reconciliation (static)'; static analysis, not verified on hardware): the static table has 41 entries, 27 inside DDR, while the live FDT has 35 fixed-reg reserved regions, 6 of them no-map regions the table does not describe. If RamManagerDxe pads uncovered System RAM gaps as Conventional, 16 fragments total about 10.80 GiB and a 1 GiB window first-fits in the 0x8c0000000 fragment inside the ADT dram-base. Do not shrink owned_memory_size: below about 925 MiB the window falls outside the ADT range, and any memory-number change needs user confirmation. The RAM Partition content is unknown.", "Reviewer verdict (2026-11-07, read-only static, docs/step5-firmware.md section 'First fastboot boot: Reviewer verdict and conditions'): window-allocation risk is Medium, APPROVE WITH CONDITIONS for the first fastboot boot only, and Deep Reviewer was not used because no candidate met the upgrade threshold in `../../docs/routing.md`. The failure path writes no partition and prints NO WINDOW/FREE, the success path prints pa/va/entry/args/owned, and XNU's physical range comes from boot_args. Still open: the RamPartition protocol producer (RamManagerDxe is not in apriori, Depex = TRUE, runs at nuwa.fdf:87), SEC HOB write confirmation, a DEBUG build, fastboot boot only with user authorisation, the capture plan, and the FD/ramoops overlap confirmation.", "Collect the first firmware and boot observation, its cause when established, and the resulting implementation decision.", "board.toml [payload] size_mib is now 64 (was 192) so the payload FAT volume, which becomes the vendor_boot vendor ramdisk, fits the 96 MiB partition; the ADT identity values (product-id, artwork-device-subtype, compatible-device-fallback) are now carried as [os_overrides.\"ios-16.7.16-20H392\".adt.product] so the generated ADT sidecar matches the 20H392 donor DeviceTree; host-only, no device write.", "Next diagnostic candidate (2026-11-09, host-only, self-checked; Reviewer PASS WITH CONDITIONS supplied by parent): board.toml [payload] panic_screen=false, entry_probe_reset_delay=6, entry_probe_reset_after=_PE_create_console, entry_probe_reset_in=_arm_init, entry_probe_reset_occurrence=1, entry_probe_reset_before=false. The actual BL site is 0xfffffff007998b84; cave 0xfffffff0073ee620 lies in __TEXT_EXEC RX. _PE_create_console tail-calls initialize_screen, which can return. The six-second delay starts after the callee returns, not at boot or at the magenta bar. A probe reset proves only this callee returned, not that the following PE_init_printf ran; no reset is inconclusive (not reached, did not return, or probe/reset failure). The BCM2837 fixed panic-buffer access at 0x3c0fc000 in pexpert/arm/pe_init.c remains a risk and is not changed. No VM, memory-window, console implementation or base-source change, no device operation and no push; all area statuses remain planned. This finding supersedes historical claims that no reset necessarily means no return. New candidate not hardware-tested; independent verification pending."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The firmware build was independently re-run by the Verifier subagent on 2026-11-07 against device repository b1064eb8 and uefi-nuwa e494c01b: PASS (exit 0, 0x300000-byte FV).", "First hardware runs (2026-11-07, three fastboot boot runs, no partition written, read from phone-camera video, see docs/step5-firmware.md): the firmware starts, prints DXE logs and, since uefi-nuwa d7c97a7 (DXE Heap 0xBAB00000+0x0D1C0000), shows the UniXNU menu; Tools -> Advanced Logger exports a log as 24 OneSend QR frames that decode on the host (179 lines); RamManagerDxe maps the high 9 GiB and UniXNURamDiskDxe publishes an initrd block device. Stage 1 and the menu part of stage 2 are met. Stage 3 half met (2026-11-08): with a placeholder payload written to the unused slot's vendor_boot_b, the menu reported config EFI/UniXNU/unixnu.toml and listed the xnu entry (photo; see docs/step5-firmware.md); payload hashes, the ADT sidecar, DarwinBoot and the memory window are not yet exercised and need a real kernel.", "The Advanced Logger producer is wired (uefi-nuwa e494c01b2f679439fdaeaf2084b693c7220543f5) and the image builds, but runtime dispatch and the Tools -> Advanced Logger page are unverified, the 4 MiB reserved-page allocation's placement in the DXE heap is an assumption, and the boot-chain review concluded APPROVE WITH CONDITIONS on 2026-11-07, scoped to the first fastboot boot only (deep not used; no candidate met the upgrade threshold in `../../docs/routing.md`).", "The memory ownership gate is open (owner of 0xbe000000-0xd4c00000, tail 0xafffff000-0xb00000000, internal reservations), so the XNU handoff stays withheld.", "The DTB has no splash_region and ABL consumption of the MemoryMapLib Display Reserved entry is unproven, so the splash reservation stays undecided; [bootimg] dtb remains unset, chip_id is decided (4acab8db) and root_match_volume_uuid waits for the userdata image.", "Window allocation is Medium risk, not High (static analysis, not verified on hardware): the RAM-partition protocol producer is unconfirmed, XNU's use of the ADT dram-base/dram-size is unconfirmed, and the first boot will show NO WINDOW/FREE lines without writing a partition if it fails. 6 live no-map regions are not in MemoryMapLib, and do not shrink owned_memory_size (below about 925 MiB a first-fit window falls outside the ADT range; memory-number changes need user confirmation)."]
next_action = ["Boot the image on hardware to verify Tools -> Advanced Logger and runtime dispatch; the boot-chain review concluded APPROVE WITH CONDITIONS on 2026-11-07, scoped to the first fastboot boot only, so it is not a release to boot (see docs/step5-firmware.md).", "Resolve the RAM Partition protocol producer (gEfiRamPartitionProtocolGuid) by binary reference-point analysis and the first DEBUG boot log; decide with the user whether to add the 6 live no-map regions to MemoryMapLib, and do not shrink owned_memory_size.", "First boot must use a DEBUG build and fastboot boot only (no partition write; user authorisation in that round), and SEC writing the entry parameters into the HOB (UniXNURamDiskDxe.c:215-233) must be confirmed first.", "The Verifier re-run passed on 2026-11-07 against device repository b1064eb8 and uefi-nuwa e494c01b; repeat it only if the firmware changes, and keep the recorded command and revisions with the result.", "Collect memory ownership evidence before the XNU handoff: the active owner of 0xbe000000-0xd4c00000, the 0xafffff000-0xb00000000 tail and the internal reservations.", "Wire bootimg.dtb and the ADT identity from the separate report, and inject a splash reservation only once ABL consumption is proven."]
evidence = [{ kind = "source", reference = "docs/nuwa-r35-display-20261120-observation.md", result = "The new board archive recipe changes no firmware, loader or payload defaults. No firmware build or device run." }, { kind = "host", reference = "docs/nuwa-userspace-20261119-observation.md", revision = "06e62d3e1f2230a1d70bec38914bc5d96c19279e", command = "WSL Ubuntu-22.04 device repo: /home/wh1stl3/.local/bin/python3.11 -B scripts/run-pmap-ret-once.py --self-check (all profiles dry), plus the read-only review of the r16-r35 write ledger in out/nuwa-boot-payload-write-20261115-01/. No device command, no build.", result = "self-checked host only: the self-check enumerates every profile including R16-R35 as a dry phase with real_device_commands=0, so the executor's profile table is consistent with the packaged payloads; the ledger review confirms each flashed round has WRITE-rNN.json with bootloader acknowledgement only and that no round was read back. Nothing here is a device result or an authentication claim." }, { kind = "source", reference = "board.toml", result = "2026-11-09 post-map probe on 8a4063e51c437da62e031ea2a81d9e3d925988d9: original site 0xfffffff00796867c BL _ml_io_map_wcomb (0xfffffff0073f35b0), x0=0x3c0fc000 and x1=0x4000. Expected site B cave 0xfffffff0073ee620 encoding 0x17ea17e9; cave first BL callee encoding 0x940013e4, then CNTPCT wait 115200000 ticks (0x06ddd000) and x0=0x84000009 / SMC. It terminates without preserving return value or continuing to first LDR at 0xfffffff0079686a4. Positive only proves mapping returned; fixed PA access is not validated. User-reported console-before immediate reset and console-after no reset are observations, not a root-cause diagnosis. Firmware, PA, VM and memory window unchanged; no hardware run this round; self-checked only." }, { kind = "source", reference = "docs/step5-firmware.md", result = "Firmware input review plus build records: the DTB has no splash_region while live reports 0xb8000000/0x2b00000 and MemoryMapLib has Display Reserved; ABL consumption is unproven and bootimg.dtb stays unset; the ADT chip_id is decided (4acab8db) and root_match_volume_uuid waits for the userdata image; the firmware build was independently re-run by the Verifier subagent on 2026-11-07 against b1064eb8/e494c01b: PASS (0x300000-byte FV), and the firmware has since started on hardware without reaching the menu (three fastboot boot runs, header v1 never left the bootloader, header v4 reached DXE, PIL AUTO ABL panic fixed with a local uefipil.cfg, then ASSERT DxeMain.c(581) after AllocatePoolPages failures; see docs/step5-firmware.md), and the boot-chain review concluded APPROVE WITH CONDITIONS on 2026-11-07 scoped to the first fastboot boot only (deep not used)." }, { kind = "device", reference = "docs/nuwa-ci-evidence-20261120.md", revision = "9e0be264fb2689a96c5b7ba1edc563a4e5adb049", command = "Authorised fastboot flash boot_a (.cache/boot-stage12-v4-r4.img) and fastboot flash vendor_boot_a (r9 package), each a single bounded attempt, then one normal reboot; bootloader answered OKAY/Finished and the JSON records the measured candidate hash. Not rerun by this records update.", result = "boot_a 1495040 B sha256 692cfcca51af81230fecbba15425cf598182fbe53abb362b6046dec0f24dc2e5 with the stock tail untouched; vendor_boot_a r9 100663296 B sha256 37b665da4629f69ad97fca1335c91f99f81780c896ebceac4dd419264de8667f bound to kernel b1029f3d and CHMH rebound to it. Slot active, init_boot_a, vbmeta, misc and userdata untouched; write acknowledgement only, no device-side readback." }]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*", "scripts/repack-nuwa-smp-gate.py", "patches/armcpu/nuwa-smp-observe.patch", "scripts/test-nuwa-smp-observe.py"]
inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = [
    "Reviewed CPU facts (2026-11-07, docs/step5-firmware.md): the live MPIDR Affinity1 values 0x000..0x700 for the eight cores and the 3x A510, 2x A715, 2x A710 and 1x X3 cluster mix agree with the board tree, and [payload.adt] cpu_regs = 0,256,512,768,1024,1280,1536,1792 already encodes that numbering.",
    "Reviewed GIC facts: GICD 0x17100000 + 0x10000 and GICR 0x17180000 + 0x200000 with an 0x40000 stride match the live machine; the 3-cell versus 4-cell interrupt encoding difference is legal because ArmCpu mapGic does not read interrupt-cells, so addresses and encoding stay unchanged.",
    "Reviewed timer facts: the live PPI set 13,14,11,12 differs from the DTB's 13,14,11,10 only in the fourth entry, which is an EL2 interrupt. The current path is EL1 only and CNTV_CTL (INTID 27, PPI 11) does not consume that entry, so the IRQ table is unchanged; the 19.2 MHz reference comes from a live property, not a CNTFRQ read-back.",
    "Live CPU re-check, 2026-11-07 (docs/device-evidence-2026-11-07.md): MIDR is 0x411fd461 on cpu0-2 (A510), 0x411fd4d0 on cpu3-4 (A715), 0x412fd470 on cpu5-6 (A710) and 0x411fd4e0 on cpu7 (X3); soc_id 519, machine KALAMA, family Snapdragon, revision 2.0; the live FDT has cpu@0..cpu@700 (eight nodes), psci method smc and compatible arm,psci-1.0.",
    "Interrupt and timer re-check: GICD 0x17100000 + 0x10000 and GICR 0x17180000 + 0x200000 with redistributor-stride 0x40000 and #interrupt-cells = 3; the timer node lists PPI 13,14,11,12 with clock-frequency 0x124f800 (19.2 MHz). At Android runtime arch_timer appears as GICv3 virq 11 (virtual timer PPI 11, matching ArmCpu INTID 27); the firmware DTB fourth entry is 10 against the live 12 and the current EL1-only path does not consume it.",
    "CNTFRQ was not read back: the boot-time dmesg record had already wrapped in the ring buffer when the capture ran, so cntfrq_readback stays unverified and the 19.2 MHz value remains a live DTB property, not a measured counter frequency.",
    "2026-11-20 the CNTFRQ read-back gap is closed by the r34 boot-progress page: the CLK row read cntfrq=19200000 dt=19200000 dv=6143960ms cv=6143960ms, so on the boot CPU the kernel CNTFRQ_EL0 read equals the device-tree timebase and the two window conversions do not drift over 6144 s. That row is stamped with CNTFRQ at the event, so a slow console cannot stretch the window (this board captures no console, see the diagnostics finding); the 2026-11-07 dmesg entry above is a capture artefact, not a contradiction. SMP is still off, so only the boot CPU is covered, and the reading does not measure the physical counter rate because both conversions divide by the same nominal frequency. Page transcription, source lines and offsets: docs/nuwa-r34-page-evidence-20261120.md.",
    "2026-11-23 SMP entry gate (host only, default off, never booted): the reset vector decoded the physical CPU id with AFF0 only because HAS_CLUSTER is unset for BCM2837, so the ADT's Affinity1-numbered cpu1 (reg 0x100) was masked to 0x000 and matched the boot core's cpu_data entry; 8796-nuwa-smp-affinity.patch takes AFF1:AFF0 on BCM2837 (the upstream UniXNU-sm8550-common@a9f45dc6 condition), and the ArmCpu component patch admits only reg 0x100 when sheng-smp is non-zero. No boot argument was added; with sheng-smp absent the probe decisions, CPU registration, pmap/time base and boot path are unchanged, but the image is not byte-identical (one changed word in reset_vector, ArmCpu.o 8 bytes larger, later layout shifted). MAX_CPUS 4 / MAX_CPU_CLUSTERS 1 unchanged. Kernel 6af982c3..., outer b02007f7..., CHMH 1f9c8fef...; the unmodified recipe reproduced the current kernel 64a97b23... first. Entry gate (one CPU_ON, c1=step7, no fail) and run gate remain device work; see docs/nuwa-smp-gate-20261123.md.",
    "2026-11-23 SMP entry observations (host only, default off): CPU_ON attempts, target operand and firmware return, separate no-conduit state and independently valid secondary affinity on page row 38; rc/aff also on the post-handoff title. No admission or reset-vector change; see docs/nuwa-smp-observe-20261123.md.",
    "2026-11-23 SMP entry candidate uses the observational kernel and appends only sheng-smp=1 relative to the observational default-off package. Entry criteria and stop rules: docs/nuwa-smp-observe-entry-20261123.md. deep_reviewer must review failure modes after enablement and whether the observations support those criteria.",
    "Collect the first cpu and interrupts observation, its cause when established, and the resulting implementation decision.",
]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The reviewed differences are inert only on the EL1-only path; nothing in this area has run on hardware, so the CPU and interrupt records remain source-level.", "Hardware inputs and implementation are pending for nuwa."]
next_action = ["Keep the DTB PPI set and [payload.adt] cpu_regs as recorded, and validate the EL1-only timer path on hardware once a firmware build exists."]
evidence = [
    { kind = "host", reference = "docs/nuwa-sb-stack-detail-20261124.md", revision = "6998a644063414540b9f9623a314b8c13de12e81", command = "repack-nuwa-smp-gate.py --sb-stack with separate --audit", result = "Self-checked: sb-stack mode matches the pinned sb-stack3 config byte for byte and uses no sheng-smp token; no CPU source or entry behavior changed." },
    { kind = "source", reference = "docs/step5-firmware.md", result = "CPU, GIC and timer review: MPIDR 0x000..0x700 and the cluster mix agree; GICD/GICR addresses and 0x40000 stride agree with a legal cell-count difference; the fourth live PPI is EL2-only and unused, so no IRQ change." },
    { kind = "device", reference = "docs/nuwa-r34-page-evidence-20261120.md", revision = "06e62d3e1f2230a1d70bec38914bc5d96c19279e", command = "No device command: the user photographed the r34 boot-progress page and the parent transcribed it; the host only re-checked the CLK format string and its offset in both kernels and the BootProgress.c lines. Reviewer read the transcription against the source; vision did not confirm it.", result = "CLK row cntfrq=19200000 dt=19200000 dv=6143960ms cv=6143960ms on the boot CPU: CNTFRQ_EL0 read-back equals the device-tree timebase, no dv/cv drift inside 6144 s, and the TIMER row cval-vct=0x1967e (104062 ticks, about 5.42 ms) is a healthy in-flight deadline. Closes cntfrq_readback stays unverified from docs/device-evidence-2026-11-07.md. Limits: boot CPU only (SMP off), no physical counter-rate claim (both conversions divide by the same nominal frequency), transcription not vision-confirmed." },
    { kind = "host", reference = "docs/nuwa-smp-gate-20261123.md", revision = "d7801650c55415da457fc309c143e0829918b724", command = "WSL Ubuntu-22.04 root, device repo worktree-display-dsp: /home/wh1stl3/.local/bin/python3.11 -B scripts/build-nuwa-display-native.py --base /mnt/d/Code/PortingiOS/UniXNU --cpo <IOPMGR.cpo.json> --linker-dir /opt/unixnu-linux/CommandLineTools/usr/bin --r35-dir out/nuwa-r35-20261119 --r35l-dir out/nuwa-r35l-regs-full-20261121 --cpu-only --no-software-vsync --candidate --hid-standin --mg-reset --smp-gate --out out/nuwa-smp-gate-20261123-build; then scripts/test-nuwa-smp-gate-kernel.py and scripts/repack-nuwa-smp-gate.py (build and separate --audit); no device command, no flash.", result = "self-checked host only: without --smp-gate the builder reproduced the current kernel 64a97b23... bit for bit; with it the kernel is 6af982c3... (52,187,136 B), outer b02007f7..., CHMH 1f9c8fef..., FAT 194b6c9a... with 11,664,896 B free. start.o differs by one word (0x420: and x0,x15,#0xff -> #0xffff) and ArmCpu.o by the probe guard (cmp w22,#256; b.ne) plus 8 bytes of growth and +6 line-number immediates; both symbol tables are identical, prelink bindings/components/interfaces stay 65,443/31/7. Args are 489 B/25 tokens, identical to outer d6de71fc... and to sb-stack3 minus nuwa-sb-stack=360, with no sheng-smp/restart/sb-stack/sheng-data-reset token. The entry gate itself (one CPU_ON, c1=step7, no fail) and the run gate are unproven; deep_reviewer review of the boot-entry ABI, affinity decode and default-off equivalence is requested." },
    { kind = "host", reference = "docs/nuwa-smp-entry-20261123.md", revision = "917f3eafbc458c4b2e13de2162269e9c41baf9eb", command = "WSL Ubuntu-22.04: build-nuwa-display-native.py --smp-gate; test-nuwa-smp-gate-kernel.py --objects; repack-nuwa-smp-gate.py --enable-smp-entry with separate --audit; fsck.fat -vn and mdir on the outer FAT.", result = "self-checked: direct vendor_boot.img readback differs in args only by appending sheng-smp=1; kernel and seed are unchanged, CHMH rebound, FAT has 11,664,896 B free. Entry and run gates untested; deep_reviewer requested for opt-in failure modes and observability only." },
    { kind = "host", reference = "docs/nuwa-smp-observe-20261123.md", revision = "1afa867bbd08a5f9622caa6a8903d216f1bf62d3", command = "Build --smp-gate --smp-observe; linked gate test; default-off repack with outer audit; test-nuwa-smp-observe.py --package.", result = "self-checked: 78/80 columns in C replay, rest of renderer unaffected, pinned outer args byte-identical without sheng-smp, seed unchanged, CHMH rebound, FAT free 11,664,896 B. Device and independent review pending." },
    { kind = "host", reference = "docs/nuwa-smp-observe-entry-20261123.md", revision = "e1d84609fac9538c584cfd0d5cc43c73472f3bd6", command = "Build --smp-gate --smp-observe; linked gate and renderer tests; repack-nuwa-smp-gate.py --enable-smp-entry with separate --audit; fsck.fat -vn and mdir on outer readback.", result = "self-checked: direct args readback only appends sheng-smp=1, observational kernel and seed unchanged, CHMH rebound, 11,664,896 B FAT free, ADT CPU states and PSCI unchanged. No device action or independent verification; deep_reviewer review pending." },
]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["2026-11-22: board owned_memory_size raised from 1 GiB to 4.75 GiB at user direction; live FDT ddr_size=0xc and user confirmation indicate 12 GiB. The host candidate requires deep_reviewer review of boot-chain and page-table effects; see docs/nuwa-window-475g-20261122.md.", "Reviewed memory facts (2026-11-07, docs/step5-firmware.md): the board DTS geometry 0x8c0000000 + 0x240000000 (9 GiB) is supported by the live high-end pair of adjacent ranges, but the last 4 KiB (0xafffff000-0xb00000000) and the internal/dynamic reservations inside the range are still open.", "Reviewed memory facts: the current FD window 0xa7100000-0xa7400000 lies inside the historical ramoops 0xa7000000-0xa7400000, and the DXE heap 0xbae00000-0xbf300000 intersects the historical iomem reserved range 0xbe000000-0xd4c00000 whose active owner is unknown. board.toml address, size and verified values stay unchanged; neither permanent Linux reserved ownership nor a full SystemRAM release is inferred.", "The delivered conventional window comes from RAM Partition -> HOB/EFI map -> DarwinBoot conventional allocation, not from an automatic ADT subtraction of reserved ranges; the XNU handoff stays withheld until the reservation owner question closes.", "scripts/unixnu/devicetree.py accepts exactly one /memory node with one contiguous reg range, so the nine-segment TODO in dts/nuwa.dts was corrected as a comment-only change; the geometry and the owned-window contract are unchanged.", "Live FDT re-check, 2026-11-07 (docs/device-evidence-2026-11-07.md): ddr_size reads 0xc (12 GiB) and /memory carries nine reg ranges: 0x80000000+0xe00000, 0x811d0000+0x56e30000, 0xd8140000+0x20000, 0xd8800000+0x0, 0xe7cb0000+0x18350000, 0x880000000+0x39d00000, 0x8c0000000+0xc0000000, 0x980000000+0x180000000 and 0x8b9f00000+0x1e00000. The high pair 0x8c0000000+0xc0000000 and 0x980000000+0x180000000 is adjacent and spans 0x8c0000000..0xb00000000 (9 GiB), matching the board DTS geometry 0x8c0000000+0x240000000.", "reserved-memory in the live FDT (not an exhaustive list): ramoops@0xa7000000 reg 0xa7000000+0x400000 with no no-map, so it is a real node rather than a placeholder; splash_region 0xb8000000+0x2b00000 (cont_splash_region); xbl_dt_log@81a00000 0x81a00000+0x40000 with no-map; smem 0x81d00000+0x200000. The FD window 0xa7100000-0xa7400000 still falls inside the ramoops range: that is recorded as an observation only, with no conclusion about who owns the range today, no board.toml or DTS change, and neither a reservation nor a release implied.", "Still missing for the memory gate: evidence for the current firmware version's RAM Partition -> HOB -> EFI memory map -> DarwinBoot window, which needs a UEFI log taken after fastboot boot-ing our own firmware.", "Static code reading by the main agent, not verified on hardware (2026-11-07, docs/step5-firmware.md): DarwinBoot's window check (UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/WindowSize.h:6-8) requires an address in 0x10000000..0x200000000 with 2 MiB alignment and accepts owned_memory_size = 0x40000000; the WINDOW_SIZE default of 256 MiB at DarwinBoot.c:20 is only the parse upper bound; AllocateWindow (DarwinBoot.c:495-546) searches only contiguous EfiConventionalMemory and, on failure, takes the NO WINDOW branch (DarwinBoot.c:531-544) that prints the NO WINDOW/FREE lines on screen; DarwinBoot.c:745-748 sets boot_args PhysicalBase to the window address and MemorySize to WindowSize, so XNU's physical memory range comes from boot_args rather than from the ADT.", "Static code reading by the main agent, not verified on hardware: the nuwa MemoryMapLib static table (uefi-nuwa Platforms/Xiaomi/nuwaPkg/Library/MemoryMapLib/MemoryMapLib.c:9-35) has one Conventional entry that also produces a HOB, the DXE heap 0xBAE00000+0x4500000 (about 69 MiB), and no high DDR above 0x8c0000000. RamManagerDxe maps RAM-range gaps not covered by the existing EFI map as EfiConventionalMemory with no address or size filter (Silicon/Silicium/SiliciumPkg/Drivers/RamManagerDxe/RamManager.c:48-113), ManageRam cleans up directly when the RAM range lookup fails (:187-215), its depex is TRUE (RamManagerDxe.inf:26-27), and QcomPkg.dsc.inc:30 overrides RamManagerLib with QcomPkg/Library/RamManagerLib, whose RamManager.c:57 returns an error when LocateProtocol(gEfiRamPartitionProtocolGuid) fails. The protocol bytes appear in the nuwa vendor Binaries/nuwa .efi files only once each in EnvDxe.efi and QcomBds.efi, neither in a depex, and the producer is unconfirmed; if the protocol is not installed when RamManagerDxe runs, no high memory is added and DarwinBoot reaches NO WINDOW. This is a silent failure point and is unverified.", "Static code reading by the main agent, not verified on hardware: no consumer of dram-base/dram-size exists in UniXNU/drivers or the SoC repository (documentation only), and whether the XNU patch side consumes them is unconfirmed; official docs/zh/devices/luming-infinityex-rsxq.md:174 requires comparing the firmware memory map, the DTS memory node, the ADT chosen dram-base/size and the DarwinBoot owned window. Inference (unverified): with a 1 GiB window the low Conventional fragments are likely too small, so a first-fit search would land near 0x8c0000000, and whether XNU accepts a window outside the ADT dram range is unknown. Public reference, not nuwa evidence: official docs/zh/devices/alioth.md:193/200/226 records a Mu-Silicium Qualcomm port with 8 GiB DRAM using a 4 GiB owned window, measured on hardware. The failure is benign: the NO WINDOW path only prints the memory map on screen and writes no partition.", "MemoryMapLib reconciliation (static, 2026-11-07, docs/step5-firmware.md section 'MemoryMapLib reconciliation (static)'; static analysis, not verified on hardware): the uefi-nuwa table (MemoryMapLib.c:9-35) has 41 entries, 27 inside the DDR range; the live FDT has 35 fixed-reg reserved regions, 6 of them no-map regions the table does not describe (xbl_ramdump_region 0x81200000+0x280000, global_sync_region 0x82600000+0x100000, mpss_dsm_region 0xd4d00000+0x3300000, xbl_sc_region 0xd8100000+0x40000, hwfence-shmem 0xe6440000+0x2dd000, llcc_lpi_region 0xff800000+0x600000). If RamManagerDxe pads every uncovered System RAM gap as EfiConventionalMemory, 16 fragments total about 10.80 GiB (largest 0x8c0000000 + about 9216 MiB ending at 0xafffff000, then 0x880000000 + about 925 MiB, 0xe7cb0000 + about 379 MiB, 0xbf300000 + about 346 MiB, 0x82800000 + about 128 MiB). A 1 GiB window therefore cannot fit any low fragment and a first-fit lands in the 0x8c0000000 fragment inside the ADT dram-base; shrinking owned_memory_size below about 925 MiB would move it to a low address outside the ADT range, so it must not be shrunk, and any memory-number change needs user confirmation. 'No reserved/gap overlap' is not safety evidence because System RAM already excludes no-map regions; the RAM Partition content is unknown.", "Reviewer verdict on the first fastboot boot (2026-11-07, docs/step5-firmware.md section 'First fastboot boot: Reviewer verdict and conditions'; read-only static): the window-allocation risk is Medium rather than High, APPROVE WITH CONDITIONS scoped to the first fastboot boot only, and Deep Reviewer was not used because no candidate met the upgrade threshold in `../../docs/routing.md`. The failure path writes no partition (EFI_OUT_OF_RESOURCES at DarwinBoot.c:531-545; the Fail path prints boot refused and the on-screen NO WINDOW/FREE lines at :534-541), and the success path prints pa/va/entry/args/owned (:785-790, :797-811). XNU's physical range comes from boot_args (DarwinBoot.c:745-748), so the earlier 'window outside the ADT DRAM' premise is withdrawn; whether dram-base/dram-size has an XNU-side consumer is unconfirmed. The gEfiRamPartitionProtocolGuid producer stays unresolved (RamManagerDxe is not in apriori, Depex = TRUE, runs in FV order at nuwa.fdf:87).", "Unresolved Medium hypothesis: MemoryMapLib was inherited from sheng and not reconciled item by item with nuwa; if the RAM Partition reports a no-map region that the table lacks as RAM, it would be padded as Conventional and used by DXE, giving a wrong access or reboot rather than flash corruption. The RAM Partition contents are unknown, so no conclusion is drawn.", "Collect the first memory and dma observation, its cause when established, and the resulting implementation decision."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["XNU handoff is withheld: the tail 4 KiB and the internal/dynamic reservations of the 9 GiB range are unclosed, and the owner of the 0xbe000000-0xd4c00000 reserved range that the DXE heap intersects is unknown.", "No board DTS register set for DMA, storage, display, input and power yet, so those components stay unselected.", "Window allocation is Medium risk, not High (static analysis, not verified on hardware): the gEfiRamPartitionProtocolGuid producer is unconfirmed and XNU's use of the ADT dram-base/dram-size is unconfirmed; the first boot will show NO WINDOW/FREE lines and write no partition if it fails. 6 live no-map regions are not in MemoryMapLib, and whether the RAM Partition reports them as RAM is unknown; adding them is a user decision. Do not shrink owned_memory_size: below about 925 MiB a first-fit window falls outside the ADT dram-base, and any memory-number change needs user confirmation."]
next_action = ["Resolve the RAM Partition protocol producer (gEfiRamPartitionProtocolGuid) by binary reference-point analysis of InstallProtocolInterface versus LocateProtocol and by the first boot's DEBUG log, because RamManagerDxe's LocateProtocol failure is silent.", "Decide with the user whether to add the 6 live no-map regions not described by MemoryMapLib to the static table; do not shrink owned_memory_size (a low first-fit window would fall outside the ADT dram-base).", "First boot must use a DEBUG build and fastboot boot only (no partition write; device action needs user authorisation in that round), then read the DarwinBoot screen text and the DXE-stage AdvancedLogger page, and confirm SEC writes the entry parameters into the HOB (UniXNURamDiskDxe.c:215-233).", "Close the High-memory gate: identify the active owner of the historical 0xbe000000-0xd4c00000 reserved range (DXE heap 0xbae00000-0xbf300000), account for the 0xafffff000-0xb00000000 tail and the internal reservations, then re-check the FD/ramoops overlap before allowing the XNU handoff."]
evidence = [{ kind = "source", reference = "docs/step5-firmware.md", result = "Memory High-gate review: the 9 GiB geometry is supported by the live high ranges, the tail 4 KiB and internal reservations are open, the FD/ramoops and DXE-heap/reserved overlaps are unresolved, and the delivered window is a DarwinBoot conventional allocation rather than an ADT subtraction." }]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*", "scripts/make-nuwa-disposable-data-init.cpp", "scripts/nuwa-data-init-review.py", "patches/sheng-ufs/**", "patches/xnu/8796-nuwa-ufs-handoff-observe.patch", "package/diagnostics/NuwaUfsMarker.h", "package/nuwa-systemos/**", "package/nuwa-data/**", "package/nuwa-data-write/**", "package/nuwa-ramblock/**", "package/nuwa-aks/**", "tests/NuwaDataFixtureGpt.h", "tests/NuwaSb0Experiment.h", "tests/audit-nuwa-sb0-link.py", "tests/test-nuwa-sb0-candidate.py", "tests/test-nuwa-wx-menu.py", "tests/test-nuwa-data-init-review.py", "tests/test-nuwa-data-persist.py", "tests/test-nuwa-data-write.cpp", "tests/test-nuwa-disposable-data.cpp", "tests/test-nuwa-dualbank.cpp", "tests/test-nuwa-retained-entry.py", "tests/test-nuwa-retained-response.cpp", "tests/test-nuwa-ufs-data-init.py", "tests/test-nuwa-ufs-neon.py", "tests/test-nuwa-ufs-ram-recovery.py", "tests/test-nuwa-ufs-reinit.cpp"]
inputs = ["Identify the storage and root hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for storage and root."]
procedure = ["Follow the storage and root stage in the porting guide and record the actual commands."]
findings = [
  "2026-11-26 dedicated recovery PID 1 and single-direction post-claim receipt transport build as unbound host CPIO fragments. ABL init/AVB selection and .44 early module/producer closure prevent a flashable release. See docs/nuwa-ufs-ram-recovery-20261126.md.",
  "2026-11-26 dedicated retained UFS SB0-W/SB0-R research profiles isolate the LU0 57393401 metadata experiment from normal root and store publication. W has no real authorization consumer; only the host fixture can exercise the single non-FUA write. R compiles out the WRITE(10) encoder. Neither profile is device-approved. See docs/nuwa-sb0-wr-20261126.md.",
  "2026-11-26 exact r4 input audit distinguishes queued ButtonsDxe/ConIn keys from the direct VOL+ realtime PMIC GPIO status ABI. A standalone no-storage EFI probe records one fresh observation without issuing a grant; W remains unbound. See docs/nuwa-sb0-r4-input-20261126.md.",
  "2026-11-27 explicit WX build adds a real, single non-FUA retained WRITE(10) of the fixed disposable SB0; no key probe dependency. The software latch is per boot, and no firmware producer fence or deployment approval is implied. Pair only with the unchanged R r4. See docs/nuwa-sb0-wx-20261127.md.",
  "2026-11-27 WX menu repack supersedes the auto-boot WX outer: shutdown is the default and W requires an explicit menu selection and confirmation. Kernel, ADT and R r4 are unchanged. Exact r4 loader exercised with a read-only QEMU boot disk and a no-write substitute. See docs/nuwa-sb0-wx-20261127.md.",
  "2026-11-27 实机 R 前检与 WX 刷入（device/self-checked）：唯一 nuwa 在 recovery uid0 记录写前 boot_a f4dc081b…、vendor_boot_a 493ca426…（201326592/100663296 B）；按名各刷一次 r4 loader 692cfcca… 与 R outer 3f5ffaee…，两项 Sending/Writing OKAY、exit0；一次 reboot 后 90 秒内 nuwa 未在 adb/fastboot 枚举。用户照片显示 R 终态 NUWA SB0-R READONLY BLANK LU0 target=57393401 pages=770 writes=0，满足 W 前 R 前检。用户以电源+音量减从 R 停屏进入 fastboot；bootloader 不支持 fetch，故无刷前分区字节回读，身份由本轮精确写入、R 实跑及无中间写入约束。随后只刷一次 WX 菜单 outer 7f1f3c3d… 并 reboot；用户手动选择并确认 W，照片转录显示约 4.5 秒后停在 IRQ-off hard lock、未见 NUWA SB0-W 结果行，reviewer 判 W 提交 UNKNOWN（ses_de73aed4effeI37YjM1d49ytt0）。用户以电源+音量减回到 fastboot；按 UNKNOWN 不重试 W 的约束，只把 R outer 3f5ffaee… 再刷一次 vendor_boot_a（Sending/Writing OKAY、exit0）并 reboot，30 秒内 nuwa 未在 adb/fastboot 出现；R 读回照片 r_2.jpg 为 EXACT-SB0。reviewer 验收 W/R 证据链（ses_de7382000ffesoU8SSOnqOcwcU）：接受 W 写入效果经复位后 R 独立读回证实，同时保留 W 回执 UNKNOWN 与 FUA/断电保持未证。见 docs/nuwa-sb0-rw-device-20261127-observation.md。",
  "2026-11-26 standalone offline Data initializer cross-built for AArch64 Linux with pinned LU0/GPT/seed, one partition claim and bounded direct I/O. Native real-file tests self-checked. Ordinary TWRP does not meet the write gate; no device action or production gate change. See docs/nuwa-ufs-data-init-backend-20261126.md.",
  "2026-11-26 host-only disposable metadata initialization transaction model tests ordering and failures; it has no device backend or executable writer. Recovery metadata observed empty, exclusion and physical readback remain unproven. See docs/nuwa-data-init-review-20261126.md.",
  "2026-11-26 disposable Data experiment is separate from the disabled production Provider: exact dual-GPT LU0 window, seed-bound external initialization only, non-FUA full-command completion with shared terminal quarantine, no flush/durability claim. Host self-checked; docs/nuwa-disposable-data-20261126.md.",
  "2026-11-26 default-off host-only SB0 fixture exercises real retained Slot0 encoding and completion with simulated LU0 media: 775 read-only preflight commands then one v3 SB0 FUA WRITE(10) on the GOOD path; production write policy remains false, no qualification or image. Host self-checked; see docs/nuwa-sb0-offline-20261126.md.",
  "2026-11-26 reinit host model now tests each missing permit and invalid domain identity through the isolated attempt, including zero modeled operations and no retry. No hardware reinit or write gate change; see docs/nuwa-ufs-cold-matrix-20261126.md.",
  "2026-11-26 NEON 340/405s screen observations were transcribed by vision and relayed by the parent; sampled GPT and window results do not establish DMA ownership or durability. Production writes remain closed. See docs/nuwa-ufs-neon-20261126-observation.md.",
  "2026-11-26 NEON is a default-off retained-slot read-only survey: pre-write HC observations, raw descriptors versus READ CAPACITY, MODE SENSE, independent GPT copies, then placement-gated anchors and partial map/ring samples. Production Data writes and sync stay closed. Host self-checked; no device access. See docs/nuwa-ufs-neon-20261126.md.",
  "2026-11-26 Data v3 DualBankLogOverlay is linked into the NativeRamBlock candidate with contiguous 32-page staging; production mode-2 admission, writes and sync remain closed. Single-core host package and model self-checked, no device access. See docs/nuwa-dualbank-integration-20261126.md.",
  "2026-11-26 opt-in UFS descriptor probe adds one read-only MODE SENSE(10) and a cached, non-I/O summary of the existing live dual GPT validation. No production mode-2 open, write or sync admission; live GPT remains unknown unless validated. See docs/nuwa-ufs-modeprobe-20261126.md.",
  "2026-11-25 nuwa Data v2 links a retained-slot provider skeleton and checksum/header-last dual-slot overlay in a single-core host candidate. Write, log/export/panic and unproven FUA sync remain refused; physical FUA durability and timeout reclamation not proven. Host self-checked, no device access; see docs/nuwa-data-write-design-20261125.md.",
  "2026-11-25 nuwa retained UFS r8 connects single-page WRITE(10) FUA and a no-command completion barrier in the retained backend, exercised on mock hardware only. Production Data writes/sync and hardware qualification remain disabled. Self-checked; no device access.",
  "2026-11-25 nuwa retained UFS re-init remains unavailable on hardware: old DMA exclusion, a fresh domain, and post-HCE PHY/clock/ICE/link dependencies are unproven. The bounded re-init sequence is host-model only; the candidate refuses without MMIO. Writes stay disabled; self-checked.",
  "2026-11-25 nuwa retained UFS READ_DESC is an opt-in read-only UTP diagnostic after root publication. The banner reads the cached snapshot; orphaned diagnostics quarantine the shared slot. Data writes stay disabled. Self-checked; no device access.",
  "2026-11-24 eight seed directories plus user-authorized removal of existing var/.fseventsd; host package self-checked, not booted, deep review pending: docs/nuwa-seed-containers-20261124.md.",
  "2026-11-25 linked read-only UFS provider refuses the Data mode-2 window despite sufficient recorded geometry. PU1 renders the provider reason; no write policy change, no device action, persistence not fixed: docs/nuwa-data-persist-fix-20261125.md.",
  "2026-11-23 compact UFS and SCHED single-row banner candidate uses bounded approximate values; host self-check only and field/readability reviewer pending, see docs/nuwa-banner-short-values-20261123.md.",
  "2026-11-23 parent-reported device observations: SIGKILL ended SpringBoard and launchd restarted it, but the new instance submitted no frames; blocking versus starvation and the SB render path remain unproven. See docs/nuwa-sb-stall-20261123.md.",
  "2026-11-23 bounded repeated SpringBoard signal probe is host-only; review and device behavior pending, see docs/nuwa-sb-repeat-20261123.md.",
  "2026-11-23 banner half-screen priority correction is host-only; existing diagnostics precede optional stacks, width 119, thread dump deferred; see docs/nuwa-banner-budget-20261123.md.",
  "2026-11-23 one-shot boot-arg gated SpringBoard signal experiment is host-only; signal and lifetime review pending, see docs/nuwa-sb-restart-20261123.md.",
  "2026-11-22 census uses proc_name and six exact p_comm names; 17-character containermanagerd is matched by its 16-character prefix containermanager, which can collide. Generic trap capture deferred under stop-loss; see docs/nuwa-trap-census-work-20261122.md.",
  "2026-11-22 SVC bitmap extends the existing process census; six service short-name matches are diagnostic samples only, review pending; see docs/nuwa-svc-census-20261122.md.",
  "2026-11-22 post-handoff process census candidate scans PID 1-4096 using proc_find in a monitor thread before render_busy; PID snapshots are diagnostic only, review and independent verification pending; see docs/nuwa-handoff-proc-census-20261122.md.",
  "2026-11-22 parent reports DS=4 and linked mode-2 open refusal; Data RAM overlay is not persistent. Single retained-slot writes are disallowed by relayed deep review; see docs/nuwa-session-20261122-findings.md.",
  "2026-11-20 corrected FAT accounting: original r35 OFF contains 8355328 free bytes and fails the 8 MiB floor; ON contains 11931136 and passes. FSInfo and read-only directory-chain fsck agree; no FAT or device changed.",
  "Historical first display build: reused native UFS root, seed and root-policy checks but stopped at the FAT budget. No storage or layout change.",
  "2026-11-19 the user path reached SpringBoard and stopped on SIGTRAP. r31 links the UniXNU AppleKeyStoreState component (UniXNU/AppleKeyStoreState 8c70daf8, BSD-2-Clause-Patent, byte-identical NativeKeyStoreEvents.cpp) behind aks=1; package/nuwa-aks implements the six board functions (enabled from the boot argument, lock state 0, selector and open counters, an 8-byte device id from ADT /chosen/unique-chip-id that refuses to wrap when absent) and wraps keys in software, so keybag, passcode and reference-key operations stay unsupported and no hardware data protection is claimed. The r31 device run started the service and keybagd connected once, but the board still rebooted; r32 lost the selector ring to the panic screen clear, and r33 (ring moved into the panic-safe band) read keybagd calling aks_get_system (selector 14) twice before the reboot. r34 then produced the last pre-r35 state: SpringBoard and mobileactivationd both exit with SIGTRAP (out/nuwa-r35-20261119/build.py), the r35 abnormal-exit ring is built but not flashed, and the device still runs r34 (vendor_boot_a 46aa4fd9f575a30824543fed7c128c5013d35af8d62a98715d0312d1752c891e). Authentication NOT REACHED; the display service and SMP are still absent (page armcpu_smp_* stayed req=0 run=0 in the r16 readout). Host claims self-checked; device values parent/user-reported. Full ledger: docs/nuwa-userspace-20261119-observation.md.",
  "2026-11-18/19 vnode accounting and the RamBlock class registration were the defects behind the r22-r29 panics. The r22 cache probe read the dyld cache header through a second vnode_open/vnode_close and the device then panicked in vnode_rele_ext (vfs_subr.c:2691, usecount -1); r23 reads the header with vn_rdwr on the vnode it already holds (one vnode_lookup and one vnode_put per path) and the device reported mg=ok instead of mg=bad. r24/r25 tried to compensate the union mount with one extra vnode_ref on the old root and measured uc=10/8, two short of parity, so the union bookkeeping releases three times; r28 removed that guard (vnode_ref/vnode_rele/vnode_usecount references 0 in the object) and r29 instead gives kernproc's fd_cdir its own vnode_ref in set_rootvnode() (XNU_NUWA_ROOT_CDIR_REF, patches/xnu/8796-nuwa-root-cdir-ref.patch) so the three teardown releases each match a hold, which stopped the apfs vflush -> vclean -> vnode_update_identity panic. The Data ram disk crashed r26 and r27 in OSMetaClass::getClassName (pc 0x785ee38, far inside the NativeRamBlock literal) at two different creation points, proving the registration was the cause and not the timing: r28 brackets the class with OSMetaClass::preModLoad(__kernel__) and postModLoad() and keeps r27's creation inside nuwa_data_mount_prepare() after bsd_init/bsd_autoconf, waiting up to 2 s for the media, with one static claim in start() so a late persona match starts no second disk. Sources: package/nuwa-ramblock, package/nuwa-data, patches/xnu/8796-nuwa-root-cdir-ref.patch. Host claims self-checked; device values parent/user-reported and summarised in out/nuwa-r28-20261119/INVALID-FIXES.md.",
  "2026-11-18/19 the Data chain reached writable and the blocking detail moved from the mount to the keybag contents. package/nuwa-data/nuwa_data_mount.c obtains the volume through native_ram_block_volume_seed, mounts apfs at /private/var and verifies device, filesystem and direction, recording a stage and errno on every failure instead of panicking. Device runs then showed the volume mounted writable (r24/r25 hdr=9 gpt=ff/ff from the sheng persistence counters, r30 DATA st=4 with kb=ooo), and keybagd asked for a plain reboot at t=72109 ms with boot=11/keybag/0, i.e. the keychain had no AppleKeyStore behind it. r34 therefore ships a new macOS-built seed, data-8g-keybag.dbr 1896608 B sha256 2c95d15be323eeb336c58aa1d9cc35bc72c0923942e76a702ab24c0a858c8110, identity e17c9691f69caa05b8d2c04dfce32bb53068446bd305f0652bed889c2fc69ec8, apsb_xid 16, which adds /private/var/keybags with a 234-byte systembag.kb (KeyBagKeys SWEET), and sets ADT /defaults no-effaceable-storage = 1. That seed source lives outside the repository (D:/vmshare/data-8g-keybag.dbr); the repository keeps only the hash and the packager pin. Earlier rounds used data-8g-fixed.dbr 1609888 B sha256 6a6db153603b9a4a424711f0fa21c06a3d2b5ffb96a5001864be62d051ed40d9, identity 689fd8901505d177fc33c3ae07a342caaf201b42a14a0330928536121a5a08bd, apsb_xid 12, volume UUID B0E0F71F-A265-4038-8F5C-6D3632859DEF. Host side self-checked; device values parent/user-reported.",
  "2026-11-17 the SystemOS (cryptex) mount moved from the official non-union shape to a union on /. r12-r16 mounted the cryptex read-only on /private/preboot and handed DYLD_SHARED_CACHE_DIR to the exec, but the r16 device run (full video read, host self-checked) showed the initproc is a platform binary, so dyld ignores that variable, and mounting on /private/preboot hides the real directory, leaves /private/preboot/Cryptexes absent, dangles the /System/Cryptexes/OS symlink and falls back to /usr/lib/libSystem.B.dylib (panic: Library not loaded, no such file, no dyld cache). r17 mounts a devfs scratch on /private/preboot, creates Cryptexes inside it and mounts the cryptex at /private/preboot/Cryptexes/OS (the r16 shape kept as the recorded fallback); r18 mounts the cryptex on / with MNT_RDONLY|MNT_UNION, the only fixed location dyld can use (/System/Library/Caches/com.apple.dyld), and the r18 screen read SYSOS st=6 err=0 dev=/dev/disk1s rauth=1 uni=1 rv=1 with launchd still panicking on the missing cache; r19/r20 kernel probes then returned p3=2 for the /System/Cryptexes/OS prefix; r22 removed the environment entirely (*envp = USER_ADDR_NULL) because dyld4's CacheFinder abandons an unopenable override directory instead of falling back. Sources: package/nuwa-systemos/nuwa_systemos.c and nuwa_systemos_iokit.cpp, derived from the official offline-owner-systemos-mount patch in its non-union form. Host claims self-checked; screen values are parent/user-reported except the r16 video read.",
  "2026-11-15 milestone: the native UFS root volume mounts and initproc reaches user space. userdata's first 8446279680 B were written in 126 windows and verified by a whole-image readback (sha256 da429da64b4d91a08b8adb1d3162f8348b37b358509ab1bd5d8bf09abdbf68d7, installer exit 0, backup_policy=without-backup); the payload boots with native-ufs-root=1, native-ufs-lun=0, rd=uuid and boot-uuid DADD93F8-DBBF-4B17-A1DF-0F11E64172F7, Ramdisk_bytes 0. Device-side result is parent/user-reported (cyan band 3 = initproc exec finished, orange band 15 = initproc back in unix_syscall); the host artifacts are self-checked only. Authentication NOT REACHED, launchd completion/display/reboot persistence unverified. See docs/nuwa-launchd-reached-20261115.md.",
  "2026-11-15 bypass ledger for the root path: rootauth panic -> opt-in 8796-nuwa-root-auth-skip records nuwa_root_auth_error and continues; zero-initialised trust_cache_rt_lock -> opt-in 8796-nuwa-trust-cache-init restores trust_cache_runtime_init() + load_static_trust_cache() before machine_lockdown() (the ADT TrustCache memory-map entry is still {0,0}, so the load is a no-op); each carries an exit condition in docs/nuwa-launchd-reached-20261115.md. All three launchd-path patches stay opt-in and outside patches/xnu/series.",
  "2026-11-14 inspect-02 CRLF cause confirmed by original-capture-01: identical146B SHA c9450e5d55799e6d1ec14cfc24117f07ae343112d12a488188b617f81b073142, rc0/stderr empty, 13CRLF/0bareLF and complete CRLF footer. Minimal shell-text-only CRLF-to-LF parsing fix self-checked; full footer/ASCII/fields/rc gates preserved, call diagnostics retain raw bytes and exec-out GPT/data/image streams unchanged. Default/explicit waiver and all write gates retained. No device command or install this batch, no old whole matrix rerun. Older generic backup cause remains unknown. Evidence: out/nuwa-userdata-crlf-host-20261114/REPORT.md.",
  "2026-11-14 root observability r5 host-only self-checked: run-r5-visible-candidate kernel 55545856 B SHA256 809587d53fef9b0b3e9b2054a9e06c649d3c66cd45be3fafbe632ac575cb0acc. Root-only setup/publisher failure now terminates through existing panic renderer; runtime read failures use per-request transport-lock software snapshots and verify/copy evidence, panic after both locks release, and do not complete. Success completes exactly once. This supersedes r4 nine-failure-callback semantics, not its unchanged transport/quarantine policy. Five bounded root progress labels retain old marker IDs, 16-row capacity and framebuffer/cache publication; MEDIA_READY means signed UUID plus ancestor, not mounted. Actual native read/startRoot/publisher tests, final ARM64 marker execution and incremental helper-to-panic-to-renderer audit self-checked; independent verifier/review pending. No device, media write, packaging or mount/persistence evidence; fresh kernel-bound CHMH required. Evidence: out/nuwa-ufs-apfs-root-integration-20261114/observable-r5/REPORT.md.",
  "2026-11-14 latest user decision supersedes backup-first: explicitly install without another backup, not root boot. Host-only increment self-checked: default real-backup gate retained; --without-backup must join all existing write authorization/frozen-input gates and durably audits no backup/no rollback. Mandatory tools_inspect before write mkdir/push, same-boot/by-name/sysfs/GPT/offline/image/window/final-readback/claim gates unchanged. Only Windows adb.exe local push operand converted by actual host wslpath. Redacted stage/argv/rc/bounded stderr/original exception and stdout length/hash journaled before wrapping, including read-only failures and host open/fsync. Original failed backup cause unrecoverable, no guard/GPT attribution; cancelled output untouched and not reread. All device commands mocked, new review/verifier pending. Evidence: out/nuwa-userdata-no-backup-host-20261114/REPORT.md.",
  "2026-11-14 retained-domain UFS/APFS root integration host candidate self-checked: NativeUfs root=1/probe=0 initializes real storage classes, explicitly requires configured LUN0 and measured TUR/RC10 4K geometry, adopts retained 144KiB transport without production SMMU rewrite/fallback, binds GPT to measured capacity, preserves dual owner-policy and per-block verification, and publishes through existing IOStorage/APFS path. Continuous slot0 reads serialize through transport/window locks, completed tags may wrap, any transport/SCSI read failure permanently quarantines with IO completion. All media writes/store/log windows refused. Frozen run-r4 kernel 55545856 B SHA256 3ac37037104c98f11fc009abc42cf3495802f874ab3aa9fff1a929079454ad45; 920 native continuous/concurrent reads, 9 failure completions, incremental entry/geometry/GPT/policy-publication tests and final machine/APFS audit self-checked. No packaging/device/userdata change or mount/persistence proof; independent verifier/scout/deep pending. Evidence: out/nuwa-ufs-apfs-root-integration-20261114/REPORT.md.",
  "2026-11-14 root r4 CHMH/FAT/outer host packaging self-checked only; historical intermediate pending replacement by observable-failure kernel and fresh CHMH. Exact r4 output/negative tests and limits: out/nuwa-ufs-apfs-root-chmh-20261114-r1/REPORT.md. No root executor profile frozen, device action, userdata installation, or mount claim.",
  "2026-11-14 root r5 visible kernel rebound to CHMH/FAT/outer and isolated executor profile ufs-apfs-root-20261114-r2; actual outer readback, host-inputs process trap, three unauthorized dry phases and targeted negatives self-checked. Evidence out/nuwa-ufs-apfs-root-chmh-20261114-r2/REPORT.md. Independent packaging/executor review and verifier pending; no device action, userdata installation or mount claim.",
  "2026-11-14 combined LUN0 diagnostic isolated candidate: NOP, power Query, conditional single ACTIVE SSU to device WLUN, one TUR, RC10, one LBA0 READ10 with capacity-derived 512..131072 byte block; optional one REQUEST SENSE then terminate. Retained 144KiB full-span-qualified DMA, monotonic tags, completed-response ownership gate before reuse, no IS W1C, retry/reset/free/SMMU writes/media writes/root. Fixed accepted producer contract retained. Host-only self-checked; final independent verifier and directed deep pending, no device authorization. Evidence: out/nuwa-ufs-combined-read-20261114/RESULT.md.",
  "2026-11-14 preserved-NOP fixed-kernel CHMH packaging and isolated executor profile self-checked only: actual outer and four FAT members audited, fixed probe2/root0 args, terminal enum distinguished, no marker inferred. Experimental CHMH identity unauthenticated; kernel semantic deep review, packaging review and independent verifier pending. If kernel changes this package is withdrawn; no device operation or authorization. Evidence: out/nuwa-ufs-preserved-nop-chmh-20261114-r1/RESULT.md.",
  "2026-11-14 preserved-domain single-NOP real inspect candidate, self-checked only: immutable global once-claim, current SID/domain and full-span qualification, both queues bounded-stop/recheck, own transfer-base readback, CTR-derived publication/invalidate-only completion, one DB maximum and retained references at every endpoint. Fixed accepted r4 CPU producer contract consumed; no SMMU writes, task DB, reset/retry, root, packaging or device action. Host execution-template fault tests and final machine inventory complete; independent verifier and final directed deep pending. Evidence: out/nuwa-ufs-preserved-nop-exec-20261114/RESULT.md.",
  "2026-11-14 preserved-route host planner: measured SID60 slot2/bank2 mode words used only in synthetic complete snapshot; shared bank separately reported, widths explicitly supplied, submission always closed. No device ownership, identity-DMA or runtime qualification; self-checked only, independent review/verifier pending. Evidence: out/nuwa-ufs-preserved-route-plan-20261114/RESULT.md.",
  "2026-11-14 SID domain kernel host CHMH wrapper and isolated executor profile, self-checked only: exact probe2/root0 args, unauthenticated experimental identity, refusal and status4/status9 observations distinguished. No device authorization, ownership, translation or readiness claim; final directed deep and independent verifier pending. Evidence: out/nuwa-ufs-sid-domain-chmh-20261114-r1/RESULT.md.",
  "2026-11-14 SID0x60 bounded read-only domain candidate implemented in an isolated inspect-only overlay, self-checked: legal SMMUv2 4K geometry and EXIDS profile, complete bounded SMR uniqueness scan, unique translate bank CBAR/CBA2R/SCTLR mode/enable summary, explicit unsupported/nonunique/mapping refusal. All 256 mapping subpages PAR-qualified before MMIO; existing 16 marker rows and fMap lifetime reused. No TTBR/TCR decode, ownership claim, control write, ATOS, table/queue dereference, NOP, DMA, package, executor or device operation. Contract and pending directed deep/independent verifier: out/nuwa-ufs-sid-domain-20261114/CONTRACT.md.",
  "2026-11-14 queue-only five-read kernel increment independently verified; host CHMH packaging ordinary review and independent verifier PASS. Executor five-read profile self-checked only, independent review/verifier pending. HCE gates four queue-register reads, not an ownership or DMA claim. No device action. See docs/nuwa-ufs-queue-five-20261114.md, docs/nuwa-ufs-queue-five-chmh-20261114.md and docs/queue-five-executor-host-20261114.md.",
  "2026-11-14 handoff observation specification and synthetic correlation fixture self-checked only: same attempt/sequence, timer and EBS status, full allocation to map and kernel reservation coverage. No real observations or ownership proof; selected core producer-disabling path remains unestablished. TRACE corrected d2ec separate calls and post-scan unconditional rearm. No firmware, device, packaging or networking.",
  "2026-11-14 single-NOP r2 CLOSED, self-checked incremental only; original revision ordinary review PASS WITH CONDITIONS and independent verifier PASS at out/nuwa-ufs-nop-verifier-20261114/verifier-summary.md, not rerun. Added actual configure/start helper readback-failure partial-write trajectories, buffer binding/bytes retention and zero new doorbells on failure/reentry, plus successful NOP reentry refusal. Cache release is publication, not freeing allocation. Fixed OEM original/patched/INF hashes and selection reject altered input. Static trace out/nuwa-ufs-ownership-trace-20261114/TRACE.md closes OEM EBS registration-code callback target0x369c through CDB35/1b producer paths, timer cancel/rearm boundaries, shared list allocation origin, IOMMU protocol authority and pinned loader last SFS Close; registration success/execution, final BlockIO, old allocation lifetime and active SID domain still NOT OBSERVED. No new public source/device/packaging/root/GPT/media command; real entry/r7/executor unchanged. Directed deep only for concrete handoff blocker/implementation, not this host-only increment.",
  "2026-11-14 original single-NOP host work CLOSED; now independently reproduced for host scope only. Actual local atomic single-attempt exclusion, no hardware owner token; real entry refuses before MMIO/allocation. Pinned ShengUfs queue/SMMU/command/poll bodies reused in explicitly assumed host model; NativeUfs allocation/cache source preserved, not runtime-qualified. Nuwa live DT establishes SID0x60/apps-smmu, not active OEM domain. Selected OEM EBS registration code points to callback0x369c; successful registration/execution, producer revocation, old queue lifetimes and SMMU ownership unqualified. No packaging/device/root/GPT/media commands, official edit or r7/executor change.",
  "2026-11-14 HC executor profile ufs-hc-observe-20261114-r1 host-only self-checked, independent executor review and verifier pending; see docs/ufs-hc-executor-host-20261114.md. Parent reports r7 kernel deep and verifier PASS and packaging review/verifier PASS. No device authorization or action.", "2026-11-13 task A, self-checked: eleven IOBlockStorageDevice imports mapped independently in donor 2ec297ba and current r5 prelink by segment offset; class IOService parent/0x90 size/C2/D2 and 190 slots checked, four actual-byte mutations rejected and eleven offline aliases nm-checked. NativeUfs.o f673df62 preserved, actual iOS17 deployment retained for annotation reference built with the same 8796 flags. No final link, runtime/private-ABI acceptance, hardware or VerifiedRoot changes; layouts must be rebound. See docs/nuwa-ufs-host-20261113.md.", "Launch route B decided 2026-11-06 (docs/decisions.md): bring-up runs from fastboot boot (route A, no partition writes), then the end state is the native UFS root with the userdata partition flashed as the root volume. B needs [userdata] LBA geometry from this board's GPT, root_match_volume_uuid from the built userdata image, native-ufs-root=1, CONFIG_XNU_NATIVE_UFS=y and the ShengUfs component; the flash overwrites Android data and requires explicit user authorisation.", "Repo hygiene: removed the committed __pycache__ copies of the format-1 legacy tooling; no source behaviour changes.", "Payload source decided 2026-11-07 (docs/decisions.md, subsection in section 1): route B keeps taking the boot payload (kernel, ADT, trustcache and unixnu.toml inside the RamDisk) from fastboot boot and does not flash boot.img into the boot partition. Observed: fastboot boot writes no partition, so the payload lives only for that boot. Inferred: every boot needs a host-supplied boot.img, and a device reboot returns to the Android boot partition instead of entering UniXNU, so the launch-route section 1 statement that a reboot goes straight into UniXNU and the host-free standalone boot end state do not hold today; standalone boot would need a separate decision plus explicit authorisation to flash boot. userdata remains the persistent root volume and flashing it still needs per-round authorisation; fastboot boot still needs a user confirmation before any device action.", "Read-only GPT capture, 2026-11-07 (docs/device-evidence-2026-11-07.md): six LUNs sda..sdf are present and report 4096-byte logical and physical block sizes; userdata is sda32 with first_lba 3110976 and last_lba 61850618, 58739643 LBAs = 240597577728 bytes (about 224 GiB) at 4096 bytes per LBA, and its last_lba equals that disk's last usable LBA; peer entries are super sda31 751680..3110975, metadata sda17 16384..32767, persist sda18 32768..49151, boot_a sde14 149126..198277 (49152 LBAs = 201326592 bytes = 192 MiB), vendor_boot_a sde24 217670..242245, abl_a sde11, modem_a sde7 and xbl_a sdb1. board.toml [userdata] records the geometry; no GUID, serial or kernel command line is recorded.", "Unit trap: GPT LBAs are 4096-byte units taken from the GPT header parsed on the host, while /sys/block/*/size and blockdev --getsz report 512-byte sectors, so the two must not be mixed without conversion (a factor of 8; for sda 61850624 x 4096 = 494804992 x 512). sda declares 32 GPT entries with usable LBAs 6..61850618. The recovery image does not support sgdisk -p (invalid option -p), so the GPT header and entry array were copied with dd to the host and parsed there; the device was only read.", "Collect the first storage and root observation, its cause when established, and the resulting implementation decision."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["The milestone is not the interaction target: authentication is NOT REACHED (unauthenticated experimental CHMH), launchd's own initialisation, the display service and any reboot-to-same-system behaviour are unverified, and the kernel reached user space only with three opt-in bypasses (root auth skipped, runtime trust cache empty, initproc exec policy ignored).", "The userdata write and its whole-image readback are self-checked device-side: the installer reported exit 0 and the pinned hash, its independent verifier re-run (47 tests, hashes 1d8d077e/bb97229c/bc344eb1) was host-only with device_calls=0. The boot payloads in boot_a/vendor_boot_a have bootloader write acknowledgement only (no fastboot fetch, no adb in fastboot mode).", "Hardware inputs and implementation remain incomplete: the board DTS has no measured storage/display register set, and the root volume's write persistence inside the allocated Data region is untested.", "Any new kernel requires a freshly bound CHMH and cannot reuse the r7/r8/r9 packages; the observation kernel and the observe patches are temporary and must not be carried forward."]
next_action = ["Next interaction work, after the 2026-11-15 milestone: verify that launchd finishes initialising (its exit/relaunch behaviour), land the display service through GopFramebuffer, then power-cycle once and check the device returns to the same persistent root. Keep the three bypasses opt-in and delete each one only when its exit condition is met (real trust cache, authenticated boot).", "Boot payloads now live on the device: boot_a carries the Mu-Silicium loader plus DarwinBoot and vendor_boot_a the r9 package, both written under this round's authorisation, with rollback steps in out/nuwa-boot-payload-write-20261115-01/ROLLBACK-r9.md; keep that backup until the interaction target is reached.", "Inventory the required storage and root inputs before implementation.", "Flash timing confirmed 2026-11-07 (docs/decisions.md section 8): flashing userdata only validates persistence and comes after all first five bring-up stages, none of which writes a partition. Order: (1) firmware builds, memory ownership gate has evidence, and the boot-chain handoff passes independent review (after the Astra High channel recovers); (2) first fastboot boot observing UEFI, menu, payload and DarwinBoot, with the firmware log exported through the Tools QR path; (3) kernel entry through to platform expert; (4) read-only storage validation of the UFS controller, capacity, GPT and known data blocks, with the OS/SystemOS windows inside userdata; (5) build the root volume image, take the root UUID, check hashes and reach launchd on the in-memory boot path; (6) flash userdata and validate persistence. Before flashing, confirm item by item: the first five stages have real log evidence, the [userdata] geometry comes from a real read rather than an estimate, and the user has a usable stock fastboot package and confirms the Android data is no longer needed; the exact partitions, commands and impact are stated beforehand and executed only after explicit approval in that round. The boot partition is not flashed because the user decided to keep fastboot boot."]
evidence = [
  { kind = "host", reference = "docs/nuwa-ufs-ram-recovery-20261126.md", revision = "2813acad84d97cdd3ad99ae3dfb11fd279d23ada", command = "Working-tree follow-up: build-nuwa-ufs-ram-recovery.py; test-nuwa-ufs-ram-recovery.py; original backend rebuild and test", result = "Two AArch64 PID 1 review fragments and four native receipt/build tests self-checked; original transaction binary unchanged and six native tests self-checked. No accepted recovery image, USB, or device execution." },
  { kind = "source", reference = "docs/nuwa-sb0-wr-20261126.md", result = "Isolated, exact-seed retained SB0 W/R implementation and host fixture. No firmware producer exclusion, live authorization, or power-loss durability claim." },
  { kind = "source", reference = "docs/nuwa-sb0-r4-input-20261126.md", result = "Self-checked r4 FD binding, input ABI disassembly, standalone no-grant/no-storage EFI build and five host state tests. No on-device key observation, grant, or UFS producer fence." },
  { kind = "source", reference = "docs/nuwa-sb0-wx-20261127.md", result = "Host self-checked explicit write kernel/ADT/outer, final ARM64 write and park call chain, 22 simulated transport cases, and exact FAT readback. No physical submission, reboot or persistence evidence." },
  { kind = "device", reference = "docs/nuwa-sb0-rw-device-20261127-observation.md", revision = "adf10579a71a10869b5e482140db01d45b3e0ee9", command = "WSL native adb 37.0.1 shell -T -n over the unique nuwa recovery for uid/getprop/blockdev/sha256; Windows fastboot 37.0.1 -s <nuwa> getvar product/is-userspace/current-slot/partition-size; one flash boot_a 692cfcca..., one flash vendor_boot_a 3f5ffaee..., reboot plus 90 s adb/fastboot poll; user power+volume-down recovery entry; one flash vendor_boot_a 7f1f3c3d..., reboot plus 30 s poll; user selected and confirmed W in the menu, observed ~4.5 s then an IRQ-off hard lock with no NUWA SB0-W row; one readback flash vendor_boot_a 3f5ffaee..., reboot plus 30 s poll; user photos r_1.jpg (BLANK) and r_2.jpg (EXACT-SB0). No adb write/mount and no menu selection by the host.", result = "User photo gives R terminal NUWA SB0-R READONLY BLANK LU0 target=57393401 pages=770 writes=0. Both flash rounds returned Sending/Writing OKAY and exit 0. After the WX reboot 30 s of polling saw no nuwa adb/fastboot enumeration; only the separate enuma bootloader remained. The bootloader reports 'Device does not support fetch command', so no fresh byte-level readback of the pre-WX partitions exists; identity rests on the exact writes, the R boot and the absence of intervening writes. The user selected/confirmed W; the photo shows ~4.5 s then an IRQ-off hard lock and no NUWA SB0-W result row, so reviewer classified the W submission as UNKNOWN (ses_de73aed4effeI37YjM1d49ytt0). After recovery to fastboot the R outer was flashed once to vendor_boot_a; 30 s of polling saw no nuwa enumeration. User photo r_2.jpg then reported EXACT-SB0: R2 independently read back the target page as the expected SB0 content after the W attempt and the flash/reset sequence. Reviewer accepted the W/R evidence chain (ses_de7382000ffesoU8SSOnqOcwcU): the write effect is confirmed by the post-reset R readback, while the W command receipt stays UNKNOWN and FUA/power-loss retention is unproven." },
  { kind = "host", reference = "docs/nuwa-ufs-data-init-backend-20261126.md", revision = "331ea5e223e09e8135679f132dc7a6f1a4fa09d0", command = "Working-tree follow-up on this base: build-nuwa-ufs-data-init.py; test-nuwa-ufs-data-init.py; readelf -h -l -d -n", result = "Self-checked static recovery ELF and six native O_DIRECT sparse-file tests. Actual recovery block claim, offline launch, flush/readback semantics and hardware durability not verified." },
