schema_version = 1

[device]
name = "nuwa"
soc = "SM8550"
os_profile = "ios-16.7.16-20H392"
summary = "Xiaomi 13 Pro (SM8550) iOS 16.7.16, official step 7. Stage5 actually parked on AppleImage4 missing AMNM policy panic, not stage5 proof; historical A/TWRP recovery confirmed. AMNM-only successor self-checked, not independently verified or device-tested; device release prohibited. Final external provider-interface blocker: no demonstrated supported no-AP-token/no-shadow entry; provider source or supported compatible implementation required. Area levels unchanged."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/xnu/series", ".github/**", ".gitignore", "local.toml.example", "scripts/__pycache__/**", "scripts/**/__pycache__/**"]
inputs = ["SM8550 common repository commit (pinned in feeds.toml).", "The iOS 16.7.16-20H392 OS profile at UniXNU/profiles/os/ios-16.7.16-20H392, authored locally in UniXNU commit 693f5d9cae8a408dd18b39f3f9fdc4228c934241; the official profiles/os tree ships iPadOS 17.7.11, iPadOS 26.5.2 and iOS/iPadOS 27.0.1 only.", "The donor KernelCache member hash for [ipsw.sha256]; the profile already carries the IPSW url, chip_id, board_id and the DeviceTree plus StaticTrustCache member hashes read from the donor BuildManifest."]
configuration = ["board.toml schema_version = 2 with [board], [components], [kernel], [device_tree], [firmware], [payload], [payload.adt], [package].", "feeds.toml pins UniXNU-sm8550-common at a9f45dc60c035084b95463781538380f4c3606c9.", "dts/nuwa.dts includes soc:dts sm8550.dtsi and carries the measured DRAM span only.", "board.toml [ipsw] declares product, version, build, device_class and fetch only; url, chip_id, board_id and the member hashes are inherited from the selected profile instead of being duplicated.", "[payload] tools = true adds the Tools entry to the generated payload boot menu."]
procedure = ["./unixnu defconfig nuwa_defconfig -D ../UniXNU-nuwa", "./unixnu fetch -D ../UniXNU-nuwa", "./unixnu status --json -D ../UniXNU-nuwa", "./unixnu tree -D ../UniXNU-nuwa"]
findings = ["The local iOS 16 OS profile lives at UniXNU/profiles/os/ios-16.7.16-20H392 (UniXNU commit 693f5d9cae8a408dd18b39f3f9fdc4228c934241): xnu 8796.141.3 (1b191cb58250d0705d8a51287127505aa4bc0789), the donor IPSW url/product/build/device_class (d22ap, chip 0x8015, board_id 6), the DeviceTree and StaticTrustCache sha256 pins, ADT identity D22AP, kernelcache sha256 and the 31 prelink roots verified against the donor __PRELINK_INFO; board.os_profile and [device].os_profile select it.", "board.toml sets [firmware] preflight and [bootimg] dtb = 'build/nuwa/sm8550-xiaomi-nuwa.dtb'; the dtb path is relative to the build tree, the base ctx.tree/dtb does not expand a {uefi} template, and an FDF-embedded DTB does not automatically become the appended DTB.", "Official step 4 is complete: defconfig, fetch, status --json and tree resolve the board against that profile, and the fetch is recorded on 279c990a0c7a238aa0a5818493c6cd6a46528749 (unixnu.lock: xnu 1b191cb5, sm8550 a9f45dc6, edk2 cfb93724, libplatform a00a4cc3, libdispatch 30fe6a7d, libpthread c0e60fb5, AvailabilityVersions 933f9360, corecrypto-2023 11fba65b, IOStorageFamily e45fbe30). Step 5 (hardware description and firmware) is in progress.", "The official profiles/os tree ships iPadOS 17.7.11, iPadOS 26.5.2 and iOS/iPadOS 27.0.1 only, which is why this profile is authored locally; profile selection is no longer blocked.", "Kernel patch set (2026-11-08, host-only, self-checked): on xnu-8796.141.3 (1b191cb58250d0705d8a51287127505aa4bc0789) 13 of the 56 arch patches fail plain git apply, so board.toml [kernel] patch_series now mounts only device:patches/xnu/series, a 17-entry minimal set for stage 5: 13 arch patches by arch: reference plus four local 8796 ports (apple-only-cpu-tunables, non-apple-iommu-bootstrap, source-machine-layer, zzx-pmap-sync-64bit-pa). The optional storage, GPU, AES, exec, systemos, cryptex, trust, userland and mockfs patches are not mounted; pgz-aligned-validation and published-freezer-condition do not apply because their target code is absent in 8796. The set applies cumulatively to a clean 8796 clone and unixnu status --json resolves the same order; nothing has been compiled and the four ports plus four high-risk arch patches (native-4k-bootstrap-capacity, native-4k-user-abi, non-apple-cache-monitor, non-apple-pmap-field) have not been reviewed. Later (2026-11-08): nuwa_defconfig adds CONFIG_XNU_NATIVE_AES=n and CONFIG_XNU_SOURCE_PTHREAD=n, board.toml replaces the kernel archive list and points [kernel.prelink] at the 8796 kernel file; the kernel now builds and links, and prelink stops on an ABI gap against the donor kernelcache (see packaging). Update (2026-11-08): [kernel.prelink] roots now exclude apfs and Libm through board.toml and prelink stops at an external PC-relative encoding at 0xfffffff005b8c1cc.", "board.toml [payload] tools = true adds the Tools entry (id = tools, action = tools) to the generated EFI/UniXNU/unixnu.toml, so the exported firmware log can be read from the boot menu; the entry has not been exercised on hardware.", "board.toml [firmware.defines] now sets ENABLE_SECUREBOOT = 0 (2026-11-07): SiliciumPkg.dsc.inc:13 passes -D ENABLE_SECUREBOOT=$(ENABLE_SECUREBOOT) unconditionally, and unixnu runs the EDK II build directly instead of Mu-Silicium's build_uefi.py (default 0, --enable-secureboot is opt-in), so an empty macro failed the preprocessing of SecureBootHandler.c:216 (#if ENABLE_SECUREBOOT == 1). Self-checked with the define in place: the firmware build recorded in the firmware area exited 0, and the Verifier subagent later re-ran it independently; nothing has run on hardware.", "dts/nuwa.dts comment corrected (comment-only): scripts/unixnu/devicetree.py takes exactly one /memory node with one contiguous reg range, so the previous nine-segment TODO was wrong; the 0x8c0000000/0x240000000 geometry and the owned-window contract are unchanged (docs/step5-firmware.md).", "Repo hygiene: removed the committed __pycache__ copies of the format-1 legacy tooling; no source behaviour changes.", "Repo hygiene: the committed __pycache__ blobs were untracked and are ignored; scripts/ keep format-1 legacy tooling that still points at deleted absolute paths and is not part of the official flow.", "The SM8550 shared series targets XNU 10063/12377, so soc:patches/xnu/series is deliberately not selected for the 8796 line.", "[userdata] is populated in board.toml from the 2026-11-07 read-only GPT capture (docs/device-evidence-2026-11-07.md): first_lba = 3110976, last_lba = 61850618, lba_bytes = 4096, copied from the GPT dump parsed on the host; no GUID, serial, kernel command line content or chip seed is recorded.", "ADT identity values decided 2026-11-07 (docs/step5-firmware.md, 'ADT identity values'): ADT /chosen/chip-id (u32) and unique-chip-id (u64) are software identity seeds for IOPlatformUUID, not Apple silicon IDs; the generator checks only nonzero and width and never compares them against the SoC. The donor iPhone10,3 DeviceTree (base out/ipsw/20H392/DeviceTree.d22ap.dtb, an LZFSE-compressed ADT) carries chip-id = 0 and unique-chip-id = 0, template placeholders that iBoot fills at run time, so the donor offers no value to copy.", "chip_id = 4acab8db was drawn at random on the host on 2026-11-07: nonzero, and different from sheng's 0x8142 and from the donor ApChipID 0x8015. It is written in board.toml [payload.adt] and stays fixed once images exist.", "The unique-chip-id u64 seed is drawn at random on the host as eight hex digits and kept only in the git-ignored unixnu.local.toml of the base UniXNU checkout; no seed value is committed. Every build must reuse the same value, and if it is lost the same device gets a different IOPlatformUUID, so the user must back it up.", "root_match_volume_uuid is commented out in board.toml for bring-up stages 1-5: fastboot boot uses the in-memory Data seed, the generator omits /chosen/root-matching when the value is empty, and a non-empty placeholder fails UUID parsing. Before stage 6, read the OS APFS volume UUID (not the container UUID and not the Data volume UUID) from the built userdata image and write it to board.toml and to the OS profile [root] os_volume_uuid.", "Self-checked (2026-11-07, in memory, no device): generating the ADT from the real board.toml, the iOS 16 profile and the local seed returned 12984 bytes; /chosen carries chip-id = 0x4acab8db, an 8-byte nonzero unique-chip-id matching the local seed, dram-base = 0x8c0000000, dram-size = 0x240000000 and darwinboot-memory-size = 0x40000000, has no root-matching (expected at this stage), lists 8 cpu reg entries 0..1792, timebase-frequency = 0x124f800 and psci = smc, and arm-io holds only the intc child because nuwa.dts still describes CPU, memory and intc only (step 6 work). ephemeral-storage is absent because no Data seed was passed, which is a property of this run, not a stage 1-5 conclusion.", "board.toml [os_overrides.\"ios-16.7.16-20H392\".kernel.prelink].roots drops 4 of the profile's 31 roots for stage 5 (apfs, Libm, IOAVFamily, IOMobileGraphicsFamily); dropping IOAVFamily/IOMobileGraphicsFamily removes the transitive Libm dependency, and prelink then completes (host build, exit 0, 55,357,440-byte kernel.macho); host build only, self-checked.", "ADT identity TODO filled from the 20H392 (16.7.16) donor DeviceTree (Firmware/all_flash/DeviceTree.d22ap.im4p -> decoded 'bvx2' ADT at out/ipsw/20H392/dt.dtb): board.toml [os_overrides.\"ios-16.7.16-20H392\".adt.product] now carries product-id = fd079b298144a7deb4d7c87fef3eb474d8f0e7eb (20-byte MGProductType, dt.dtb offset 0x29544), artwork-device-subtype = 2436 (u32, dt.dtb offset 0x29e48) and corrects compatible-device-fallback from the profile's 'iPhone10,1' to 'iPhone9,2' (dt.dtb offset 0x29698); device-class (d22ap) identity, host-only, self-checked.", "early_security_init and text_fixups stay unset for stages 1-5 (recorded as skipped, not required): the 8796 early security initializer is a reversing task on the stripped AMFI kext (not a field lookup) and on a non-Apple SoC without an Apple PMGR running it risks the 'AMFI: No PMGR?' panic (same SoC family as nx769j/caihong, UniXNU docs/devices/nx769j.md); text_fixups are dyld-cache byte fixes only derivable when a boot reaches one (nx769j: 'there is nothing to derive before that'). AMFI still starts through its ordinary start routine without them.", "board.toml [payload] size_mib changed 192 -> 64: the prelinked kernel (~53 MiB) plus trust cache and ADT needs a FAT volume that fits the 96 MiB vendor_boot partition (192 MiB would not fit); 64 MiB keeps the volume-check headroom.", "board.toml [payload] now pins trust_cache_sha256 = [\"367e051548f9f0407fa9fe9d40007fa4e7c5ff27c45f5a7a30cedf344e24d98e\"] (a device-level array replacing the 20H392 profile's raw-hash pin 63e01c03… as a whole): the profile pins the raw StaticTrustCache IM4P hash, but DarwinBoot's ValidTrustCaches (DarwinBoot.c:371-397) only accepts the bundle format, which is why the on-device xnu entry returned EFI_COMPROMISED_DATA; the same donor module re-bundled with scripts/bundle-ipsw-trust.py is pinned instead. Host-only (self-checked).", "Entry probe for stage-4 diagnosis: board.toml [payload] panic_screen = true makes payload.build patch a copy of kernel.macho (scripts/patch-xnu-entry-probe.py --panic-screen --no-reset) - stage 1 blue bar at the MMU-off kernel entry, stage 2 magenta bar just before SCTLR_EL1, plus the _panic/_panic_trap_to_debugger redirect; no reset, so the panel stays lit and the device is recovered by holding power (PSCI SYSTEM_RESET would cold-boot Android). Host build only (self-checked).", "[payload] entry probe variant for stage 3 (2026-11-09, host build, self-checked): board.toml now sets entry_probe_reset_delay = 6 and panic_screen = false. Enabling panic_screen together with the reset delay makes the panic screen code (0xa2f bytes for nuwa's kernel) overflow the zero padding after _start by 0x5f (95) bytes past PANIC_CAVE_END, which scripts/patch-xnu-entry-probe.py refuses (same limitation as the alioth device record). This variant keeps the stage 1 blue bar, stage 2 magenta bar and the 6 s stage 3 PSCI SYSTEM_RESET; the panic path is not redirected.", "Entry probe stage 3 verified on device and switched to stage 4 bisect (2026-11-09): the stage-3 payload (entry_probe_reset_delay = 6, panic_screen = false) auto-rebooted ~6 s after the bars on hardware, proving the CPU passed the MMU enable (msr sctlr_el1) and kept executing. The project adaptation has not flashed userdata; before that, userdata had already been overwritten with Apple data by other operations, so Android cannot boot (user-reported, not independently verified). After reset, the device gets stuck at the Android boot animation and consumes retries for the active slot; slot A TWRP is unaffected. board.toml [payload] now adds entry_probe_reset_after = \"_ml_parse_cpu_topology\" (entry_probe_reset_in defaults to _arm_init, occurrence 1): stage 4 replaces stage 3 (payload.py:169-177 passes --reset-after; patch-xnu-entry-probe.py:389-396 emits exactly one site via elif, so the two never coexist and there is no masking). The 6 s timed PSCI SYSTEM_RESET now fires after the single _arm_init call to _ml_parse_cpu_topology (bl at 0xfffffff007998914, occurrence 1) instead of right after the MMU enable; a reset then means the call returned, no reset means it did not return (or was never reached).", "Stage-4 next probe (2026-11-09, host-only candidate, self-checked): user-reported hardware reset after about 6 s with revision 07e176761020d3d7f01fb086d9a89af3e3531eb9 proves _ml_parse_cpu_topology returned. board.toml now selects _arm_vm_init in _arm_init, occurrence 1, delay 6, panic_screen=false; reset means arm_vm_init returned, no reset is inconclusive (not reached, did not return, or probe/reset failure). Cave 4 at 0xfffffff0073ee620 is inside kernel __TEXT_EXEC; patch-xnu-entry-probe.py:97-118 uses PC-relative BL/literal load, a 115200000-tick constant, register-only CNTPCT_EL0/PSCI SMC. xnu-8796.141.3 osfmk/arm64/arm_vm_init.c:1998 obtains the KVA segment, :1413 maps the full __TEXT_EXEC ROX, :2097 calls arm_vm_prot_init, and :2144-2156 switches tables and invalidates the bootstrap identity map. Identity-map removal alone therefore does not invalidate the cave; actual post-return execution remains untested. Existing payload/vendor_boot image and JSON .v5 backups were retained without overwrite. Both build commands in the packaging procedure exited 0; the payload is 64 MiB <96 MiB, while stock-padded vendor_boot is exactly 96 MiB, NOT strictly smaller. No device action or push.", "2026-11-09, user-reported hardware evidence relayed by the parent session: the six-second _arm_vm_init post-return probe at device revision 2d55e2a8d223f558f01c948db45db3c71f747c96 reset on hardware. This establishes that callee returned; it does not establish that subsequent code must hang. The implementer ran no device command this round. Next diagnostic candidate (2026-11-09, host-only, self-checked; Reviewer PASS WITH CONDITIONS supplied by parent): board.toml [payload] panic_screen=false, entry_probe_reset_delay=6, entry_probe_reset_after=_PE_create_console, entry_probe_reset_in=_arm_init, entry_probe_reset_occurrence=1, entry_probe_reset_before=false. The actual BL site is 0xfffffff007998b84; cave 0xfffffff0073ee620 lies in __TEXT_EXEC RX. _PE_create_console tail-calls initialize_screen, which can return. The six-second delay starts after the callee returns, not at boot or at the magenta bar. A probe reset proves only this callee returned, not that the following PE_init_printf ran; no reset is inconclusive (not reached, did not return, or probe/reset failure). The BCM2837 fixed panic-buffer access at 0x3c0fc000 in pexpert/arm/pe_init.c remains a risk and is not changed. No VM, memory-window, console implementation or base-source change, no device operation and no push; all area statuses remain planned. This finding supersedes historical claims that no reset necessarily means no return. New candidate not hardware-tested; independent verification pending."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The donor KernelCache member hash (kernelcache.release.iphone10b) is not pinned in [ipsw.sha256] yet; the OS and Cryptex1,SystemOS member hashes are taken at the userdata stage.", "No board DTS register set for storage, display, input, GPU, network, audio and power yet, so those components stay unselected.", "ADT identity: chip_id is decided and written (4acab8db); root_match_volume_uuid stays unset until the userdata image is built before stage 6; the unique-chip-id seed lives only in the base checkout's git-ignored unixnu.local.toml and needs a user backup."]
next_action = ["Official step 5: finish the uefi-nuwa firmware integration (UniXNU, UniXNUDxe, DarwinBoot, RamDisk, DiskIo and FAT modules plus the Advanced Logger export) and reconcile the board DTS with the firmware DTB before selecting step 6 drivers."]
evidence = [{ kind = "source", reference = "board.toml", result = "2026-11-09 single post-map candidate on 8a4063e51c437da62e031ea2a81d9e3d925988d9 (Reviewer PASS WITH CONDITIONS relayed by parent): entry_probe_reset_after=_ml_io_map_wcomb, entry_probe_reset_in=_PE_create_console, occurrence=1, before=false, delay=6, panic_screen=false. User reports console-before on that revision immediately reset after three bars; console-after on 0114789e3b859f66a00b483ee7679dd9722e2bcf showed three bars without reset. No root-cause assertion. Positive means the mapping call returned, before first LDR at 0xfffffff0079686a4, not that PA 0x3c0fc000 is readable/writable. Terminating probe does not preserve the return value or resume original flow. No base, kernel source, firmware, PA, VM or memory-window change; no device action or push; self-checked only." }, { kind = "source", reference = "board.toml", result = "board.os_profile = ios-16.7.16-20H392 resolves to the profile at UniXNU commit 693f5d9cae8a408dd18b39f3f9fdc4228c934241, which carries the IPSW url, chip_id 0x8015, board_id 6 and the DeviceTree/StaticTrustCache sha256 pins; [payload] enables the Tools entry and [firmware.defines] sets ENABLE_SECUREBOOT = 0 because SiliciumPkg.dsc.inc passes the macro unconditionally while unixnu bypasses build_uefi.py." }]

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["proprietary-files.txt", "board.toml", "dts/**", "scripts/check-nuwa*.py", "scripts/prepare-nuwa-firmware.py"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for firmware and boot."]
procedure = ["Follow the firmware and boot stage in the porting guide and record the actual commands."]
findings = ["board.toml [os_overrides.\"ios-16.7.16-20H392\".kernel.prelink] also replaces roots (27 of the profile's 31; apfs, Libm, IOAVFamily and IOMobileGraphicsFamily dropped for stage 5; IOAVFamily/IOMobileGraphicsFamily return with the GPU/media step, and dropping them removes the transitive Libm dependency whose literal pool still trips the prelink planner); host build only, see packaging.", "board.toml now also carries [os_overrides.\"ios-16.7.16-20H392\".kernel.prelink] kernel = the linked mach.development.bcm2837.unstripped (the profile names the 10063 .unstripped.noctf file, which the 8796 makedefs never produce), and a replaced [kernel] archives list; see the configuration and packaging areas. Host build only.", "board.toml [os_overrides.\"ios-16.7.16-20H392\".root] os_volume_uuid is empty for stages 1-5: the OS profile placeholder REQUIRED_ROOT_VOLUME_UUID stops the kernel bootstrap pass, the owner boot manifest is off for nuwa, and the real OS APFS volume UUID is read from the built userdata image before stage 6; host build only.", "board.toml [kernel] patch_series now mounts only device:patches/xnu/series (the minimal 8796 patch set, see the packaging area); this is a build-configuration change and was not run on hardware.", "Reviewed firmware facts (2026-11-07, docs/step5-firmware.md): the firmware DTB carries no splash_region node, while the live machine reports 0xb8000000 with size 0x2b00000 and MemoryMapLib already describes a Display Reserved region. Whether ABL consumes that reservation is unproven, so nothing is injected into the DTB by this review; the firmware repository carries a separate DSC/FDF integration (uefi-nuwa commit becd65b921553957899cc069d6ac6c1278dedd08).", "Vendor inputs: the nuwa DXE set comes from the public Project-Silicium/Device-Binaries repository, path nuwa/, commit 4648d229f9bedf0d17ba6fe2bebd3fc6fb01422d (git tree d8512b51f264cb4dc2114a788066a80fb77cf8b8, 333 files, 8.5 MB), checked out sparsely into uefi-nuwa/Binaries and kept out of the firmware repository history. A local per-file SHA-256 manifest hashes to 6cff995a23b458bcbee0518dbe9b9d74eeea388e410b17413c913a361e702cab. With this tree present every Binaries/nuwa reference in nuwa.dsc/nuwa.fdf resolves (static path check only); the remaining unresolved references belong to the Mu and Mu_Basecore submodules, whose contents are staged by hand for the build (see the build-input finding below). The repository declares no licence, and the upstream origin of these binaries is unverified.", "bootimg.dtb wiring stays deferred to a separate report. The ADT identity is decided: chip_id = 4acab8db is written in board.toml (see the configuration area), and root_match_volume_uuid stays commented out until the userdata image exists before stage 6.", "Step 5 firmware integration is recorded as an independently re-run build (2026-11-07): after an earlier self-checked run (the Verifier subagent's first attempts returned 'Country, region, or territory not supported'), the Verifier subagent re-ran the build against device repository b1064eb8 and uefi-nuwa e494c01b with PASS. uefi-nuwa commit becd65b921553957899cc069d6ac6c1278dedd08 holds the nuwaPkg DSC/FDF integration (UniXNU, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot and AdvancedLogDxe with DiskIo and FAT). From the base checkout (cwd /mnt/d/Code/PortingiOS/UniXNU) `./unixnu build firmware -D ../nuwa/UniXNU-nuwa --uefi ../nuwa/uefi-nuwa --edk2 /home/wh1stl3/nuwa-fw/mu_basecore` exited 0 and produced uefi-nuwa/Build/nuwaPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd, 3145728 bytes = 0x300000, matching [firmware] uefi_fd.size in nuwa.toml; FVMAIN.inf lists UniXNU, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot and AdvancedLogDxe. AdvancedLogDxe's producer is now wired in uefi-nuwa commit e494c01b2f679439fdaeaf2084b693c7220543f5: DXE_CORE uses AdvLoggerPkg's DxeCore AdvancedLoggerLib (its constructor installs gAdvancedLoggerProtocolGuid), DXE_DRIVER/UEFI_DRIVER/UEFI_APPLICATION use the Dxe instance and DXE_RUNTIME_DRIVER the Runtime instance, the real AdvancedLoggerHdwPortLib runs over SerialPortLib (DEBUG keeps FrameBufferSerialPortLib so the screen log remains and is also written to the buffer), DEBUG sets DebugLib = BaseDebugLibAdvancedLogger while RELEASE is unchanged, SEC keeps BaseDebugLibSerialPort because Sec.c calls BaseDebugLibSerialPortConstructor directly (the first link attempt failed before that correction), and PcdAdvancedLoggerBase = 0 with the DXE_CORE library allocating a 4 MiB buffer via AllocateReservedPages instead of a fixed physical address. The independent rebuild passed and produced a 3145728-byte SILICIUM_UEFI.fd; DxeMain links DxeCoreAdvancedLoggerLib, AdvancedLogDxe and UniXNUDxe link DxeAdvancedLoggerLib, Guid.xref contains gAdvancedLoggerProtocolGuid, and FVMAIN.inf still lists the five modules. Runtime dispatch and the Tools -> Advanced Logger page remain unverified (a device run is needed), the assumption that the 4 MiB reserved-page allocation lands in the DXE heap is unconfirmed, the boot-chain review concluded APPROVE WITH CONDITIONS on 2026-11-07 scoped to the first fastboot boot (deep not used; no candidate met ai-orchestration §2.3), and the memory ownership gate is still open.", "Firmware build inputs (2026-11-07): Mu_Basecore comes from the GitHub archive cfb93724a06ff86ff5ba971413368a7809ee42a5 extracted under WSL ext4 at ~/nuwa-fw/mu_basecore; the archive carries no submodule contents, so five submodule directories were copied from the already-checked-out base out/feeds tree (MdePkg/Library/BaseFdtLib/libfdt, MdePkg/Library/MipiSysTLib/mipisyst, BaseTools/Source/C/BrotliCompress/brotli, MdeModulePkg/Library/BrotliCustomDecompressLib/brotli, SecurityPkg/DeviceSecurity/SpdmLib/libspdm). openssl (archive 67b5686b4419b4cb8caa502711c41815f5279751) sits at the uefi-nuwa gitlink path; Common/Mu b8d46c71, Common/Mu_OEM_Sample b70b4b7b and Silicium-ACPI 2d465ad7 come from the fixed pins; Binaries are listed in proprietary-files.txt. Inside WSL the link needs MTU 1400 and the proxy is passed through environment variables to the Windows host gateway port 7890 with allow-lan enabled. These staging steps are manual and not scripted yet; the command sequence is in docs/step5-firmware.md.", "[firmware] patches wire Resources/MuPatches/Gic-Spurious.patch from the Mu-Silicium checkout (sheng uses the same one); during the 2026-11-07 build (built; independently re-run by the Verifier subagent on b1064eb8/e494c01b) it applied cleanly to the shared edk2 tree and rolled back cleanly.", "Format-2 migration: [firmware] points at the device Mu-Silicium checkout and proprietary-files.txt lists the required inputs; the vendor input set is recorded and hashed in proprietary-files.txt.", "board.toml wires [firmware] preflight and [bootimg] dtb = 'build/nuwa/sm8550-xiaomi-nuwa.dtb' (the dtb path is relative to the build tree; the base ctx.tree/dtb does not support a {uefi} template, and an FDF-embedded DTB does not automatically become the appended DTB). scripts/prepare-nuwa-firmware.py only copies the generated DTB and does not edit any node.", "Self-checked (2026-11-07, not independently verified: the Verifier subagent returned 'Country, region, or territory not supported' on both attempts): in the base checkout, ./unixnu defconfig nuwa_defconfig and ./unixnu tree -D ../nuwa/UniXNU-nuwa both exited 0 with the tree at UniXNU/out/nuwa/ios-16.7.16-20H392/nuwa/tree; in that tree, UNIXNU_UEFI=.../uefi-nuwa python3 scripts/prepare-nuwa-firmware.py exited 0 and cmp showed tree/build/nuwa/sm8550-xiaomi-nuwa.dtb byte-identical to the firmware repository FdtBlob/sm8550-xiaomi-nuwa.dtb; dtc -I dts -O dtb -i UniXNU-sm8550-common/dts nuwa.dts exited 0; and unixnu.devicetree.generate returned 12552 bytes containing the dram-base, dram-size, timebase-frequency, psci, cpu0 and cpu7 substrings (substring presence only; per-value CPU reg and GIC stride were not checked, so they stay unverified). This is a hardware-side resource-encoding check, not a complete ADT: chip_id and root_match_volume_uuid were still placeholders at that run (the later chip_id decision is recorded in the configuration area). No host-class evidence entry is added because it would require a command plus a full 40-character revision, and the device repository changes are uncommitted, so no revision is supplied rather than invented.", "MemoryMapLib reconciliation (static, 2026-11-07, docs/step5-firmware.md section 'MemoryMapLib reconciliation (static)'; static analysis, not verified on hardware): the static table has 41 entries, 27 inside DDR, while the live FDT has 35 fixed-reg reserved regions, 6 of them no-map regions the table does not describe. If RamManagerDxe pads uncovered System RAM gaps as Conventional, 16 fragments total about 10.80 GiB and a 1 GiB window first-fits in the 0x8c0000000 fragment inside the ADT dram-base. Do not shrink owned_memory_size: below about 925 MiB the window falls outside the ADT range, and any memory-number change needs user confirmation. The RAM Partition content is unknown.", "Reviewer verdict (2026-11-07, read-only static, docs/step5-firmware.md section 'First fastboot boot: Reviewer verdict and conditions'): window-allocation risk is Medium, APPROVE WITH CONDITIONS for the first fastboot boot only, and Deep Reviewer was not used because no candidate met docs/ai-orchestration-2026-11-06.md §2.3. The failure path writes no partition and prints NO WINDOW/FREE, the success path prints pa/va/entry/args/owned, and XNU's physical range comes from boot_args. Still open: the RamPartition protocol producer (RamManagerDxe is not in apriori, Depex = TRUE, runs at nuwa.fdf:87), SEC HOB write confirmation, a DEBUG build, fastboot boot only with user authorisation, the capture plan, and the FD/ramoops overlap confirmation.", "Collect the first firmware and boot observation, its cause when established, and the resulting implementation decision.", "board.toml [payload] size_mib is now 64 (was 192) so the payload FAT volume, which becomes the vendor_boot vendor ramdisk, fits the 96 MiB partition; the ADT identity values (product-id, artwork-device-subtype, compatible-device-fallback) are now carried as [os_overrides.\"ios-16.7.16-20H392\".adt.product] so the generated ADT sidecar matches the 20H392 donor DeviceTree; host-only, no device write.", "Next diagnostic candidate (2026-11-09, host-only, self-checked; Reviewer PASS WITH CONDITIONS supplied by parent): board.toml [payload] panic_screen=false, entry_probe_reset_delay=6, entry_probe_reset_after=_PE_create_console, entry_probe_reset_in=_arm_init, entry_probe_reset_occurrence=1, entry_probe_reset_before=false. The actual BL site is 0xfffffff007998b84; cave 0xfffffff0073ee620 lies in __TEXT_EXEC RX. _PE_create_console tail-calls initialize_screen, which can return. The six-second delay starts after the callee returns, not at boot or at the magenta bar. A probe reset proves only this callee returned, not that the following PE_init_printf ran; no reset is inconclusive (not reached, did not return, or probe/reset failure). The BCM2837 fixed panic-buffer access at 0x3c0fc000 in pexpert/arm/pe_init.c remains a risk and is not changed. No VM, memory-window, console implementation or base-source change, no device operation and no push; all area statuses remain planned. This finding supersedes historical claims that no reset necessarily means no return. New candidate not hardware-tested; independent verification pending."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The firmware build was independently re-run by the Verifier subagent on 2026-11-07 against device repository b1064eb8 and uefi-nuwa e494c01b: PASS (exit 0, 0x300000-byte FV).", "First hardware runs (2026-11-07, three fastboot boot runs, no partition written, read from phone-camera video, see docs/step5-firmware.md): the firmware starts, prints DXE logs and, since uefi-nuwa d7c97a7 (DXE Heap 0xBAB00000+0x0D1C0000), shows the UniXNU menu; Tools -> Advanced Logger exports a log as 24 OneSend QR frames that decode on the host (179 lines); RamManagerDxe maps the high 9 GiB and UniXNURamDiskDxe publishes an initrd block device. Stage 1 and the menu part of stage 2 are met. Stage 3 half met (2026-11-08): with a placeholder payload written to the unused slot's vendor_boot_b, the menu reported config EFI/UniXNU/unixnu.toml and listed the xnu entry (photo; see docs/step5-firmware.md); payload hashes, the ADT sidecar, DarwinBoot and the memory window are not yet exercised and need a real kernel.", "The Advanced Logger producer is wired (uefi-nuwa e494c01b2f679439fdaeaf2084b693c7220543f5) and the image builds, but runtime dispatch and the Tools -> Advanced Logger page are unverified, the 4 MiB reserved-page allocation's placement in the DXE heap is an assumption, and the boot-chain review concluded APPROVE WITH CONDITIONS on 2026-11-07, scoped to the first fastboot boot only (deep not used; no candidate met ai-orchestration §2.3).", "The memory ownership gate is open (owner of 0xbe000000-0xd4c00000, tail 0xafffff000-0xb00000000, internal reservations), so the XNU handoff stays withheld.", "The DTB has no splash_region and ABL consumption of the MemoryMapLib Display Reserved entry is unproven, so the splash reservation stays undecided; [bootimg] dtb remains unset, chip_id is decided (4acab8db) and root_match_volume_uuid waits for the userdata image.", "Window allocation is Medium risk, not High (static analysis, not verified on hardware): the RAM-partition protocol producer is unconfirmed, XNU's use of the ADT dram-base/dram-size is unconfirmed, and the first boot will show NO WINDOW/FREE lines without writing a partition if it fails. 6 live no-map regions are not in MemoryMapLib, and do not shrink owned_memory_size (below about 925 MiB a first-fit window falls outside the ADT range; memory-number changes need user confirmation)."]
next_action = ["Boot the image on hardware to verify Tools -> Advanced Logger and runtime dispatch; the boot-chain review concluded APPROVE WITH CONDITIONS on 2026-11-07, scoped to the first fastboot boot only, so it is not a release to boot (see docs/step5-firmware.md).", "Resolve the RAM Partition protocol producer (gEfiRamPartitionProtocolGuid) by binary reference-point analysis and the first DEBUG boot log; decide with the user whether to add the 6 live no-map regions to MemoryMapLib, and do not shrink owned_memory_size.", "First boot must use a DEBUG build and fastboot boot only (no partition write; user authorisation in that round), and SEC writing the entry parameters into the HOB (UniXNURamDiskDxe.c:215-233) must be confirmed first.", "The Verifier re-run passed on 2026-11-07 against device repository b1064eb8 and uefi-nuwa e494c01b; repeat it only if the firmware changes, and keep the recorded command and revisions with the result.", "Collect memory ownership evidence before the XNU handoff: the active owner of 0xbe000000-0xd4c00000, the 0xafffff000-0xb00000000 tail and the internal reservations.", "Wire bootimg.dtb and the ADT identity from the separate report, and inject a splash reservation only once ABL consumption is proven."]
evidence = [{ kind = "source", reference = "board.toml", result = "2026-11-09 post-map probe on 8a4063e51c437da62e031ea2a81d9e3d925988d9: original site 0xfffffff00796867c BL _ml_io_map_wcomb (0xfffffff0073f35b0), x0=0x3c0fc000 and x1=0x4000. Expected site B cave 0xfffffff0073ee620 encoding 0x17ea17e9; cave first BL callee encoding 0x940013e4, then CNTPCT wait 115200000 ticks (0x06ddd000) and x0=0x84000009 / SMC. It terminates without preserving return value or continuing to first LDR at 0xfffffff0079686a4. Positive only proves mapping returned; fixed PA access is not validated. User-reported console-before immediate reset and console-after no reset are observations, not a root-cause diagnosis. Firmware, PA, VM and memory window unchanged; no hardware run this round; self-checked only." }, { kind = "source", reference = "docs/step5-firmware.md", result = "Firmware input review plus build records: the DTB has no splash_region while live reports 0xb8000000/0x2b00000 and MemoryMapLib has Display Reserved; ABL consumption is unproven and bootimg.dtb stays unset; the ADT chip_id is decided (4acab8db) and root_match_volume_uuid waits for the userdata image; the firmware build was independently re-run by the Verifier subagent on 2026-11-07 against b1064eb8/e494c01b: PASS (0x300000-byte FV), and the firmware has since started on hardware without reaching the menu (three fastboot boot runs, header v1 never left the bootloader, header v4 reached DXE, PIL AUTO ABL panic fixed with a local uefipil.cfg, then ASSERT DxeMain.c(581) after AllocatePoolPages failures; see docs/step5-firmware.md), and the boot-chain review concluded APPROVE WITH CONDITIONS on 2026-11-07 scoped to the first fastboot boot only (deep not used)." }]

[[area]]
