configuration = ["2026-11-10 current candidate on 982e92e67c0e266987a786865f53e9cd120a159c plus this board/docs group: kernel_args=-v serial=3 sheng-platform-stage=5, panic_screen=true, entry_probe_reset_delay=0, old reset selectors removed. Existing ArmDTPlatform.cpp:191-208 resets immediately after registerService returns, not after six seconds; no sheng-platform-panic argument. Source prelink remains 55357440 B SHA256 da0d660f8336fa87825ec34ce1f48b653d728a6277aaf7d4b03784cf4f73c969; kernel/prelink not rebuilt. PAN and volatile fallback evidence is retained in docs/panic-fallback-host-20261110.md. Crypto correction: CONFIG_XNU_CRYPTO_BOOTSTRAP=prelinked, prng_random.o final -U XNU_SOURCE_CORECRYPTO14, no _source_corecrypto14_bootstrap in current prelink; console return does not imply a subsequent source-corecrypto EARLY_BOOT path. Mode unchanged.", "Single isolated ext4 assembly rc=0; parent-delivered independent Verifier incremental audit PASS, rc=0. Renderer 0xa0f bytes at 0xfffffff0073ee5c0, end 0xfffffff0073eefcf, unchanged boundary 0xfffffff0073eeff0, spare 0x21. Console site 0xfffffff0079993bc restored BL 0xfffffff007968f5c, no stage3/4 reset. Ordinary SP and common va_list* entries checked; manifests/hash/ramdisk/partition size match. Full evidence and local output paths: docs/stage5-panic-host-20261110.md. Previous measured candidate preserved (not rehashed by Verifier this pass). New candidate not device-tested. Historical findings/evidence below are dated snapshots, not current blockers or configuration."]
procedure = ["WSL Ubuntu-22.04, cwd /mnt/d/Code/PortingiOS/UniXNU: bash ../nuwa/UniXNU-nuwa/.cache/run-stage5-panic-host-20261110.sh; one payload/vendor_boot assembly, both rc=0, ext4 --out and existing --kernel. Exact expanded commands are in docs/stage5-panic-host-20261110.md and local assembly.log.", "bash ../nuwa/UniXNU-nuwa/.cache/run-stage5-panic-check-20261110.sh: final audit rc=0, self-checked; no kernel/prelink rebuild or device action. Reuse unchanged ADT/trust evidence. Verifier should rerun the read-only audit with a new output directory, record check and git diff --check, not the assembly driver."]
findings = ["Repo hygiene: removed the committed __pycache__ copies of the format-1 legacy tooling; no source behaviour changes.", "Format-2 migration: scripts/package.sh taken unmodified from the official template; patches/xnu/series created empty; package/ documents the empty device package.", "Kernel patch set (2026-11-08, host-only, self-checked): patches/xnu/series now lists the 17-entry minimal set for stage 5 and carries four local 8796 ports (8796-apple-only-cpu-tunables, 8796-non-apple-iommu-bootstrap, 8796-source-machine-layer, 8796-zzx-pmap-sync-64bit-pa); a static review found two build blockers in the first versions (a dropped ptep_get_iommu hunk, and a kpc source file that 8796 does not ship), fixed in r2. Update (2026-11-08, host build, self-checked): the series grew to 22 entries with six more local 8796 fixes found by real build rounds on the Linux toolchain: 8796-unifdef-headers (two headers the host unifdef 2.10 rejects), 8796-clang-var-init-flag (drops a legacy clang flag and silences new clang-24 warnings), 8796-indirection (os_get_pointee_type for the kalloc macros), 8796-kperf-kpc-off (guards kperf/kpc references because 8796 has no osfmk/arm64/kpc.c), 8796-uio-stackbuf (UIO_STACKBUF macro, 36 call sites). Update 2 (2026-11-08, host build, self-checked): the series is now 25 entries; the kernel compiles and links on the Linux toolchain, the archive steps (corecrypto-14 twice, ArmDTPlatform, ArmCpu) pass, and the final kernel is mach.development.bcm2837.unstripped (17281280 bytes, Mach-O arm64, bootstrap-pass link). Added since: 8796-iorpc-kernel-content (the host iig emits 10063-style code that uses IORPC.kernelContent, an additive member under KERNEL), 8796-kperf-kpc-link-guards (six undefined kperf/kpc symbols) and 8796-compile-records (10063's MakeInc.rule writes <obj>.o.json compile records with -MJ, 8796 does not, and the archive builders read them). The kernel archive list in board.toml is replaced with the four entries stage 5 uses (the arch list also names SoftwareAES, its AES bindings, mockfs and the source libpthread-519, whose pthread_callbacks_s layout does not match 8796), with CONFIG_XNU_NATIVE_AES=n and CONFIG_XNU_SOURCE_PTHREAD=n in nuwa_defconfig. The prelink step now runs and stops on the first ABI gap against the donor kernelcache: kernel target 0xfffffff00734c520 (_vfs_getvfs_with_vfsops) has no native address candidate; more gaps are likely. The IORPC patch and the other 8796 fixes are not reviewed beyond the first four ports. Update 3 (2026-11-08, host build, self-checked): the series is 26 entries; 8796-sparse-prelink-index.patch is the XnuPrelink kit patch xnu-10063.141.1-sparse-index.patch converted to LF (the kit patches are checked out with CRLF line endings, which is why git apply failed on them), touching only osfmk/kern/kalloc.c kalloc_type_view_parse (an early-boot allocator path; not reviewed). The full build applied all 26 patches and linked a 17315480-byte kernel. board.toml now drops com.apple.filesystems.apfs (it references _vfs_getvfs_with_vfsops, absent from open-source 8796; the 10063 definition is a short mount-list lookup) and com.apple.kec.Libm (a literal pool the planner reads as code) from [kernel.prelink] roots, 29 of 31 roots remain, and the planner then passes. Prelink now stops later, in emit_prelink.py instruction_inventory: External PC-relative encoding at 0xfffffff005b8c1cc (a kext in the remaining roots, not yet identified). The security-init kit patch (needed once early_security_init is set) also applies to 8796 after the same LF conversion. No prelinked kernel exists yet.", "Collect the first image assembly observation, its cause when established, and the resulting implementation decision.", "Payload built host-only (self-checked): ./unixnu build payload -D ../nuwa/UniXNU-nuwa --trust-cache out/ipsw/20H392/087-86698-044.dmg.trustcache (no --data-ramdisk) exited 0; payload.img 67,108,864 bytes (64 MiB), sha256 7bbffac545106c8710108737a61af3d15a0f86a5534cbc4d3bae9ee6aac958da. FAT16 volume NUWAESP carries EFI/UniXNU/unixnu.toml (402 B) and Payloads/{kernel.macho 55,357,440 B sha256 274b5033..., kernel.macho.adt 13,132 B sha256 b7ac4b9c..., kernel.macho.trustcache 66,289 B}; the ADT sidecar carries product-id/artwork-device-subtype/compatible-device-fallback, chip-id 4acab8db and the unique-chip-id seed (from the git-ignored unixnu.local.toml).", "vendor_boot repacked host-only (self-checked): ./unixnu vendor_boot --stock UniXNU-nuwa/.cache/stock/vendor_boot_b.img --ramdisk payload.img -o out/nuwa/ios-16.7.16-20H392/nuwa/vendor_boot/vendor_boot.img exited 0; 100,663,296 bytes (96 MiB = partition), sha256 a6d2cc58beac8d89b9b9fd46e8de409374073899ae72440be6df32907717164f, vendor ramdisk 67,108,864 bytes at the stock address 0x01000000. The >15 MiB --ramdisk-addr relocation (docs/zh/guide/boot.md) is left at stock: the nuwa ABL relocates the initrd to the Kernel region (~0xB7xxxxxx per docs/step5-firmware.md) and no safe relocation address is established, so it stays a pending user decision before the first device boot.", "Trust cache repack (2026-11-09, host-only, self-checked): the first payload's kernel.macho.trustcache was the raw StaticTrustCache IM4P (66,289 B, DER 0x30 0x82, sha256 63e01c03…) copied verbatim by 'build payload --trust-cache <im4p>'; ValidTrustCaches rejects it (its u32 Count reads 0x02018230 > 128), returning EFI_COMPROMISED_DATA when the xnu menu entry was selected on hardware. Re-bundling the same donor module with scripts/bundle-ipsw-trust.py yields a valid bundle (66,272 B, Count=1, offset 8, version-2 module, 2760 entries, sha256 367e0515…) that passes the loader-equivalent structural check; 'build payload --trust-cache <bundle>' then 'vendor_boot' repack succeed, and the rebuilt payload.img (sha256 b0c808c2…) / vendor_boot.img (sha256 fef65a4f…) carry the bundle.", "Entry-probe payload build (2026-11-09, host-only, self-checked): ./unixnu build payload -D ../nuwa/UniXNU-nuwa --uefi ../nuwa/uefi-nuwa --trust-cache out/ipsw/20H392/087-86698-044.dmg.trustcache.bundle exited 0; kernel.macho copy patched 274b5033... -> 63b6ff91... (entry 0xfffffff0073ee488 b start_first_cpu -> b cave1; MMU-enable 0xfffffff0073f0350 msr sctlr_el1,x0 -> b cave2; _panic 0xfffffff00798d088 -> b panic_screen; _panic_trap_to_debugger 0xfffffff00726c174 -> b panic_screen_common); payload.img 67108864 B (64 MiB < 96 MiB partition) sha256 c59bc2bc02d58b3877e38d4af4d9f3ee1c44457ced1d09252d1fee9f8982fc98; ./unixnu vendor_boot --stock .cache/stock/vendor_boot_b.img --ramdisk payload.img exited 0, vendor_boot.img 100663296 B sha256 d3dc18f359a99373fa57d80b482138cf4834a51b5f71324f8ef50b999a61eb18; ADT sha256 varies per build (devicetree.generate writes os.urandom(256) random-seed).", "Stage 4 hardware observation (2026-11-09, parent session, device): DarwinBoot validation passed and handed off to the kernel entry (entry words 0x140006f5 = b start_first_cpu); the screen then stays on the green handoff bar with no kernel output. Read-out: graphics mode (boot_args.Video[1] v_display = 1, hardcoded BootVideo.h:31) suppresses early printf, so no text does not prove a hang; -v is not parsed by iOS arm64 xnu; the boot_args CommandLine ABI size mismatch (608-byte Darwin 22 vs 1024-byte Darwin 23) is a known item. The entry-probe payload (blue/magenta bars) is the next observation step.", "Entry probe payload (2026-11-09, host build, self-checked): ./unixnu build payload -D ../nuwa/UniXNU-nuwa --uefi ../nuwa/uefi-nuwa --trust-cache out/ipsw/20H392/087-86698-044.dmg.trustcache.bundle (exit 0) patches a copy of kernel.macho with scripts/patch-xnu-entry-probe.py --reset-delay 6 (no --panic-screen): stage 1 blue bar at the MMU-off entry, stage 2 magenta bar just before msr SCTLR_EL1, stage 3 busy-waits 0x06DDD000 = 115200000 ticks (19.2 MHz x 6 s) on CNTPCT_EL0 then x0 = 0x84000009 / smc #0. Disassembly verified the three branch-to-cave sites and that _panic/_panic_trap_to_debugger are not redirected; panic_screen stays false because panic-screen + stage 3 overflow the padding past PANIC_CAVE_END by 95 B (see the configuration area). payload.img 67108864 B sha256 dd54e153aa2c5a779d4d260493c0561c4c249fc80c3374781444f3714824060d (payload_kernel_sha256 e4b2f2d2f8fe357c18b616a4bb3253318d18fa4e95afc05d1fef3238406559ee vs kernel_sha256 274b50330e8d945480eff24e759fbe3b64d2329c002d78d29b405ad156aac3f0); ./unixnu vendor_boot --stock ../nuwa/UniXNU-nuwa/.cache/stock/vendor_boot_b.img --ramdisk <payload> -o <vendor_boot> (exit 0) vendor_boot.img 100663296 B sha256 7e6e519263323356de5e237cd7681c3233ae4ddad1b3544a597f93bc0f8502d5 (ramdisk 67108864 B at 0x1000, address 0x1000000). Both under the 96 MiB vendor_boot partition.", "Entry-probe stage-4 bisect payload (2026-11-09, host build, self-checked): ./unixnu build payload -D ../nuwa/UniXNU-nuwa --uefi ../nuwa/uefi-nuwa --trust-cache out/ipsw/20H392/087-86698-044.dmg.trustcache.bundle (exit 0) patches a copy of kernel.macho with scripts/patch-xnu-entry-probe.py --reset-delay 6 --reset-after _ml_parse_cpu_topology --in _arm_init --occurrence 1; the bl at 0xfffffff007998914 is rewritten to b 0xfffffff0073ee620 (cave 4), whose code re-runs bl _ml_parse_cpu_topology, busy-waits 0x06DDD000 = 115200000 ticks (19.2 MHz x 6 s) on CNTPCT_EL0 then x0 = 0x84000009 / smc #0 followed by a wfe loop. payload.img 67108864 B (64 MiB < 96 MiB) sha256 e4cb58c429b90cf678222c37c8468820094225b805fcdfb541f12306aa9fd24b (payload_kernel_sha256 18d7668ec271babff0e3a7832523551bbac96d454101a35fa30c72955627b8c4 vs kernel_sha256 274b50330e8d945480eff24e759fbe3b64d2329c002d78d29b405ad156aac3f0); FAT16 NUWAESP Payloads/{kernel.macho 55357440 B, kernel.macho.adt 13132 B sha256 5066738a..., kernel.macho.trustcache 66272 B sha256 367e0515... bundle Count=1 version-2}; ./unixnu vendor_boot --stock ../nuwa/UniXNU-nuwa/.cache/stock/vendor_boot_b.img --ramdisk <payload> -o <vendor_boot> (exit 0) vendor_boot.img 100663296 B sha256 81580c186275bc0e87d17a97ddb3565407093344d13155a3b415d1859a99f298 (ramdisk 67108864 B at 0x1000, address 0x1000000); vendor_boot ramdisk region sha256 == payload.img sha256. ADT sha256 varies per build (devicetree.generate writes os.urandom(256) random-seed).", "Stage-4 next probe (2026-11-09, host-only candidate, self-checked): user-reported hardware reset after about 6 s with revision 07e176761020d3d7f01fb086d9a89af3e3531eb9 proves _ml_parse_cpu_topology returned. board.toml now selects _arm_vm_init in _arm_init, occurrence 1, delay 6, panic_screen=false; reset means arm_vm_init returned, no reset is inconclusive (not reached, did not return, or probe/reset failure). Cave 4 at 0xfffffff0073ee620 is inside kernel __TEXT_EXEC; patch-xnu-entry-probe.py:97-118 uses PC-relative BL/literal load, a 115200000-tick constant, register-only CNTPCT_EL0/PSCI SMC. xnu-8796.141.3 osfmk/arm64/arm_vm_init.c:1998 obtains the KVA segment, :1413 maps the full __TEXT_EXEC ROX, :2097 calls arm_vm_prot_init, and :2144-2156 switches tables and invalidates the bootstrap identity map. Identity-map removal alone therefore does not invalidate the cave; actual post-return execution remains untested. Existing payload/vendor_boot image and JSON .v5 backups were retained without overwrite. Both build commands in the packaging procedure exited 0; the payload is 64 MiB <96 MiB, while stock-padded vendor_boot is exactly 96 MiB, NOT strictly smaller. No device action or push. Final audit exited 0: call 0xfffffff007998a3c -> cave 0xfffffff0073ee620 -> BL _arm_vm_init; CNTPCT loop, literal 115200000, PSCI 0x84000009 / smc #0; blue/magenta sites retained, 0xfffffff0073f0370 and both panic entries unchanged. FAT32 (not the older record's FAT16) contains kernel 55357440 B, ADT 13132 B, trustcache bundle 66272 B (Count=1, offset=8, version=2, entries=2760). Payload SHA256 5253c193a39daf2e663fd98496299894bbfa7d6f7ba0c98c14c5b625d2a922df; stock-padded vendor_boot SHA256 4f741c558ccd80211db6bca6cd8098d9efe825a3409902b775369a01788c65b1. Vend