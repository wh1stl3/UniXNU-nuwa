schema_version = 1

[device]
name = "nuwa"
soc = "SM8550"
os_profile = "ios-16.7.16-20H392"
summary = "Xiaomi 13 Pro (SM8550) iOS 16.7.16 bring-up. Format 2 migration started 2026-11-06: device repo + UniXNU-sm8550-common + uefi-nuwa. Every area is planned until hardware evidence is recorded."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "patches/xnu/series", ".github/**", ".gitignore", "local.toml.example", "scripts/__pycache__/**", "scripts/**/__pycache__/**"]
inputs = ["SM8550 common repository commit (pinned in feeds.toml).", "The iOS 16.7.16-20H392 OS profile at UniXNU/profiles/os/ios-16.7.16-20H392, authored locally in UniXNU commit 693f5d9cae8a408dd18b39f3f9fdc4228c934241; the official profiles/os tree ships iPadOS 17.7.11, iPadOS 26.5.2 and iOS/iPadOS 27.0.1 only.", "The donor KernelCache member hash for [ipsw.sha256]; the profile already carries the IPSW url, chip_id, board_id and the DeviceTree plus StaticTrustCache member hashes read from the donor BuildManifest."]
configuration = ["board.toml schema_version = 2 with [board], [components], [kernel], [device_tree], [firmware], [payload], [payload.adt], [package].", "feeds.toml pins UniXNU-sm8550-common at a9f45dc60c035084b95463781538380f4c3606c9.", "dts/nuwa.dts includes soc:dts sm8550.dtsi and carries the measured DRAM span only.", "board.toml [ipsw] declares product, version, build, device_class and fetch only; url, chip_id, board_id and the member hashes are inherited from the selected profile instead of being duplicated.", "[payload] tools = true adds the Tools entry to the generated payload boot menu."]
procedure = ["./unixnu defconfig nuwa_defconfig -D ../UniXNU-nuwa", "./unixnu fetch -D ../UniXNU-nuwa", "./unixnu status --json -D ../UniXNU-nuwa", "./unixnu tree -D ../UniXNU-nuwa"]
findings = ["The local iOS 16 OS profile lives at UniXNU/profiles/os/ios-16.7.16-20H392 (UniXNU commit 693f5d9cae8a408dd18b39f3f9fdc4228c934241): xnu 8796.141.3 (1b191cb58250d0705d8a51287127505aa4bc0789), the donor IPSW url/product/build/device_class (d22ap, chip 0x8015, board_id 6), the DeviceTree and StaticTrustCache sha256 pins, ADT identity D22AP, kernelcache sha256 and the 31 prelink roots verified against the donor __PRELINK_INFO; board.os_profile and [device].os_profile select it.", "board.toml sets [firmware] preflight and [bootimg] dtb = 'build/nuwa/sm8550-xiaomi-nuwa.dtb'; the dtb path is relative to the build tree, the base ctx.tree/dtb does not expand a {uefi} template, and an FDF-embedded DTB does not automatically become the appended DTB.", "Official step 4 is complete: defconfig, fetch, status --json and tree resolve the board against that profile, and the fetch is recorded on 279c990a0c7a238aa0a5818493c6cd6a46528749 (unixnu.lock: xnu 1b191cb5, sm8550 a9f45dc6, edk2 cfb93724, libplatform a00a4cc3, libdispatch 30fe6a7d, libpthread c0e60fb5, AvailabilityVersions 933f9360, corecrypto-2023 11fba65b, IOStorageFamily e45fbe30). Step 5 (hardware description and firmware) is in progress.", "The official profiles/os tree ships iPadOS 17.7.11, iPadOS 26.5.2 and iOS/iPadOS 27.0.1 only, which is why this profile is authored locally; profile selection is no longer blocked.", "board.toml [payload] tools = true adds the Tools entry (id = tools, action = tools) to the generated EFI/UniXNU/unixnu.toml, so the exported firmware log can be read from the boot menu; the entry has not been exercised on hardware.", "dts/nuwa.dts comment corrected (comment-only): scripts/unixnu/devicetree.py takes exactly one /memory node with one contiguous reg range, so the previous nine-segment TODO was wrong; the 0x8c0000000/0x240000000 geometry and the owned-window contract are unchanged (docs/step5-firmware.md).", "Repo hygiene: removed the committed __pycache__ copies of the format-1 legacy tooling; no source behaviour changes.", "Repo hygiene: the committed __pycache__ blobs were untracked and are ignored; scripts/ keep format-1 legacy tooling that still points at deleted absolute paths and is not part of the official flow.", "The SM8550 shared series targets XNU 10063/12377, so soc:patches/xnu/series is deliberately not selected for the 8796 line."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The donor KernelCache member hash (kernelcache.release.iphone10b) is not pinned in [ipsw.sha256] yet; the OS and Cryptex1,SystemOS member hashes are taken at the userdata stage.", "No board DTS register set for storage, display, input, GPU, network, audio and power yet, so those components stay unselected."]
next_action = ["Official step 5: finish the uefi-nuwa firmware integration (UniXNU, UniXNUDxe, DarwinBoot, RamDisk, DiskIo and FAT modules plus the Advanced Logger export) and reconcile the board DTS with the firmware DTB before selecting step 6 drivers."]
evidence = [{ kind = "source", reference = "board.toml", result = "board.os_profile = ios-16.7.16-20H392 resolves to the profile at UniXNU commit 693f5d9cae8a408dd18b39f3f9fdc4228c934241, which carries the IPSW url, chip_id 0x8015, board_id 6 and the DeviceTree/StaticTrustCache sha256 pins; [payload] enables the Tools entry." }]

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["proprietary-files.txt", "board.toml", "dts/**", "scripts/check-nuwa*.py", "scripts/prepare-nuwa-firmware.py"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for firmware and boot."]
procedure = ["Follow the firmware and boot stage in the porting guide and record the actual commands."]
findings = ["Reviewed firmware facts (2026-11-07, docs/step5-firmware.md): the firmware DTB carries no splash_region node, while the live machine reports 0xb8000000 with size 0x2b00000 and MemoryMapLib already describes a Display Reserved region. Whether ABL consumes that reservation is unproven, so nothing is injected into the DTB by this review; the firmware repository carries a separate uncommitted DSC/FDF integration candidate.", "bootimg.dtb wiring and the [payload.adt] chip_id / root_match_volume_uuid values are deferred to a separate report and stay unset.", "Step 5 firmware integration is in progress in uefi-nuwa (nuwaPkg DSC/FDF UniXNU, UniXNUDxe, DarwinBoot, RamDisk, DiskIo and FAT modules plus the firmware log export); this round records the intent only, no firmware build has run and no completion or build success is claimed. The uefi-nuwa commit and build log will be supplied by the main agent and recorded then.", "[firmware] patches now wire Resources/MuPatches/Gic-Spurious.patch from the Mu-Silicium checkout (sheng uses the same one); it must be re-checked against the shared edk2 tree at the first firmware build.", "Format-2 migration: [firmware] points at the device Mu-Silicium checkout and proprietary-files.txt lists the required inputs; no vendor input is recorded or hashed yet.", "board.toml wires [firmware] preflight and [bootimg] dtb = 'build/nuwa/sm8550-xiaomi-nuwa.dtb' (the dtb path is relative to the build tree; the base ctx.tree/dtb does not support a {uefi} template, and an FDF-embedded DTB does not automatically become the appended DTB). scripts/prepare-nuwa-firmware.py only copies the generated DTB and does not edit any node.", "Self-checked (2026-11-07, not independently verified: the Verifier subagent returned 'Country, region, or territory not supported' on both attempts): in the base checkout, ./unixnu defconfig nuwa_defconfig and ./unixnu tree -D ../nuwa/UniXNU-nuwa both exited 0 with the tree at UniXNU/out/nuwa/ios-16.7.16-20H392/nuwa/tree; in that tree, UNIXNU_UEFI=.../uefi-nuwa python3 scripts/prepare-nuwa-firmware.py exited 0 and cmp showed tree/build/nuwa/sm8550-xiaomi-nuwa.dtb byte-identical to the firmware repository FdtBlob/sm8550-xiaomi-nuwa.dtb; dtc -I dts -O dtb -i UniXNU-sm8550-common/dts nuwa.dts exited 0; and unixnu.devicetree.generate returned 12552 bytes containing the dram-base, dram-size, timebase-frequency, psci, cpu0 and cpu7 substrings (substring presence only; per-value CPU reg and GIC stride were not checked, so they stay unverified). This is a hardware-side resource-encoding check, not a complete ADT: chip_id and root_match_volume_uuid are still placeholders. No host-class evidence entry is added because it would require a command plus a full 40-character revision, and the device repository changes are uncommitted, so no revision is supplied rather than invented.", "Collect the first firmware and boot observation, its cause when established, and the resulting implementation decision."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Firmware build and boot are not verified: the nuwaPkg module integration is in progress in uefi-nuwa and no commit or log evidence exists for it here yet.", "The DTB has no splash_region and ABL consumption of the MemoryMapLib Display Reserved entry is unproven, so the splash reservation stays undecided; [bootimg] dtb and the ADT identity values are still unset."]
next_action = ["Wait for the uefi-nuwa firmware integration commit and build log from the main agent, then record the command, result and full revision in this area; wire bootimg.dtb and the ADT identity from the separate report, and inject a splash reservation only once ABL consumption is proven."]
evidence = [{ kind = "source", reference = "docs/step5-firmware.md", result = "Firmware input review: the DTB has no splash_region while live reports 0xb8000000/0x2b00000 and MemoryMapLib has Display Reserved; ABL consumption is unproven, bootimg.dtb and the ADT identity stay unset, and no firmware build is claimed." }]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = ["Reviewed CPU facts (2026-11-07, docs/step5-firmware.md): the live MPIDR Affinity1 values 0x000..0x700 for the eight cores and the 3x A510, 2x A715, 2x A710 and 1x X3 cluster mix agree with the board tree, and [payload.adt] cpu_regs = 0,256,512,768,1024,1280,1536,1792 already encodes that numbering.", "Reviewed GIC facts: GICD 0x17100000 + 0x10000 and GICR 0x17180000 + 0x200000 with an 0x40000 stride match the live machine; the 3-cell versus 4-cell interrupt encoding difference is legal because ArmCpu mapGic does not read interrupt-cells, so addresses and encoding stay unchanged.", "Reviewed timer facts: the live PPI set 13,14,11,12 differs from the DTB's 13,14,11,10 only in the fourth entry, which is an EL2 interrupt. The current path is EL1 only and CNTV_CTL (INTID 27, PPI 11) does not consume that entry, so the IRQ table is unchanged; the 19.2 MHz reference comes from a live property, not a CNTFRQ read-back.", "Collect the first cpu and interrupts observation, its cause when established, and the resulting implementation decision."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The reviewed differences are inert only on the EL1-only path; nothing in this area has run on hardware, so the CPU and interrupt records remain source-level.", "Hardware inputs and implementation are pending for nuwa."]
next_action = ["Keep the DTB PPI set and [payload.adt] cpu_regs as recorded, and validate the EL1-only timer path on hardware once a firmware build exists."]
evidence = [{ kind = "source", reference = "docs/step5-firmware.md", result = "CPU, GIC and timer review: MPIDR 0x000..0x700 and the cluster mix agree; GICD/GICR addresses and 0x40000 stride agree with a legal cell-count difference; the fourth live PPI is EL2-only and unused, so no IRQ change." }]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["Reviewed memory facts (2026-11-07, docs/step5-firmware.md): the board DTS geometry 0x8c0000000 + 0x240000000 (9 GiB) is supported by the live high-end pair of adjacent ranges, but the last 4 KiB (0xafffff000-0xb00000000) and the internal/dynamic reservations inside the range are still open.", "Reviewed memory facts: the current FD window 0xa7100000-0xa7400000 lies inside the historical ramoops 0xa7000000-0xa7400000, and the DXE heap 0xbae00000-0xbf300000 intersects the historical iomem reserved range 0xbe000000-0xd4c00000 whose active owner is unknown. board.toml address, size and verified values stay unchanged; neither permanent Linux reserved ownership nor a full SystemRAM release is inferred.", "The delivered conventional window comes from RAM Partition -> HOB/EFI map -> DarwinBoot conventional allocation, not from an automatic ADT subtraction of reserved ranges; the XNU handoff stays withheld until the reservation owner question closes.", "scripts/unixnu/devicetree.py accepts exactly one /memory node with one contiguous reg range, so the nine-segment TODO in dts/nuwa.dts was corrected as a comment-only change; the geometry and the owned-window contract are unchanged.", "Collect the first memory and dma observation, its cause when established, and the resulting implementation decision."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["XNU handoff is withheld: the tail 4 KiB and the internal/dynamic reservations of the 9 GiB range are unclosed, and the owner of the 0xbe000000-0xd4c00000 reserved range that the DXE heap intersects is unknown.", "No board DTS register set for DMA, storage, display, input and power yet, so those components stay unselected."]
next_action = ["Close the High-memory gate: identify the active owner of the historical 0xbe000000-0xd4c00000 reserved range (DXE heap 0xbae00000-0xbf300000), account for the 0xafffff000-0xb00000000 tail and the internal reservations, then re-check the FD/ramoops overlap before allowing the XNU handoff."]
evidence = [{ kind = "source", reference = "docs/step5-firmware.md", result = "Memory High-gate review: the 9 GiB geometry is supported by the live high ranges, the tail 4 KiB and internal reservations are open, the FD/ramoops and DXE-heap/reserved overlaps are unresolved, and the delivered window is a DarwinBoot conventional allocation rather than an ADT subtraction." }]

