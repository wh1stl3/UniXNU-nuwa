[[area]]
id = "diagnostics"
status = "planned"
components = []
paths = ["scripts/check-*", "scripts/probe-*", "scripts/audit-*", "scripts/read-*", "scripts/prepare-*", "scripts/test-*", "scripts/research-*", "scripts/discover-*", "scripts/generate-r35b-exit-detail.py", "scripts/generate-r35g-ux-exception.py", "scripts/generate-r35h-layout.py", "scripts/generate-r35j-ux-lr.py", "scripts/generate-r35l-ux-regs.py", "scripts/build-r35b-kernel.py", "scripts/build-ufs-apfs-root-chmh-r35b.py", "scripts/data/**", "package/diagnostics/**", "package/boot-progress*/**", "package/tests/**", "package/*Tests*", "package/*Diagnostic*", "package/*Probe*", "package/Boot*", "package/linux-log/**", "unixnu.lock"]
inputs = ["Identify the diagnostics hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for diagnostics."]
procedure = ["Follow the diagnostics stage in the porting guide and record the actual commands."]
findings = ["2026-11-27 package/nuwa-sb0-input/Probe.c is the standalone no-storage r4 input probe owned by the firmware area; the diagnostics package/*Probe* pattern also matches it, and this line records the shared ownership without changing diagnostics behavior. See docs/nuwa-sb0-r4-input-20261126.md.", "2026-11-22 parent-reported SystemGroup seed boot: mobileactivationd crashes=0 at 414s and 754s; SpringBoard scanout remains stalled; MCM claim, migration and authentication unproven; see docs/nuwa-systemgroup-fix-result-20261122.md (self-checked record).", "2026-11-22 parent-reported six-process census and repeated mobileactivationd crashes; host static analysis identifies migration-failure candidate, full PC and causality unproven; see docs/nuwa-mobileactivation-migration-20261122.md (self-checked record).", "2026-11-22 XR PC widened to low 32 bits; one newest-inserted entry fits, host self-checked, width and truncation review pending; see docs/nuwa-handoff-xr-20261122.md.", "2026-11-22 XR displays exit-ring PC separately; host self-checked, review pending; see docs/nuwa-handoff-xr-20261122.md.", "2026-11-21 r35h host-only PID-aware exit layout and package self-checked; deep review and independent verification pending; see docs/nuwa-r35h-layout-20261121.md.", "2026-11-21 r35f first boot: user video and vision transcription show diagnostic refresh and userspace expansion; two SIGHUP records and no SIGTRAP in sampled frames; see docs/nuwa-r35f-first-boot-20261121-observation.md.", "2026-11-20 compact r35b strips debug information while preserving the exit predicate, non-STAB symbols and prelink bindings; the corrected 8 MiB FAT floor is unchanged. See docs/nuwa-r35b-compact-20261120-observation.md for self-checks and release gates.", "2026-11-20 r35b host-only packaging and separate audit self-checked; CHMH rebound to new kernel, authentication NOT REACHED, deep review and independent verifier pending; see docs/nuwa-r35b-packaging-20261120.md.", "2026-11-20 r35b isolated kernel built and audited host-only; fixed r35 packaging rejects the new kernel, so no package or device action; see docs/nuwa-r35-exit-selection-20261120.md.", "2026-11-20 host-only r35 exit selection generator filters on signal or reason namespace; real-function replay covers ordinary exit(1), four slots and row width. Signal storms and lock drops remain possible; no kernel build or device run. See docs/nuwa-r35-exit-selection-20261120.md.", "2026-11-19 the diagnostic page now carries the user-exit record, which is what the last rounds read. r30 added the reboot howto word, the three keybag directories after the Data mount and the bsd_init-to-keybagd time; r32 added the AppleKeyStore selector ring on row 10 and lost it to the panic screen clear; r33 moved the ring to row 6 next to a 20-character stage label; r35 (built, not flashed) keeps the last four abnormal user exits as EX1..EX4 <comm6> <sig>:<ns>:<code> in row 0 and prints pid/status/os_reason namespace and code/nprocs plus the AKS call and open counters to the console, which is the reading the SpringBoard and mobileactivationd SIGTRAPs need. Every value is a kernel global read by the renderer because this board does not capture the console; the terminal and the serial console are not available on the device path.", "2026-11-18 the page became the primary instrument and moved into a panic-safe band. r20 added namei() tracing under /System/Library/Caches and the SYSOS amfi/cs fields; r21 stopped the 15 s full repaint and the 1 Hz refresh once panic text or a debugger entry exists, deduplicated bind so boot no longer clears the screen twice, and moved title, counters, UFS, PID1+SYSOS, stage, TCR, last IRQ and the DATA summary into rows 0-8 (the panic screen clears from y=h/8), with an optional glyph self-test pattern below the page for the missing thin strokes. package/boot-progress and the r12/r13 forks are tracked with their SOURCE notes. The page still draws straight from vinfo: there is no GopFramebuffer and no launchd display service, so this is a bring-up instrument, not a display path.", "2026-11-15 observation markers (temporary, host only): the opt-in XNU_NUWA_OBSERVE build in out/nuwa-observe-20261115-r1 paints cyan band 3 from __mac_execve when process_signature returned 0 for initproc and orange band 15 at the first unix_syscall() entry with proc == initproc; bounded stores into vinfo.v_baseaddr only (no lock, allocation, sleep or call-out), idempotent per band, bands chosen so they never overlap the loader text block or the panic screen clear. Build/selfcheck are host-side; the two patches (8796-nuwa-observe-markers.patch, 8796-nuwa-observe-log.patch) stay untracked until the observation round is cleaned up.", "unixnu.lock committed from the first complete fetch of the iOS 16 profile: xnu 1b191cb5 (8796.141.3), sm8550 a9f45dc6, edk2 cfb93724, libplatform a00a4cc3, libdispatch 30fe6a7d, libpthread c0e60fb5, AvailabilityVersions 933f9360, corecrypto-2023 11fba65b, IOStorageFamily e45fbe30.", "The Tools entry is enabled in the payload configuration ([payload] tools = true in board.toml); the firmware log exporter now has a producer (Advanced Logger wired in uefi-nuwa e494c01b2f679439fdaeaf2084b693c7220543f5, built; independently re-run by the Verifier subagent on b1064eb8/e494c01b), but the Tools -> Advanced Logger page and its runtime dispatch are unverified and the entry has not been exercised on hardware.", "Step 5 platform facts are recorded in docs/step5-firmware.md with provenance only: the backups MANIFEST is read before any other file, then recovery-cpu-20261021T005937467055Z/{running-fdt.dts,iomem.txt,cpuinfo.txt}, legacy-nuwa-artifacts/platform-inputs/20261020T124109389461Z/nuwa-platform-observed.json and memory-layout/nuwa-layout-tmlq93uo/report.json. No raw dump, device identifier, serial or seed is copied, and the archives were not re-scanned this round.", "This review ran no host command and touched no device, so it adds no host or device evidence; the report is a source-level record of an independent review (UniXNU 693f5d9cae8a408dd18b39f3f9fdc4228c934241, device 279c990a0c7a238aa0a5818493c6cd6a46528749, SoC a9f45dc60c035084b95463781538380f4c3606c9, uefi-nuwa 322d742fd87d370aac96bb394d1feac61beb9b3a).", "Recovery reader confirmed read-only on 2026-11-07 (docs/device-evidence-2026-11-07.md): a TWRP 3.7.1_12 recovery with a root adb shell provides adb, dd, cat of /proc and /sys, dmesg and blockdev --get*, so a recovery+adb log reader is available in practice; the only tooling gap seen was sgdisk -p, which that image does not support. The capture wrote no partition and ran no fastboot command.", "pstore backend observed: /dev/pmsg0 exists while /sys/fs/pstore is empty, so the Android kernel has a ramoops backend; whether ramoops contents survive a warm reboot was not tested, and the ramoops address range is the one whose overlap with the FD window is recorded in the memory area as an observation only.", "Collect the first diagnostics observation, its cause when established, and the resulting implementation decision.", "2026-11-09, user-reported hardware evidence relayed by the parent session: the six-second _arm_vm_init post-return probe at device revision 2d55e2a8d223f558f01c948db45db3c71f747c96 reset on hardware. This establishes that callee returned; it does not establish that subsequent code must hang. The implementer ran no device command this round. Next diagnostic candidate (2026-11-09, host-only, self-checked; Reviewer PASS WITH CONDITIONS supplied by parent): board.toml [payload] panic_screen=false, entry_probe_reset_delay=6, entry_probe_reset_after=_PE_create_console, entry_probe_reset_in=_arm_init, entry_probe_reset_occurrence=1, entry_probe_reset_before=false. The actual BL site is 0xfffffff007998b84; cave 0xfffffff0073ee620 lies in __TEXT_EXEC RX. _PE_create_console tail-calls initialize_screen, which can return. The six-second delay starts after the callee returns, not at boot or at the magenta bar. A probe reset proves only this callee returned, not that the following PE_init_printf ran; no reset is inconclusive (not reached, did not return, or probe/reset failure). The BCM2837 fixed panic-buffer access at 0x3c0fc000 in pexpert/arm/pe_init.c remains a risk and is not changed. No VM, memory-window, console implementation or base-source change, no device operation and no push; all area statuses remain planned. This finding supersedes historical claims that no reset necessarily means no return. New candidate not hardware-tested; independent verification pending.", "2026-11-11 device checkpoint (parent-delivered review; no device command rerun for this records update): the frozen pmap-ret-stop-20261111-r1 candidate was accepted on the host (outer static review PASS WITH CONDITIONS, independent verifier PASS, range static PASS) and, under explicit round authorization, scripts/run-pmap-ret-once.py ran one three-phase attempt (run pmap-ret-20261111-r4). Stage 2 command review PASS: the A-to-B switch read back B and the single fastboot boot of the fixed r4 loader exited 0. Stage 3 review PASS after an independent recomputation of the host readback: the device switched back to A and read back A, Android reported boot_completed=1/_a/uid0, vendor_boot_b was restored to this round stock backup 100663296 B SHA256 493ca426964adabb195a00ded4ff49793bc7efd5d7bea2a567bcfd0c970a8dad with the whole-partition hash equal to restore-readback.img, the r4 staging files were removed, and the stock backup and evidence were retained. The user reports the on-screen line DIAG: PMAP initializer normal epilogue reached; STOP; no recording file exists for independent visual confirmation, so this does not prove the original RET executed and is not authentication, stage5 or launchd evidence. Diagnostics status remains planned."]
