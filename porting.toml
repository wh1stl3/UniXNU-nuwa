  "2026-11-25 host-only PIX candidate separates successful clears and CPU copies, and reports bounded center-source RGB CRC, nonblack and unique color statistics. See docs/nuwa-pixsig-20261125.md.",
  "2026-11-25 host-only initproc thread-name stage channel is gated on the exact nuwa-init=display-client value. The PIX args and seed are retained, so the package is dormant and does not deploy the client. See docs/nuwa-stage-channel-20261125.md.",
