  { kind = "host", reference = "docs/nuwa-platform-power-kernel-20261113.md", revision = "029a79bb58a403c0f3441ed991ad312ae1102c39", command = "/home/wh1stl3/.local/bin/python3.11 -B out/nuwa-platform-power-kernel-20261113-r1/startup-audit.py", result = "self-checked; uncommitted changes on the stated revision; final exit 0, startup-audit.json SHA256 98cdad82d0f6a38869e09ee0fd23afa1cb5cc6dc1f8577b0b23e927c6fb1a5d0. Finding: r2 mode2 requires getPlatform at package/NuwaPlatformPower.cpp:116-117, absent at early InitIOKit point; late matching does not prove single-thread/deadline ordering. Actual AMFI wait stub resolves to native waitForMatchingService, argument 30000000000 ns. No new kernel/link/map or ABI qualification; full worker scheduling not closed. r2 archive preserved; no old matrix rerun. Parent reports ordinary review and independent verifier r2 PASS, report out/nuwa-platform-power-verifier-r2-20261113/verifier-summary.md. Existing restore independent host PASS is cited, not re-executed." },
