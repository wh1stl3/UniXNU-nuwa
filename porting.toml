  "2026-11-19 the only framebuffer writer on the device is still the boot-progress page. package/boot-progress/BootProgressDisplay.h is tracked now, but it is the diagnostic page's vinfo binding (depth 32, v_rowbytes stride, 18x42 px cells at scale 3), not a display path: there is no GopFramebuffer consumer and no launchd display service, so no frame is presented to the panel by the OS. The page's thin-stroke loss is downstream of the framebuffer store (rendering arithmetic, stride and channel order were checked and are correct), so it is a DPU/DSI/panel or mapping question, not a package one. Any real display work starts with the GopFramebuffer path and the panel power/backlight, neither of which exists here.",
  "2026-11-20 GopFramebuffer board half: package/NuwaLegacyDisplay.cpp supplies the two probe entry points the official hook patches call, the prepare_scanout bridge to boot_progress_prepare_scanout, a GPU-offer refusal and the observation stubs; board.toml selects the GopFramebuffer component. The 20H392 Legacy ABI (338 slots, nine abstract leaves, seven limited slots, nine instance fields, six request fields) was generated into package/OriginalLegacyFramebufferABI.h and package/original-bindings.S. No device build or run.",
