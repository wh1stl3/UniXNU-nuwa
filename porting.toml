  "2026-11-26 build-nuwa-display-native.py and package-nuwa-crashcap.py gained explicit SB0 W/R/WX profile support for the single-core candidate; rendering behavior is unchanged. Host self-checked, no display acceptance or runtime claim. See docs/nuwa-sb0-wr-20261126.md and docs/nuwa-sb0-wx-20261127.md.",
